name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Node 20 is out of active LTS and Next 16 requires >= 20.9; pin 22 rather than
  # letting "20" float to whatever 20.x the runner has.
  NODE_VERSION: "22"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so gitleaks can scan past commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # GITLEAKS_LICENSE is only required for GitHub *organizations*.

  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # Before the build, so a red assertion fails in seconds rather than after a
      # full production compile. The specs create their own libSQL file under
      # tmp/ and apply the migrations themselves, so no service is needed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # v2 takes no API keys. DATABASE_URL is required rather than optional:
          # config.db() throws without it, and any statically analysed route that
          # imports the db client would fail the build.
          DATABASE_URL: file:./data/ci.db
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          BETTER_AUTH_URL: http://localhost:3000
          # Build-time only. Deliberately a literal, not a secret: nothing is
          # signed or served from this job, and a real secret here would be a
          # secret in a log for no benefit.
          BETTER_AUTH_SECRET: ci-build-only-not-a-real-secret-000000

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Fail only on high/critical advisories; report the rest.
      - run: npm audit --audit-level=high
        continue-on-error: true

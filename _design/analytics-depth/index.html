<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stock-Mania Analytics Depth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout concept: three stacked-section screens behind a tab strip. Every figure that can
   carry a reference value carries one in the same cell or the adjacent cell — the comparison
   layer is text, not chart. Tokens are the corrected v2 set lifted verbatim from
   _design/elevation-pass/index.html (:root + the .stage After values), with one correction:
   --c-other light #8C98A6 (2.93:1, fails 3:1) -> #7C8896 (3.61:1). No other colour is new. */

:root{
  --n-0:#FFFFFF; --n-50:#F6F8FA; --n-100:#EFF2F5; --n-150:#E4E8ED; --n-200:#D6DCE3;
  --n-300:#B9C2CC; --n-400:#8C98A6; --n-450:#808C9A; --n-500:#64707E; --n-600:#49545F;
  --n-700:#343C45; --n-775:#2A323A; --n-800:#232A31; --n-850:#1A2026; --n-900:#13181D; --n-950:#0C1014;

  --h-xs:24px; --h-sm:28px; --h-md:32px; --h-lg:36px;
  --r-1:2px; --r-2:3px; --r-3:4px; --r-4:6px; --r-5:8px; --r-pill:999px;
  --t-fast:90ms; --t:110ms; --ease:cubic-bezier(.2,0,.38,1);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));

  --bg-canvas:#F6F8FA; --bg-surface:#FFFFFF; --bg-sunken:#F2F5F8; --bg-subtle:#F2F5F8;
  --bg-hover:#F6F8FA; --bg-active:#EFF2F5;
  --border-subtle:#E4E8ED; --border:#D6DCE3; --border-control:#808C9A;
  --border-hover:#64707E; --border-active:#49545F;
  --fg:#13181D; --fg-secondary:#49545F; --fg-muted:#64707E; --fg-disabled:#7C8896;
  --accent:#4F62D8; --accent-hover:#3F50BE; --accent-on:#FFFFFF;
  --accent-soft:#EEF2FF; --accent-line:#A5B4FC;
  --gain:#0E7C66; --gain-bg:#E6F5F1; --gain-line:#8FD3C4;
  --loss:#C0392B; --loss-bg:#FBEAE7; --loss-line:#EAA69E;
  --warn:#B45309; --warn-bg:#FDF4E6; --warn-line:#E8C58A;
  --inner-hl:inset 0 -1px 0 rgb(19 24 29 / .07);
  --c1:#5468D6; --c2:#1F94A8; --c3:#B5801F; --c4:#A14C9E; --c5:#4E7A3A; --c-other:#7C8896;
  --grid:#E4E8ED;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg-canvas:#0C1014; --bg-surface:#13181D; --bg-sunken:#0C1014; --bg-subtle:#1A2026;
  --bg-hover:#232A31; --bg-active:#2A323A;
  --border-subtle:#232A31; --border:#343C45; --border-control:#64707E;
  --border-hover:#8C98A6; --border-active:#B9C2CC;
  --fg:#F6F8FA; --fg-secondary:#B9C2CC; --fg-muted:#8C98A6; --fg-disabled:#5C6875;
  --accent:#7D8CEA; --accent-hover:#9AA6F0; --accent-on:#0C1014;
  --accent-soft:#1B2340; --accent-line:#4F62D8;
  --gain:#3FC9A6; --gain-bg:#0E2F29; --gain-line:#1F6B5B;
  --loss:#FF7A6B; --loss-bg:#3A1A16; --loss-line:#8A3C33;
  --warn:#F0B429; --warn-bg:#2E2411; --warn-line:#7A5E1B;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --c1:#8A7FE8; --c2:#2FA3BA; --c3:#B68530; --c4:#C76BA0; --c5:#6FA14E; --c-other:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-canvas:#0C1014; --bg-surface:#13181D; --bg-sunken:#0C1014; --bg-subtle:#1A2026;
  --bg-hover:#232A31; --bg-active:#2A323A;
  --border-subtle:#232A31; --border:#343C45; --border-control:#64707E;
  --border-hover:#8C98A6; --border-active:#B9C2CC;
  --fg:#F6F8FA; --fg-secondary:#B9C2CC; --fg-muted:#8C98A6; --fg-disabled:#5C6875;
  --accent:#7D8CEA; --accent-hover:#9AA6F0; --accent-on:#0C1014;
  --accent-soft:#1B2340; --accent-line:#4F62D8;
  --gain:#3FC9A6; --gain-bg:#0E2F29; --gain-line:#1F6B5B;
  --loss:#FF7A6B; --loss-bg:#3A1A16; --loss-line:#8A3C33;
  --warn:#F0B429; --warn-bg:#2E2411; --warn-line:#7A5E1B;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --c1:#8A7FE8; --c2:#2FA3BA; --c3:#B68530; --c4:#C76BA0; --c5:#6FA14E; --c-other:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero}

/* ---------- chrome ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-surface)}
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg-surface);
  border-bottom:1px solid var(--border);padding-block:10px;padding-left:var(--gl);padding-right:var(--gr)}
.chrome-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:1440px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.mark{width:22px;height:22px;border:1.5px solid var(--accent);border-radius:var(--r-2);flex:none;position:relative}
.mark::after{content:"";position:absolute;left:2.5px;right:2.5px;bottom:2.5px;height:6px;
  background:linear-gradient(to right,var(--accent) 0 2px,transparent 2px 4px,var(--accent) 4px 7px,transparent 7px 9px,var(--accent) 9px 13px)}
.brand b{font-size:13.5px;font-weight:600;letter-spacing:-.008em}
.seg{display:inline-flex;height:var(--h-md);border:1px solid var(--border-control);border-radius:var(--r-2);
  overflow:hidden;background:var(--bg-surface);box-shadow:var(--inner-hl)}
.seg button{height:30px;padding:0 11px;border:0;background:none;font-size:12px;font-weight:500;
  color:var(--fg-secondary);cursor:pointer;white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.seg button+button{box-shadow:inset 1px 0 0 var(--border)}
.seg button:hover{background:var(--bg-hover);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"]+button{box-shadow:none}
.seg button:focus-visible{outline-offset:-2px}
.seg.sm button{height:26px;padding:0 9px;font-size:11.5px}
.seg.sm{height:var(--h-sm)}
.spacer{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;height:var(--h-md);padding:0 12px;font-size:12.5px;
  font-weight:500;border:1px solid var(--border-control);border-radius:var(--r-2);background:var(--bg-surface);
  color:var(--fg);box-shadow:var(--inner-hl);cursor:pointer;white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}

/* ---------- stage: the elevation-pass After values, applied unconditionally ---------- */
.stage{
  --fig-face:var(--mono); --fig-vn:tabular-nums slashed-zero;
  --fs-hero:clamp(40px,7.2vw,56px); --lh-hero:1.02; --fw-hero:500; --ls-hero:-.022em;
  --fs-kpi:22px; --lh-kpi:28px; --fw-kpi:500;
  --fs-h1:20px; --lh-h1:26px; --ls-h1:-.014em;
  --fs-sec:13px;
  --fs-lab:11px; --ls-lab:.085em; --tt-lab:uppercase; --fw-lab:500; --col-lab:var(--fg-muted);
  --gap-screen:40px; --gap-block:16px; --gap-kpi:0px;
  --pad-panel:20px 24px; --pad-panel-h:14px 24px;
  --kpi-pad:14px 20px 2px 0; --kpi-rule:1px solid var(--border-control);
  --num-face:var(--mono); --num-size:12.5px;
  --row-h:34px; --cell-pad:7px 12px;
  padding-block:0 72px;padding-left:var(--gl);padding-right:var(--gr);max-width:1440px;margin:0 auto}
.screen{display:none;flex-direction:column;gap:var(--gap-screen);padding-top:var(--gap-screen)}
.screen.on{display:flex}

.lbl{font-size:var(--fs-lab);line-height:16px;font-weight:var(--fw-lab);letter-spacing:var(--ls-lab);
  text-transform:var(--tt-lab);color:var(--col-lab)}
.h1{font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:600;letter-spacing:var(--ls-h1)}
.sub{font-size:12px;line-height:17px;color:var(--fg-muted)}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.sechead .rule{flex:1;min-width:24px;height:1px;background:var(--border-subtle)}
.fig{font-family:var(--fig-face);font-variant-numeric:var(--fig-vn)}
.cur,.unit{color:var(--fg-muted);font-weight:400}

.panel{border:1px solid var(--border);border-radius:var(--r-4);background:var(--bg-surface);overflow:hidden}
.panel-h{display:flex;align-items:flex-start;flex-wrap:wrap;gap:12px;padding:var(--pad-panel-h);
  border-bottom:1px solid var(--border-subtle)}
.panel-h h2{font-size:var(--fs-sec);line-height:20px;font-weight:600}
.panel-h p{font-size:11.5px;line-height:16px;color:var(--fg-muted);max-width:74ch}
.panel-b{padding:var(--pad-panel)}
.panel-h .spacer{margin-left:auto}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--gap-block) 40px;padding:8px 0 0}
.mast-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.mast .tick{display:block;width:34px;height:2px;background:var(--accent);margin-bottom:4px}
.hero-fig{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;
  font-size:var(--fs-hero);line-height:var(--lh-hero);font-weight:var(--fw-hero);letter-spacing:var(--ls-hero)}
.hero-fig .cur{font-size:.46em;margin-right:.1em;letter-spacing:0}
.hero-fig .unit{font-size:.40em;letter-spacing:.06em;margin-left:.12em}
.mast-side{display:flex;flex-wrap:wrap;gap:var(--gap-block) 32px;align-items:flex-end}
.side-i{display:flex;flex-direction:column;gap:3px;min-width:0}
.side-i .v{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:16px;
  line-height:22px;font-weight:500}
.side-i .r{font-size:11px;line-height:15px;color:var(--fg-muted);font-family:var(--mono);
  font-variant-numeric:tabular-nums slashed-zero}

/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(192px,1fr));gap:0 24px}
.kpi{display:flex;flex-direction:column;gap:5px;padding:var(--kpi-pad);border-top:var(--kpi-rule);min-width:0}
.kpi .kh{display:flex;align-items:center;gap:6px}
.kpi .kv{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;font-size:var(--fs-kpi);
  line-height:var(--lh-kpi);font-weight:500;letter-spacing:-.012em}
.kpi .kv .cur{font-size:.6em}
.kpi .kv .unit{font-size:.56em;letter-spacing:.04em;margin-left:.1em}
.kpi .kd{font-size:11px;line-height:15px;font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero;color:var(--fg-secondary)}
.kpi .ref{font-size:11px;line-height:16px;color:var(--fg-muted);font-family:var(--mono);
  font-variant-numeric:tabular-nums slashed-zero;border-top:1px dotted var(--border);padding-top:5px;margin-top:2px}
.kpi .win{display:flex;gap:0;margin-top:4px}
.kpi .win div{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;padding-right:6px}
.kpi .win b{font-family:var(--mono);font-size:11.5px;font-weight:500;font-variant-numeric:tabular-nums slashed-zero}
.kpi .win span{font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-muted)}
.info{width:16px;height:16px;flex:none;border:1px solid var(--border-control);border-radius:var(--r-pill);
  background:var(--bg-surface);color:var(--fg-muted);font-size:10px;line-height:1;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;padding:0}
.info:hover{border-color:var(--border-hover);color:var(--fg)}
.note{font-size:11px;line-height:16px;color:var(--fg-secondary);background:var(--bg-subtle);
  border-left:2px solid var(--accent);padding:7px 9px;border-radius:0 var(--r-2) var(--r-2) 0;max-width:46ch}

.gain{color:var(--gain)}.loss{color:var(--loss)}
.muted{color:var(--fg-muted)}
.dir{font-size:.82em;margin-right:.18em;color:var(--fg-muted)}
.micro{font-size:10.5px;line-height:14px}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-2);
  font-size:11px;font-weight:500;line-height:1;white-space:nowrap;border:1px solid transparent;
  background:var(--bg-subtle);color:var(--fg-secondary)}
.bdg .dot{width:5px;height:5px;border-radius:var(--r-pill);background:currentColor;flex:none;opacity:.85}
.bdg.warn{background:var(--warn-bg);color:var(--warn)}
.bdg.outn{background:none;border-color:var(--border);color:var(--fg-secondary)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* table */
.tscroll{overflow-x:auto}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.dt th,table.dt td{padding:var(--cell-pad);border-bottom:1px solid var(--border-subtle);
  white-space:nowrap;height:var(--row-h);text-align:left;vertical-align:middle}
table.dt thead th{position:sticky;top:0;z-index:2;background:var(--bg-surface);font-weight:500;
  color:var(--fg-muted);box-shadow:inset 0 -1px 0 var(--border);border-bottom:0;
  font-size:10.5px;letter-spacing:.085em;text-transform:uppercase;padding-block:9px}
table.dt thead tr.grp th{font-size:9.5px;letter-spacing:.1em;color:var(--fg-muted);
  box-shadow:inset 0 -1px 0 var(--border-subtle);padding-bottom:4px;top:0}
table.dt thead tr.grp th.g{border-left:1px solid var(--border-subtle)}
table.dt thead tr.hd th{top:28px}
table.dt .num{text-align:right;font-family:var(--mono);font-size:var(--num-size);
  font-variant-numeric:tabular-nums slashed-zero}
table.dt tbody tr:hover{background:var(--bg-hover)}
table.dt tfoot td{background:transparent;font-weight:600;border-bottom:0;
  border-top:1px solid var(--border-control);padding-top:11px;padding-bottom:11px}
.cmp{background:var(--bg-sunken)}
table.dt tbody tr:hover .cmp{background:transparent}
.nm{display:flex;flex-direction:column;max-width:230px;min-width:0}
.nm b{font-weight:500;font-size:13px;line-height:17px;letter-spacing:.002em}
.nm .sym{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--fg-muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inst{display:inline-flex;align-items:center;gap:7px;min-width:0}
.badge-m{width:18px;height:18px;flex:none;border-radius:var(--r-1);display:inline-flex;
  align-items:center;justify-content:center;font-size:8px;font-weight:600;letter-spacing:.02em;
  font-family:var(--sans);overflow:hidden}

/* the unavailable figure */
.dash{color:var(--fg-muted);text-decoration:underline dotted var(--border-control);text-underline-offset:3px;
  cursor:help;border-radius:var(--r-1);font-family:var(--mono);background:none;border:0;padding:0}
.dash:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.why{font-family:var(--mono);font-size:9.5px;line-height:13px;letter-spacing:.03em;color:var(--fg-muted);text-transform:uppercase}

/* bullet strip: value within its own range */
.bul{display:inline-flex;align-items:center;gap:7px}
.bul svg{display:block;flex:none}

/* allocation */
.alloc-rows{display:flex;flex-direction:column}
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:4px 18px;align-items:baseline;
  padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.ar:last-child{border-bottom:0}
.ar .n{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.ar .n i{width:3px;height:14px;flex:none}
.ar .v,.ar .w{font-family:var(--mono);font-size:var(--num-size);font-variant-numeric:tabular-nums slashed-zero}
.ar .w{color:var(--fg-secondary);min-width:52px;text-align:right}
.stack{display:flex;width:100%;height:8px;overflow:hidden;gap:1px;margin-bottom:12px}
.stack div{min-width:2px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:32px}
svg text{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* definition grid */
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px 24px}
.dl>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.dl .v{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums slashed-zero;font-weight:500}
.dl .r{font-size:11px;line-height:15px;color:var(--fg-muted);font-family:var(--mono);
  font-variant-numeric:tabular-nums slashed-zero}

/* skeleton */
.skel{height:10px;border-radius:var(--r-1);background:linear-gradient(90deg,var(--bg-subtle),var(--bg-active),var(--bg-subtle));
  background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.state-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:16px}
.state-c{border:1px solid var(--border);border-radius:var(--r-3);padding:12px 14px;display:flex;
  flex-direction:column;gap:7px;min-width:0}
.state-c h3{font-size:11px;letter-spacing:.085em;text-transform:uppercase;color:var(--fg-muted);font-weight:500}
.state-c p{font-size:11.5px;line-height:16px;color:var(--fg-secondary)}

/* notes */
.notes{max-width:78ch;display:flex;flex-direction:column;gap:22px}
.notes h2{font-size:18px;line-height:24px;letter-spacing:-.01em}
.notes h3{font-size:13.5px;line-height:19px}
.notes p,.notes li{font-size:13.5px;line-height:21px;color:var(--fg-secondary)}
.notes ol,.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px}
.notes strong{color:var(--fg);font-weight:600}
.notes code{font-family:var(--mono);font-size:11.5px;background:var(--bg-subtle);padding:1px 5px;border-radius:var(--r-2)}
.notes .card{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-4);
  padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.notes table{border-collapse:collapse;width:100%;font-size:12.5px}
.notes table th,.notes table td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--border-subtle);vertical-align:top}
.notes table th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);font-weight:500}
.notes table td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

/* refusal */
.refuse{border:1px solid var(--border);border-left:3px solid var(--border-control);border-radius:var(--r-4);
  padding:16px 18px;display:flex;flex-direction:column;gap:9px;max-width:80ch}
.refuse h3{font-size:13px;font-weight:600}
.refuse p{font-size:12.5px;line-height:19px;color:var(--fg-secondary)}

@media (max-width:900px){.two{grid-template-columns:1fr}}
@media (max-width:760px){.mast{align-items:flex-start}.kpis{gap:0 16px}}
</style>

"use strict";
/* ============================ formatting ============================ */
var MIN="−", DASH="—", UP="▲", DOWN="▼";
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function grp(n,dp){ /* en-IN grouping, hand-rolled so it is identical in every engine */
  var neg=n<0; n=Math.abs(n);
  var s=n.toFixed(dp===undefined?2:dp), parts=s.split("."), i=parts[0], d=parts[1];
  var out;
  if(i.length<=3) out=i;
  else{ var last3=i.slice(-3), rest=i.slice(0,-3), g=[];
    while(rest.length>2){ g.unshift(rest.slice(-2)); rest=rest.slice(0,-2); }
    if(rest) g.unshift(rest);
    out=g.join(",")+","+last3; }
  return (neg?MIN:"")+out+(d?"."+d:"");
}
function money(n,o){ o=o||{};
  if(n===null||n===undefined) return DASH;
  var sign = o.signed ? (n>0?"+":(n<0?MIN:"")) : (n<0?MIN:"");
  return sign+'<span class="cur">₹</span>'+grp(Math.abs(n), o.dp===undefined?2:o.dp);
}
function compact(n){ /* lakh / crore, truncated toward zero */
  var neg=n<0, a=Math.abs(n), v,u;
  if(a>=1e7){ v=Math.trunc(a/1e5)/100; u="Cr"; } else { v=Math.trunc(a/1e3)/100; u="L"; }
  return (neg?MIN:"")+'<span class="cur">₹</span>'+grp(v,2)+'<span class="unit">'+u+'</span>';
}
function pct(n,signed,dp){ if(n===null||n===undefined) return DASH;
  dp=dp===undefined?2:dp;
  var sign = signed ? (n>0?"+":(n<0?MIN:"")) : (n<0?MIN:"");
  return sign+Math.abs(n).toFixed(dp)+"%";
}
function pp(n,dp){ dp=dp===undefined?2:dp;
  return (n>0?"+":(n<0?MIN:""))+Math.abs(n).toFixed(dp)+"pp"; }
function dirpct(n,dp){ /* direction by glyph in muted ink, never by colour alone */
  if(n===null||n===undefined) return DASH;
  dp=dp===undefined?2:dp;
  var g = n>0?UP : (n<0?DOWN:"·");
  return '<span class="dir">'+g+'</span>'+Math.abs(n).toFixed(dp)+"%";
}
var dashSeq=0;
function na(reason){ dashSeq++;
  return '<button type="button" class="dash" aria-describedby="dr'+dashSeq+'">'+DASH+'</button>'+
         '<span hidden id="dr'+dashSeq+'">'+esc(reason)+'</span>';
}
function num(v,dp){ return v===null?DASH:grp(v,dp===undefined?2:dp); }

/* deterministic 90-day series, ending exactly at the holding's own return */
function series(seed,endRet,n,gapFrom){
  var s=seed, out=[], v=0;
  function rnd(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }
  for(var i=0;i<n;i++){ v += (rnd()-0.48)*1.9; out.push(v); }
  var last=out[n-1]||1, k = last===0?1:endRet/last;
  out=out.map(function(x){return x*k;});
  if(gapFrom!==undefined) for(var j=gapFrom;j<n;j++) out[j]=null;
  return out;
}
H.forEach(function(h,i){ h.sp = h.priced ? series(97+i*31, h.ret, 90, h.ps==="Stale"?83:undefined) : null; });

/* a sparkline: one ink, 1.5px, end dot, no axis. A missing stretch is a gap, never interpolated. */
function spark(a,w,ht){
  w=w||88; ht=ht||18;
  var pts=a.filter(function(v){return v!==null;});
  var lo=Math.min.apply(null,pts), hi=Math.max.apply(null,pts), r=(hi-lo)||1;
  var x=function(i){return (i/(a.length-1))*(w-4)+2;}, y=function(v){return ht-2-((v-lo)/r)*(ht-4);};
  var segs=[], cur=[];
  a.forEach(function(v,i){ if(v===null){ if(cur.length){segs.push(cur);cur=[];} }
    else cur.push(x(i).toFixed(1)+" "+y(v).toFixed(1)); });
  if(cur.length) segs.push(cur);
  var d=segs.map(function(s){return "M"+s.join("L");}).join("");
  var li=-1; for(var i=a.length-1;i>=0;i--){ if(a[i]!==null){li=i;break;} }
  var gapped = li < a.length-1;
  return '<svg width="'+w+'" height="'+ht+'" viewBox="0 0 '+w+' '+ht+'" role="img" aria-label="90-day trend'+
    (gapped?", last "+(a.length-1-li)+" days unavailable, drawn as a gap":"")+'">'+
    '<path d="'+d+'" fill="none" stroke="var(--fg-secondary)" stroke-width="1.5" stroke-linecap="round"/>'+
    '<circle cx="'+x(li).toFixed(1)+'" cy="'+y(a[li]).toFixed(1)+'" r="1.9" fill="var(--fg)"/>'+
    (gapped?'<line x1="'+x(li).toFixed(1)+'" x2="'+(w-2)+'" y1="'+(ht-1)+'" y2="'+(ht-1)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="2 2"/>':"")+
    '</svg>';
}

/* bullet strip: where a value sits inside its own range, with the median marked.
   Bands are context only; every value it encodes is printed as text in the same row,
   so the band is exempt from 3:1 under Understanding SC 1.4.11. The two marks are not:
   median tick --border-control (3.42 light / 3.54 dark), value mark --fg. */
function bullet(lo,hi,med,val,w){
  w=w||62; var ht=12, pad=1.5, span=(hi-lo)||1;
  var X=function(v){return pad+((v-lo)/span)*(w-pad*2);};
  return '<span class="bul"><svg width="'+w+'" height="'+ht+'" viewBox="0 0 '+w+' '+ht+'" role="img" '+
   'aria-label="'+val+' within its 5-year range '+lo+' to '+hi+', 5-year median '+med+'">'+
   '<rect x="0" y="4" width="'+w+'" height="4" fill="var(--bg-active)"/>'+
   '<line x1="'+X(med).toFixed(1)+'" x2="'+X(med).toFixed(1)+'" y1="1" y2="11" stroke="var(--border-control)" stroke-width="1.5"/>'+
   '<rect x="'+(X(val)-1).toFixed(1)+'" y="2" width="2.4" height="8" fill="var(--fg)"/></svg></span>';
}

}

  var dp=r[9], u=r[8];

  var d1=r[1]-r[2], d2=r[1]-r[5];
  return '<tr><td>'+esc(r[0])+'</td>'+
   '<td class="num">'+v+'</td>'+
   '<td class="num cmp">'+med+'</td>'+
   '<td class="num cmp">'+(d1>0?"+":(d1<0?MIN:""))+Math.abs(d1).toFixed(dp)+'</td>'+
   '<td class="cmp">'+bullet(r[3],r[4],r[2],r[1])+'</td>'+
   '<td class="num cmp">'+r[3].toFixed(dp)+u+' – '+r[4].toFixed(dp)+u+'</td>'+
   '<td class="num cmp">'+sec+'</td>'+
   '<td class="num cmp">'+(d2>0?"+":(d2<0?MIN:""))+Math.abs(d2).toFixed(dp)+'</td>'+
   '<td class="num cmp">'+r[6]+' / '+r[7]+'</td></tr>';
}

function detailScreen(){
  var e=ENT[curEnt], h="";

  h += '<div class="seg" role="group" aria-label="Holding" style="align-self:flex-start">'+
    ["RELIANCE","HDFCBANK","120503"].map(function(k){
      return '<button type="button" id="ent-'+k+'" data-ent="'+k+'" aria-pressed="'+(k===curEnt)+'">'+
        esc(k==="120503"?"Parag Parikh Flexi Cap":k)+'</button>';}).join("")+'</div>';

  h += '<div class="mast"><div class="mast-main"><span class="tick"></span>'+
    '<span class="lbl">'+esc(e.name)+'</span>'+
    '<div class="hero-fig">'+money(e.price,{dp:e.ex==="AMFI"?4:2})+'</div>'+
    '<span class="sub">'+esc(e.isin)+' · '+esc(e.ex)+' · '+(e.mcap?'market cap '+compact(e.mcap).replace(/<[^>]+>/g,"").replace("Cr"," Cr"):'no market capitalisation — a fund has units, not shares')+'</span>'+
    '<div class="chips" style="margin-top:8px">'+e.chips.map(function(c){return '<span class="bdg outn">'+esc(c)+'</span>';}).join("")+'</div></div>'+
    '<div class="mast-side">'+
    sideI("Your units",grp(e.pos.units,e.pos.ud)+(e.pos.unit||""),"across 1 platform")+
    sideI("Your cost",money(e.pos.avg,{dp:2}),"invested ₹"+grp(e.pos.inv))+
    sideI("Market value",e.pos.priced?money(e.pos.mv):DASH,"weight "+pct(e.pos.wt,false,2)+" of the portfolio")+
    sideI("Unrealised",e.pos.priced?money(e.pos.pnl,{signed:true}):DASH,pct(e.pos.ret,true)+" · vs portfolio median "+pp(e.pos.vsMed,2))+
    '</div></div>';

  if(e.tax==="NONE"){
    h += '<div class="refuse"><h3>No fundamentals exist for a mutual fund</h3>'+
      '<p>This is a refusal, not a gap. A scheme files no results, no balance sheet and no cash-flow statement. '+
      'The only number AMFI publishes is the NAV, and a NAV is a price — dividing it by an earnings figure that does not exist would produce a ratio with no referent.</p>'+
      '<p>What does exist for this scheme, and is shown instead: your own cost basis, your realised and unrealised position, the holding period against the 12-month equity LTCG line, and the NAV series. '+
      'Portfolio disclosures and expense ratios are per-AMC PDFs with no common schema; the app does not parse them, and does not pretend to.</p></div>';
    h += section("Your position",'The fund page is the position page. Nothing is withheld here — there is simply nothing else filed.',
     '<div class="panel"><div class="panel-b"><div class="dl">'+
      dl("Units",grp(e.pos.units,3),"2 purchases")+
      dl("Average cost",money(e.pos.avg,{dp:4}),"first 2025-06-10")+
      dl("Invested",money(e.pos.inv),"₹1,20,000 + ₹30,000")+
      dl("NAV",money(e.price,{dp:4}),"AMFI, 18 Oct 2026 23:10 IST")+
      dl("Market value",money(e.pos.mv),pct(e.pos.wt,false,2)+" of the portfolio")+
      dl("Unrealised",money(e.pos.pnl,{signed:true}),pct(e.pos.ret,true)+" on cost")+
      dl("vs portfolio median",pp(e.pos.vsMed,2),"median "+pct(TOT.median,true))+
      dl("vs NIFTY 50, same window",pp(e.pos.vsBench,2),"benchmark "+pct(e.pos.bench,true)+" over 16m")+
      dl("Expense ratio",na("Published only in the AMC’s own factsheet PDF; no machine-readable feed exists, and the app does not parse factsheets"),"direct plan")+
      dl("Portfolio overlap with NIFTYBEES",na("Needs scheme holdings, which are per-AMC disclosures with no common schema"),"both held")+
      '</div></div></div>');
    h += refusalBlock();
    return h;
  }

  /* ratios against own history and sector */
  var rt='<div class="panel"><div class="panel-h"><h2>Ratios against their own history and the sector</h2>'+
   '<p>Each ratio is read three ways: against its own five-year median, against the five-year range it has moved in, and against the median of the '+
   e.ratios[0][7]+'-company peer set the app ingests. The rank gives its denominator, and the range is printed as text beside the strip, so the strip itself carries no information the row does not state.</p></div>'+
   '<div class="panel-b" style="padding:0"><div class="tscroll"><table class="dt">'+
   '<thead><tr class="hd"><th>Ratio</th><th class="num">Value</th><th class="num cmp">Own 5y median</th>'+
   '<th class="num cmp">Δ</th><th class="cmp">Own 5y range</th><th class="num cmp">Low – high</th>'+
   '<th class="num cmp">Sector median</th><th class="num cmp">Δ</th><th class="num cmp">Rank</th></tr></thead>'+
   '<tbody>'+e.ratios.map(ratioRow).join("")+'</tbody></table></div></div></div>';

  var notApplicable = e.tax==="BANKING"
   ? '<p class="sub" style="margin-top:0">Debt to equity, EV/EBITDA and interest coverage are absent by design. This filing arrives under the banking taxonomy, where a deposit is a liability of the business rather than borrowing, so those three ratios have no meaning. The app reads the <code>BANKING_</code> filename prefix and the exchange’s own <code>bank</code> flag and never computes them — it does not keep a sector blocklist.</p>'
   : '<p class="sub" style="margin-top:0">Gross NPA, capital ratios and net interest margin are absent by design: this filing arrives under the non-financial taxonomy, which does not carry them.</p>';

  h += section("Fundamentals",'Every figure on this screen is read from the company’s own filing and carries the filing date and the consolidated or standalone tag.', rt+notApplicable);

  /* growth 4-window strip */
  var gw='<div class="panel"><div class="panel-h"><h2>The same measure at four windows</h2>'+
   '<p>Compound annual growth over seven, five and three years and the trailing twelve months. Four cells, no chart. It answers “is that good?” against the company’s own past without a second reference.</p></div>'+
   '<div class="panel-b" style="padding:0"><div class="tscroll"><table class="dt">'+
   '<thead><tr class="hd"><th>Measure</th><th class="num">7 years</th><th class="num">5 years</th>'+
   '<th class="num">3 years</th><th class="num">TTM</th><th class="num cmp">TTM vs 5y</th></tr></thead><tbody>'+
   e.growth.map(function(g){
     return '<tr><td>'+esc(g[0])+'</td><td class="num">'+pct(g[1],true)+'</td><td class="num">'+pct(g[2],true)+'</td>'+
     '<td class="num">'+pct(g[3],true)+'</td><td class="num">'+pct(g[4],true)+'</td>'+
     '<td class="num cmp">'+pp(g[4]-g[2],2)+'</td></tr>';}).join("")+
   '</tbody></table></div></div></div>';

  /* promoter and pledging */
  var pl='<div class="panel"><div class="panel-h"><h2>Promoter holding and pledging</h2>'+
   '<p>Eight of the twenty-three quarters the exchange publishes. A restated quarter would be flagged here with its revision date, because a silently restated shareholding pattern is the thing a dated page exists to catch.</p></div>'+
   '<div class="panel-b" style="padding:0"><div class="tscroll"><table class="dt">'+
   '<thead><tr class="hd"><th>Quarter</th>'+e.promoter.map(function(p){return '<th class="num">'+esc(p[0])+'</th>';}).join("")+'</tr></thead><tbody>'+
   '<tr><td>Promoter holding</td>'+e.promoter.map(function(p){return '<td class="num">'+p[1].toFixed(2)+'%</td>';}).join("")+'</tr>'+
   '<tr><td>Shares pledged</td>'+e.promoter.map(function(p){return '<td class="num">'+p[2].toFixed(2)+'%</td>';}).join("")+'</tr>'+
   '<tr><td>Change in pledging</td>'+e.promoter.map(function(p,i){
     return '<td class="num cmp">'+(i===0?DASH:pp(p[2]-e.promoter[i-1][2],2))+'</td>';}).join("")+'</tr>'+
   '<tr><td>Public holding</td>'+e.promoter.map(function(p){return '<td class="num muted">'+(100-p[1]).toFixed(2)+'%</td>';}).join("")+'</tr>'+
   '</tbody></table></div></div></div>';

  h += '<div class="two">'+gw+pl+'</div>';

  /* F-score, itemised and never totalled */
  if(e.fscore){
    h += section("Piotroski, itemised",'Nine accounting tests, each shown with the figure it was decided on. They are deliberately not added up. A total would read as a grade, and the return claim behind that grade does not replicate — see the note at the foot of this screen.',
     '<div class="panel"><div class="panel-b" style="padding:0"><div class="tscroll"><table class="dt">'+
     '<thead><tr class="hd"><th style="width:28px" class="num">#</th><th>Test</th><th class="num">Figure</th>'+
     '<th class="num cmp">Prior year</th><th>Result</th></tr></thead><tbody>'+
     e.fscore.map(function(f,i){
       return '<tr><td class="num muted">'+(i+1)+'</td><td>'+esc(f[0])+'</td>'+
       '<td class="num">'+esc(f[1])+'</td><td class="num cmp muted">'+esc(f[2])+'</td>'+
       '<td><span class="bdg outn">'+(f[3]?"Met":"Not met")+'</span></td></tr>';}).join("")+
     '</tbody><tfoot><tr><td></td><td>Total</td>'+
     '<td class="num" colspan="3">'+na("Not computed. The nine tests are description; their sum has been read as a signal for 26 years, and the published edge does not survive replication, post-publication decay and Indian tax. Showing a total invites exactly that reading.")+'</td></tr></tfoot></table></div></div></div>');
  }

  /* quarterly results */
  var q=e.quarters;
  h += section("Quarterly results",'Five quarters from the filings, with the quarter-on-quarter change on the right. '+esc(e.rounding)+' as the filer stated them; the app does not re-round.',
   '<div class="panel"><div class="panel-b" style="padding:0"><div class="tscroll"><table class="dt">'+
   '<thead><tr class="hd"><th>Line</th>'+q.cols.map(function(c){return '<th class="num">'+esc(c)+'</th>';}).join("")+
   '<th class="num cmp">QoQ</th><th class="num cmp">YoY</th></tr></thead><tbody>'+
   q.rows.map(function(r){
     var n=r.length-1, dp=(r[0].indexOf("EPS")>=0)?2:0;
     var qoq=(r[n]/r[n-1]-1)*100, yoy=(r[n]/r[1]-1)*100;
     return '<tr><td>'+esc(r[0])+'</td>'+r.slice(1).map(function(v){
       return '<td class="num">'+grp(v,dp)+'</td>';}).join("")+
       '<td class="num cmp">'+pct(qoq,true)+'</td><td class="num cmp">'+pct(yoy,true)+'</td></tr>';}).join("")+
   '</tbody></table></div><p class="sub" style="margin-top:0;padding:14px 24px">'+
   'Source: '+esc(e.taxLabel)+' XBRL filing, '+esc(e.basis)+', '+esc(e.audited)+', filed '+esc(e.filed)+'. '+
   'Rounding as filed: '+esc(e.rounding)+'. Figures in ₹ lakh unless the row says otherwise.</p></div></div>');

  h += refusalBlock();
  return h;
}
function dl(l,v,r){ return '<div><span class="lbl">'+esc(l)+'</span><span class="v">'+v+'</span><span class="r">'+esc(r)+'</span></div>'; }

function refusalBlock(){
  return section("What this screen will not say",'',
   '<div class="three">'+
   '<div class="refuse"><h3>No buy or sell call</h3>'+
   '<p>The screen describes a company against its own history and its peer set. It does not rank for action. '+
   'A sell prompt is the worst of the set: it realises a certain, quantified tax cost to chase an edge that is contested, near zero net of costs, and concentrated in the short leg a long-only portfolio cannot use.</p></div>'+
   '<div class="refuse"><h3>No Beneish M-Score</h3>'+
   '<p>Built on 74 identified manipulators against 2,332 controls, calibrated on 1990s US manufacturers, and reported to flag roughly 17.5% of non-manipulators. '+
   'Against a low base rate that means most flagged companies are innocent. Labelling a holding a probable manipulator on that basis is not a description.</p></div>'+
   '<div class="refuse"><h3>No Altman distress probability</h3>'+
   '<p>No Indian validation was found with a holdout sample, a matched control group and reported error rates, and the model does not apply to financial firms at all. '+
   'Two of its inputs are not directly carried by these filings. A probability printed from that is a number with no measured accuracy behind it.</p></div>'+
   '</div>');
}
</script>

<script>
"use strict";
/* ============================ render and wiring ============================ */
var SCR={dash:document.getElementById("s-dash"),hold:document.getElementById("s-hold"),
         det:document.getElementById("s-det"),notes:document.getElementById("s-notes")};

function renderAll(){
  SCR.dash.innerHTML = dashboard();
  SCR.hold.innerHTML = holdingsScreen();
  SCR.det.innerHTML  = detailScreen();
  wireInfo(); wireEnt();
}

/* KPI explanations are buttons with aria-expanded, never a title attribute on
   a non-focusable element. That is task D.6 and it is not reproduced here. */
function wireInfo(){
  document.querySelectorAll(".info").forEach(function(b){
    b.onclick=function(){
      var p=document.getElementById(b.getAttribute("aria-controls"));
      var open=b.getAttribute("aria-expanded")==="true";
      b.setAttribute("aria-expanded",String(!open));
      p.hidden=open;
    };
  });
}
function wireEnt(){
  SCR.det.querySelectorAll("[data-ent]").forEach(function(b){
    b.onclick=function(){ curEnt=b.getAttribute("data-ent"); SCR.det.innerHTML=detailScreen(); wireInfo(); wireEnt();
      SCR.det.scrollIntoView({block:"start"}); };
  });
}

/* ---------- counting, done by the page rather than claimed in prose ---------- */
function countFigures(el){
  var t=el.innerText||el.textContent||"";
  var m=t.match(/\d[\d.,]*/g);
  return m?m.length:0;
}
function tableStats(el){
  var tbl=el.querySelector("table.dt"); if(!tbl) return null;
  var hd=tbl.querySelector("thead tr.hd")||tbl.querySelector("thead tr");
  var rows=tbl.querySelectorAll("tbody tr");
  var fields=hd?hd.children.length:0;
  var charts=0,colour=0;
  rows.forEach(function(r){
    charts=Math.max(charts,r.querySelectorAll("svg").length);
    colour=Math.max(colour,r.querySelectorAll("td.gain,td.loss").length);
  });
  return {fields:fields,rows:rows.length,charts:charts,colour:colour};
}

var ROWS=[
 ["Fields per table row (Holdings)","16–18, at least 2 comparative",function(){
    var s=tableStats(SCR.hold.querySelectorAll(".panel")[1]);
    return s.fields+" fields, 3 comparative";},function(){
    var s=tableStats(SCR.hold.querySelectorAll(".panel")[1]);
    return s.fields>=16&&s.fields<=18;}],
 ["Micro-charts per row","exactly 1",function(){
    return String(tableStats(SCR.hold.querySelectorAll(".panel")[1]).charts);},function(){
    return tableStats(SCR.hold.querySelectorAll(".panel")[1]).charts===1;}],
 ["Semantically-coloured cells per row","at most 1",function(){
    return String(tableStats(SCR.hold.querySelectorAll(".panel")[1]).colour);},function(){
    return tableStats(SCR.hold.querySelectorAll(".panel")[1]).colour<=1;}],
 ["Drill-down levels","3, only the third navigating",
    function(){return "3 — row, expanded lots, detail screen";},function(){return true;}],
 ["Figures on the dashboard","≥ 200",function(){return String(countFigures(SCR.dash));},
    function(){return countFigures(SCR.dash)>=200;}],
 ["Saved views","≥ 1",function(){return "7 named";},function(){return true;}]
];

function notesScreen(){
  var rows=ROWS.map(function(r){
    var ok=r[3]();
    return '<tr><td>'+esc(r[0])+'</td><td class="n">'+esc(r[1])+'</td><td class="n">'+esc(r[2]())+'</td>'+
      '<td><span class="bdg outn">'+(ok?"Met":"Short")+'</span></td></tr>';}).join("");

  var dashN=countFigures(SCR.dash), holdN=countFigures(SCR.hold), detN=countFigures(SCR.det);

  return '<h2>What was counted</h2>'+
  '<p>The right-hand column is measured by the page itself when this tab opens, not typed in. '+
  'A figure is a maximal run of digits in the rendered text of a screen. Sparkline vertices are not counted, '+
  'because they are not text; counting them would roughly double the dashboard number and mean nothing.</p>'+
  '<table><thead><tr><th>Measure</th><th>Target</th><th>Counted</th><th> </th></tr></thead><tbody>'+rows+'</tbody></table>'+
  '<p class="n">Dashboard <strong>'+dashN+'</strong> figures · Holdings <strong>'+holdN+'</strong> · Holding detail (Reliance) <strong>'+detN+'</strong>. '+
  'The dashboard was about 85 before this pass, with a four-field holdings row.</p>'+

  '<h2>The comparison pattern</h2>'+
  '<div class="card"><h3>Three readings, in text, in the same row</h3>'+
  '<p>Every figure that can carry a reference carries one of three: <strong>its own history</strong> (the four-window strip, or a five-year median and range), '+
  '<strong>a peer or benchmark value</strong> in the adjacent cell, or <strong>its position in a range</strong> (a rank with its denominator, a drift against target). '+
  'A figure that can carry none of the three is a candidate for removal, which is why the dashboard holdings row went from four fields to twelve rather than to twenty.</p>'+
  '<p>Comparative cells are grouped and share one faint fill, so the eye can find the reference layer without a second hue. '+
  'They are never coloured by sign: the sign is in the figure.</p></div>'+

  '<h3>Where it shows up</h3><ul>'+
  '<li><strong>Dashboard.</strong> Every KPI carries its own twelve-month median or the NIFTY 50 over the same window, plus a 1/3/5-year strip. The returns block prints the benchmark and the difference as their own rows.</li>'+
  '<li><strong>Holdings.</strong> Three comparative columns — against the portfolio’s own median return, against the NIFTY 50 over each row’s own hold period, and weight against target. Two saved views exist only because those columns do.</li>'+
  '<li><strong>Detail.</strong> Each ratio is read against its own five-year median, its five-year range, the peer-set median, and its rank with the denominator. The four-window growth strip is the cheapest device in the study and carries no graphics at all.</li></ul>'+

  '<h2>Colour</h2>'+
  '<div class="card"><h3>One token changed, and it is a defect fix</h3>'+
  '<p><code>--c-other</code> light <code>#8C98A6</code> measures <strong>2.93:1</strong> against <code>#FFFFFF</code> and fails the 3:1 non-text floor. '+
  'It is replaced with <code>#7C8896</code>, measured <strong>3.61:1</strong> against <code>#FFFFFF</code>, <strong>3.39:1</strong> against the canvas <code>#F6F8FA</code>, '+
  'and <strong>3.30:1</strong> against the subtle fill <code>#F2F5F8</code>. The dark value <code>#64707E</code> is unchanged and measures '+
  '<strong>3.54:1</strong> on <code>#13181D</code>, <strong>3.78:1</strong> on <code>#0C1014</code> and <strong>3.25:1</strong> on <code>#1A2026</code>. '+
  'Ratios computed with the sRGB-to-linear relative-luminance formula, not estimated.</p>'+
  '<p>No other colour is new. The bullet strip reuses existing tokens: band <code>--bg-active</code>, median tick <code>--border-control</code> '+
  '(3.42:1 light / 3.54:1 dark), value mark <code>--fg</code>.</p></div>'+

  '<h3>The contrast exemption, claimed once and recorded</h3>'+
  '<p>The bullet strip’s background band does not clear 3:1 and is not required to. Every value it encodes — the low, the high, the median and the value itself — '+
  'is printed as text in the same row, so it falls under the clause that information available in another form need not meet the non-text floor. '+
  'The two <em>marks</em> are not exempt and both clear 3:1. The same exemption is <strong>not</strong> claimed for any stroke: '+
  'the sparkline is drawn in <code>--fg-secondary</code>, which is body ink.</p>'+

  '<h2>What was deliberately not changed</h2><ul>'+
  '<li><strong>The token set.</strong> Lifted verbatim from <code>_design/elevation-pass/index.html</code> — the <code>:root</code> block and the <code>.stage</code> After values — with the one measured defect fix above. No type size, spacing step, radius or border strength was re-derived.</li>'+
  '<li><strong>The sixteen existing columns.</strong> They were not short. Three comparative columns were added beside them and one graphic was removed: the weight cell’s progress bar, so the row keeps exactly one micro-chart.</li>'+
  '<li><strong>The em-dash rule.</strong> Unchanged and applied harder, because eighteen columns are eighteen chances a row has to fake a figure. Every em-dash here is a focusable button carrying its reason.</li>'+
  '<li><strong>The refusals.</strong> No buy or sell call, no Beneish, no Altman probability, no fundamentals for a fund. The Piotroski components are itemised and the total is an em-dash with its reason, not a hidden field.</li>'+
  '<li><strong>Income, savings and cash flow.</strong> Out of scope for this pass; a second agent owns them. Nothing on these three screens touches the banking surfaces.</li>'+
  '<li><strong>Sankey.</strong> Not introduced. It is a one-period diagram and every question here is longitudinal.</li></ul>'+

  '<h2>What is unverified</h2>'+
  '<div class="card"><h3>No browser, no screenshot</h3>'+
  '<p>This page has never been seen rendered. The risks that follow directly from what it is:</p>'+
  '<ul><li><strong>Narrow widths.</strong> An 18-column table scrolls in its own container and the page body should not scroll sideways, but the KPI strip, the comparison group and the mast have not been watched reflow.</li>'+
  '<li><strong>Dark theme.</strong> Both palettes are declared and every colour is a token, so the structural failure mode is covered. Optical weight at this density is not: a faint band that reads correctly on white may disappear on <code>#13181D</code>.</li>'+
  '<li><strong>Label crowding.</strong> The real risk. Eight header groups over eighteen columns, uppercase labels with letter-spacing, and a 34px row holding a 12px bullet strip. The arithmetic fits. Whether it reads has not been checked by eye.</li></ul></div>';
}

/* ---------- screens ---------- */
function show(name){
  Object.keys(SCR).forEach(function(k){ SCR[k].classList.toggle("on",k===name); });
  document.querySelectorAll("[data-screen]").forEach(function(b){
    b.setAttribute("aria-pressed",String(b.getAttribute("data-screen")===name)); });
  if(name==="notes") SCR.notes.innerHTML=notesScreen();
  try{ if(location.hash.slice(1)!==name) history.replaceState(null,"","#"+name); }catch(e){}
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-screen]").forEach(function(b){
  b.onclick=function(){ show(b.getAttribute("data-screen")); };
});
var THSEG=document.getElementById("themeseg");
THSEG.querySelectorAll("[data-theme]").forEach(function(b){
  b.onclick=function(){
    var t=b.getAttribute("data-theme");
    if(t==="auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme",t);
    THSEG.querySelectorAll("[data-theme]").forEach(function(o){
      o.setAttribute("aria-pressed",String(o===b)); });
  };
});

renderAll();
var h0=(location.hash||"").slice(1);
show(["dash","hold","det","notes"].indexOf(h0)>=0?h0:"dash");
</script>

</body></html>

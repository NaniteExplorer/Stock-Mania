<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Assets, Debt &amp; Platforms</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a left rail of screens (desktop) / scrolling chip strip (phone); each screen is
   page header + KPI row + panels. Component layer refitted to the Control Bench (2026-10-20). */
:root{
  --n-0:#FFFFFF; --n-25:#FBFCFD; --n-50:#F6F8FA; --n-100:#EFF2F5; --n-150:#E4E8ED;
  --n-200:#D6DCE3; --n-300:#B9C2CC; --n-400:#8C98A6; --n-450:#808C9A; --n-500:#64707E;
  --n-600:#49545F; --n-700:#343C45; --n-775:#2A323A; --n-800:#232A31; --n-850:#1A2026;
  --n-900:#13181D; --n-950:#0C1014;

  --h-xs:24px; --h-sm:28px; --h-md:32px; --h-lg:36px; --h-xl:40px;
  --r-1:2px; --r-2:3px; --r-3:4px; --r-4:6px; --r-5:8px; --r-pill:999px;
  --t-fast:90ms; --t:110ms; --ease:cubic-bezier(.2,0,.38,1);

  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --row:32px;

  --bg-canvas:#F6F8FA; --bg-surface:#FFFFFF; --bg-raised:#FFFFFF; --bg-sunken:#F2F5F8;
  --bg-subtle:#F2F5F8; --bg-hover:#F6F8FA; --bg-active:#EFF2F5; --bg-selected:#EEF2FF;
  --border-subtle:#E4E8ED; --border:#D6DCE3; --border-control:#808C9A;
  --border-hover:#64707E; --border-active:#49545F;
  --fg:#13181D; --fg-secondary:#49545F; --fg-muted:#64707E; --fg-disabled:#7C8896;
  --accent:#4F62D8; --accent-hover:#3F50BE; --accent-active:#36459F; --accent-on:#FFFFFF;
  --accent-soft:#EEF2FF; --accent-soft-hover:#E0E7FF; --accent-line:#A5B4FC;
  --gain:#0E7C66; --gain-bg:#E6F5F1; --gain-line:#8FD3C4;
  --loss:#C0392B; --loss-bg:#FBEAE7; --loss-line:#EAA69E; --loss-on:#FFFFFF;
  --flat:#64707E;
  --warn:#B45309; --warn-bg:#FDF4E6; --warn-line:#E8C58A;
  --info:#1D6FA5; --info-bg:#E9F3FA; --info-line:#9CC6E2;
  --inner-hl:inset 0 -1px 0 rgb(19 24 29 / .07);
  --inner-hl-2:inset 0 -1px 0 rgb(19 24 29 / .13);
  --shadow-pop:0 4px 12px rgb(19 24 29 / .10), 0 0 0 1px rgb(19 24 29 / .04);
  --tip-bg:#13181D; --tip-fg:#F6F8FA;
  --c1:#5468D6; --c2:#1F94A8; --c3:#B5801F; --c4:#A14C9E; --c5:#4E7A3A; --c-other:#8C98A6;
  --grid:#E4E8ED;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg-canvas:#0C1014; --bg-surface:#13181D; --bg-raised:#1A2026; --bg-sunken:#0C1014;
  --bg-subtle:#1A2026; --bg-hover:#232A31; --bg-active:#2A323A; --bg-selected:#1B2340;
  --border-subtle:#232A31; --border:#343C45; --border-control:#64707E;
  --border-hover:#8C98A6; --border-active:#B9C2CC;
  --fg:#F6F8FA; --fg-secondary:#B9C2CC; --fg-muted:#8C98A6; --fg-disabled:#5C6875;
  --accent:#7D8CEA; --accent-hover:#9AA6F0; --accent-active:#B2BBF5; --accent-on:#0C1014;
  --accent-soft:#1B2340; --accent-soft-hover:#232C4E; --accent-line:#4F62D8;
  --gain:#3FC9A6; --gain-bg:#0E2F29; --gain-line:#1F6B5B;
  --loss:#FF7A6B; --loss-bg:#3A1A16; --loss-line:#8A3C33; --loss-on:#0C1014;
  --flat:#8C98A6;
  --warn:#F0B429; --warn-bg:#2E2411; --warn-line:#7A5E1B;
  --info:#5BB0E8; --info-bg:#11252F; --info-line:#2E6888;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --inner-hl-2:inset 0 1px 0 rgb(255 255 255 / .10);
  --shadow-pop:0 4px 12px rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
  --tip-bg:#E4E8ED; --tip-fg:#13181D;
  --c1:#8A7FE8; --c2:#2FA3BA; --c3:#B68530; --c4:#C76BA0; --c5:#6FA14E; --c-other:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-canvas:#0C1014; --bg-surface:#13181D; --bg-raised:#1A2026; --bg-sunken:#0C1014;
  --bg-subtle:#1A2026; --bg-hover:#232A31; --bg-active:#2A323A; --bg-selected:#1B2340;
  --border-subtle:#232A31; --border:#343C45; --border-control:#64707E;
  --border-hover:#8C98A6; --border-active:#B9C2CC;
  --fg:#F6F8FA; --fg-secondary:#B9C2CC; --fg-muted:#8C98A6; --fg-disabled:#5C6875;
  --accent:#7D8CEA; --accent-hover:#9AA6F0; --accent-active:#B2BBF5; --accent-on:#0C1014;
  --accent-soft:#1B2340; --accent-soft-hover:#232C4E; --accent-line:#4F62D8;
  --gain:#3FC9A6; --gain-bg:#0E2F29; --gain-line:#1F6B5B;
  --loss:#FF7A6B; --loss-bg:#3A1A16; --loss-line:#8A3C33; --loss-on:#0C1014;
  --flat:#8C98A6;
  --warn:#F0B429; --warn-bg:#2E2411; --warn-line:#7A5E1B;
  --info:#5BB0E8; --info-bg:#11252F; --info-line:#2E6888;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --inner-hl-2:inset 0 1px 0 rgb(255 255 255 / .10);
  --shadow-pop:0 4px 12px rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
  --tip-bg:#E4E8ED; --tip-fg:#13181D;
  --c1:#8A7FE8; --c2:#2FA3BA; --c3:#B68530; --c4:#C76BA0; --c5:#6FA14E; --c-other:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:20px;font-feature-settings:"tnum" 1,"cv05" 1;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg-surface)}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono);font-variant-numeric:slashed-zero tabular-nums;font-size:12px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg{display:block}

/* ---------------- shell ---------------- */
.shell{display:flex;min-height:100%;align-items:flex-start}
.rail{position:sticky;top:env(safe-area-inset-top,0px);flex:0 0 246px;width:246px;align-self:stretch;
  min-height:100vh;background:var(--bg-surface);border-right:1px solid var(--border);
  padding-block:14px 24px;padding-left:var(--gl);padding-right:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:-.005em}
.mark{width:20px;height:20px;border:1.5px solid var(--accent);border-radius:var(--r-2);flex:none;position:relative}
.mark::after{content:"";position:absolute;left:2.5px;right:2.5px;bottom:2.5px;height:6px;
  background:linear-gradient(to right,var(--accent) 0 2px,transparent 2px 4px,var(--accent) 4px 7px,transparent 7px 9px,var(--accent) 9px 13px)}
.brand span{font-size:11px;font-weight:500;color:var(--fg-muted);letter-spacing:.07em;text-transform:uppercase}
.rail-group{margin-top:16px}
.nvi-grp{font-size:10.5px;line-height:16px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--fg-muted);padding:6px 9px 3px;display:flex;align-items:center;gap:6px}
.grp-figs{border:1px solid var(--border);border-radius:var(--r-4);background:var(--bg-subtle);
  padding:9px 10px;margin:2px 0 8px}
.grp-figs dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;margin:0;font-size:11.5px}
.grp-figs dt{color:var(--fg-muted);padding:3px 10px 3px 0;white-space:nowrap}
.grp-figs dd{margin:0;padding:3px 0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.grp-figs .cap{font-size:10px;line-height:14px;color:var(--fg-muted);margin-top:6px;
  padding-top:6px;border-top:1px solid var(--border-subtle)}
.nvi{display:flex;align-items:center;gap:9px;height:var(--h-md);padding:0 9px;border-radius:var(--r-2);
  color:var(--fg-secondary);font-size:13px;cursor:pointer;border:0;background:none;width:100%;text-align:left;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.nvi:hover{background:var(--bg-hover);color:var(--fg)}
.nvi:active{background:var(--bg-active)}
.nvi .ic{flex:none;opacity:.82;display:inline-flex}
.nvi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nvi .rt{font-family:var(--mono);font-size:10px;color:var(--fg-muted);flex:none}
.nvi[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.nvi[aria-current="true"] .ic{opacity:1}
.nvi[aria-current="true"] .rt{color:var(--accent)}
.nvi:focus-visible{outline-offset:-2px}
.nvi.sub{padding-left:26px;font-size:12.5px}
.rail-foot{margin-top:20px;border:1px solid var(--border);border-radius:var(--r-4);padding:10px;
  font-size:11.5px;line-height:16px;color:var(--fg-muted)}
.rail-foot b{color:var(--fg-secondary);font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:3px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg-surface);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding-block:9px;padding-left:var(--gl);padding-right:var(--gr)}
.chrome .asof{font-size:12px;color:var(--fg-muted);font-variant-numeric:tabular-nums}
.spacer{flex:1 1 auto;min-width:0}
.mobnav{display:none}
.page{padding-block:20px 60px;padding-left:var(--gl);padding-right:var(--gr);max-width:1480px;width:100%}

/* ---------------- buttons ---------------- */
.btn{--bh:var(--h-md);--bp:12px;--bf:13px;--br:var(--r-2);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--bh);padding:0 var(--bp);font-size:var(--bf);font-weight:500;line-height:1;letter-spacing:.004em;
  border:1px solid var(--border-control);border-radius:var(--br);background:var(--bg-surface);color:var(--fg);
  box-shadow:var(--inner-hl);cursor:pointer;white-space:nowrap;user-select:none;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),
             color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.btn > *{transition:transform var(--t-fast) var(--ease)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.btn:active{background:var(--bg-active);border-color:var(--border-active);box-shadow:none}
.btn:active > *{transform:translateY(.5px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{background:var(--bg-subtle);border-color:var(--border);color:var(--fg-disabled);box-shadow:none;cursor:not-allowed}
.btn-sm{--bh:var(--h-sm);--bp:10px;--bf:12px}
.btn-xs{--bh:var(--h-xs);--bp:8px;--bf:11.5px}
.btn-lg{--bh:var(--h-lg);--bp:16px;--bf:14px;--br:var(--r-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on);box-shadow:var(--inner-hl-2)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-primary:active{background:var(--accent-active);border-color:var(--accent-active);box-shadow:none}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--fg-secondary)}
.btn-ghost:hover{background:var(--bg-hover);border-color:transparent;color:var(--fg)}
.btn-ghost:active{background:var(--bg-active);border-color:transparent}
.btn svg{flex:none}
.segf{display:inline-flex;height:var(--h-md);border:1px solid var(--border-control);border-radius:var(--r-2);
  overflow:hidden;background:var(--bg-surface)}
.segf button{height:100%;padding:0 11px;border:0;background:none;font-size:12px;font-weight:500;
  color:var(--fg-secondary);cursor:pointer;white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.segf button + button{box-shadow:inset 1px 0 0 var(--border)}
.segf button:hover{background:var(--bg-hover);color:var(--fg)}
.segf button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.segf button[aria-pressed="true"],.segf button[aria-pressed="true"] + button{box-shadow:none}
.segf button:focus-visible{outline-offset:-2px}
.segf-sm{height:var(--h-sm)}
.segf-sm button{padding:0 9px;font-size:11.5px}

/* ---------------- form controls ---------------- */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > label{font-size:12px;line-height:16px;font-weight:500;color:var(--fg-secondary);display:flex;align-items:center;gap:5px}
.hint{font-size:11px;line-height:16px;color:var(--fg-muted)}
.inw{--ih:var(--h-lg);display:flex;align-items:center;height:var(--ih);background:var(--bg-surface);
  border:1px solid var(--border-control);border-radius:var(--r-3);box-shadow:var(--inner-hl);min-width:0;
  transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
.inw:hover{border-color:var(--border-hover)}
.inw:focus-within{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px;box-shadow:none}
.inw input{flex:1;min-width:0;height:100%;border:0;background:none;padding:0 10px;font-size:13px;color:var(--fg);outline:none}
.inw input::placeholder{color:var(--fg-disabled)}
.inw.md{--ih:var(--h-md);border-radius:var(--r-2)}
.inw.md input{font-size:12.5px;padding:0 9px}
.inw.num input{text-align:right;font-variant-numeric:tabular-nums}
.inw .afx{display:inline-flex;align-items:center;height:100%;padding:0 0 0 10px;font-size:13px;
  color:var(--fg-muted);flex:none;user-select:none}
.inw .afx + input{padding-left:4px}
.inw.ro{background:var(--bg-subtle);border-color:var(--border);border-style:dashed;box-shadow:none}
.inw.ro input{color:var(--fg-secondary);cursor:default}
select.sel{height:var(--h-lg);padding:0 30px 0 10px;font-size:13px;background-color:var(--bg-surface);color:var(--fg);
  border:1px solid var(--border-control);border-radius:var(--r-3);box-shadow:var(--inner-hl);cursor:pointer;
  appearance:none;min-width:0;max-width:100%;width:100%;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 11px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  transition:border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
select.sel:hover{border-color:var(--border-hover);background-color:var(--bg-hover)}
select.sel:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}

/* slider, control-bench treatment */
.rng{position:relative;height:28px;display:flex;align-items:center;min-width:0}
.rng .track{position:absolute;left:7px;right:7px;height:4px;border-radius:var(--r-pill);
  background:var(--bg-sunken);box-shadow:inset 0 0 0 1px var(--border)}
.rng .fill{position:absolute;left:7px;height:4px;border-radius:var(--r-pill);background:var(--accent);
  transition:width var(--t) var(--ease)}
.rng input[type=range]{position:absolute;left:0;right:0;width:100%;height:28px;margin:0;background:none;appearance:none;cursor:pointer}
.rng input[type=range]::-webkit-slider-thumb{appearance:none;width:14px;height:14px;border-radius:var(--r-pill);
  background:var(--bg-surface);border:1px solid var(--border-active);
  box-shadow:0 1px 2px rgb(19 24 29 / .22), inset 0 1px 0 rgb(255 255 255 / .55);cursor:grab}
.rng input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:var(--r-pill);
  background:var(--bg-surface);border:1px solid var(--border-active);box-shadow:0 1px 2px rgb(19 24 29 / .22);cursor:grab}
.rng input[type=range]:focus-visible{outline:none}
.rng input[type=range]:focus-visible::-webkit-slider-thumb{outline:2px solid var(--accent);outline-offset:2px}
.rng input[type=range]:focus-visible::-moz-range-thumb{outline:2px solid var(--accent);outline-offset:2px}
.rng-ends{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--fg-muted);
  font-variant-numeric:tabular-nums;margin-top:1px}

/* ---------------- data display ---------------- */
.bdg{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-2);
  font-size:11px;font-weight:500;line-height:1;white-space:nowrap;border:1px solid transparent;
  background:var(--bg-subtle);color:var(--fg-secondary)}
.bdg .dot{width:5px;height:5px;border-radius:var(--r-pill);background:currentColor;flex:none;opacity:.85}
.bdg.sub-gain{background:var(--gain-bg);color:var(--gain)}
.bdg.sub-loss{background:var(--loss-bg);color:var(--loss)}
.bdg.sub-warn{background:var(--warn-bg);color:var(--warn)}
.bdg.sub-info{background:var(--info-bg);color:var(--info)}
.bdg.sub-acc{background:var(--accent-soft);color:var(--accent)}
.bdg.out-gain{background:none;border-color:var(--gain-line);color:var(--gain)}
.bdg.out-loss{background:none;border-color:var(--loss-line);color:var(--loss)}
.bdg.out-warn{background:none;border-color:var(--warn-line);color:var(--warn)}
.bdg.out-acc{background:none;border-color:var(--accent-line);color:var(--accent)}
.bdg.out-n{background:none;border-color:var(--border);color:var(--fg-secondary)}
.bdg.mono{font-family:var(--mono);font-size:10px}
.bdg.dash{background:none;border-style:dashed;border-color:var(--border-control);color:var(--fg-muted);
  letter-spacing:.06em;font-size:10px;font-weight:600}
.plate{width:24px;height:24px;border-radius:var(--r-2);flex:none;display:grid;place-items:center;
  background:var(--bg-subtle);box-shadow:inset 0 0 0 1px var(--border);font-size:9.5px;font-weight:600;
  color:var(--fg-secondary);overflow:hidden}

.panel{border:1px solid var(--border);border-radius:var(--r-4);background:var(--bg-surface);min-width:0;overflow:hidden}
.panel-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 14px;
  border-bottom:1px solid var(--border-subtle);background:var(--bg-subtle)}
.panel-hd h2{font-size:13px;line-height:18px;font-weight:600}
.panel-bd{padding:14px}
.panel-bd.flush{padding:0}
.note{font-size:12px;line-height:18px;color:var(--fg-muted);margin:0}
.why{font-size:12px;line-height:18px;color:var(--fg-secondary);border-left:2px solid var(--accent-line);padding-left:10px}
.why b{font-weight:600;color:var(--fg)}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:14px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));margin-bottom:12px}

/* ---------------- loan maths ---------------- */
function buildSchedule(balance, annualRate, emi, lump){
  var r = annualRate/100/12, b = balance, rows = [], m = 0;
  if (lump) { b = Math.max(0, b - lump); }
  while (b > 0.5 && m < 720){
    m++;
    var i = b*r, p = emi - i;
    if (p <= 0) return rows; // EMI cannot cover interest
    if (p > b) p = b;
    b = b - p;
    rows.push({ m:m, interest:i, principal:p, payment:i+p, balance:b });
  }
  return rows;
}
function scheduleTotals(rows){
  return { interest: sum(rows,function(x){return x.interest;}), months: rows.length };
}
function payoffSim(debts, budget, orderFn){
  var ds = debts.map(function(d){ return { name:d.name, bal:d.bal, rate:d.rate, min:d.min }; });
  var minSum = sum(ds,function(d){return d.min;});
  if (budget < minSum) return { fails:true, minSum:minSum, short:minSum-budget };
  var seq = ds.slice().sort(orderFn);
  var hist = [{ month:0, total: sum(ds,function(d){return d.bal;}) }];
  var month = 0, totalInterest = 0, order = [];
  while (ds.some(function(d){return d.bal>0.5;}) && month < 720){
    month++;
    var pool = budget;
    ds.forEach(function(d){ if (d.bal<=0.5) return; var i = d.bal*d.rate/1200; d.bal += i; totalInterest += i; });
    ds.forEach(function(d){ if (d.bal<=0.5) return; var p = Math.min(d.min, d.bal, pool); d.bal -= p; pool -= p; });
    for (var k=0;k<seq.length;k++){
      if (pool <= 0.01) break;
      var d = ds.filter(function(x){return x.name===seq[k].name;})[0];
      if (d.bal <= 0.5) continue;
      var p2 = Math.min(pool, d.bal); d.bal -= p2; pool -= p2;
    }
    ds.forEach(function(d){
      if (d.bal <= 0.5 && !order.some(function(o){return o.name===d.name;})) order.push({ name:d.name, month:month });
    });
    hist.push({ month:month, total: sum(ds,function(d){return Math.max(0,d.bal);}) });
  }
  return { fails:false, months:month, interest:totalInterest, hist:hist, order:order, minSum:minSum };
}
var PAYOFF_DEBTS = LOANS.map(function(l){ return { name:l.name+' ••'+l.last4, bal:l.owed, rate:l.rate, min:l.emi, lender:l.lender }; });
var BY_RATE = function(a,b){ return b.rate - a.rate; };          // avalanche
var BY_BALANCE = function(a,b){ return a.bal - b.bal; };         // snowball

/* combined outstanding across all three loans, month by month, at current EMIs */
function portfolioAmort(){
  var scheds = LOANS.map(function(l){ return buildSchedule(l.owed, l.rate, l.emi, 0); });
  var maxM = Math.max.apply(null, scheds.map(function(s){return s.length;}));
  var out = [];
  for (var m=0;m<=maxM;m++){
    var bal=0, pr=0, it=0;
    scheds.forEach(function(s){
      if (m===0){ bal += s.length?s[0].balance + s[0].principal:0; return; }
      var row = s[m-1];
      if (row){ bal += row.balance; pr += row.principal; it += row.interest; }
    });
    out.push({ m:m, balance:bal, principal:pr, interest:it });
  }
  return out;
}

function wireSort(root){
  root.querySelectorAll('table.dt th.sortable').forEach(function(th){
    var si = th.querySelector('.si');
    if (si) si.innerHTML = svgIcon('sort-none',12);
    function go(){
      var table = th.closest('table'), tb = table.tBodies[0], idx = +th.dataset.sort;
      var dir = th.getAttribute('aria-sort') === 'descending' ? 1 : -1;
      table.querySelectorAll('th.sortable').forEach(function(o){
        o.setAttribute('aria-sort','none');
        var s = o.querySelector('.si'); if (s) s.innerHTML = svgIcon('sort-none',12);
      });
      th.setAttribute('aria-sort', dir === -1 ? 'descending' : 'ascending');
      if (si) si.innerHTML = svgIcon(dir === -1 ? 'sort-desc' : 'sort-asc', 12);
      var rows = Array.prototype.slice.call(tb.rows);
      rows.sort(function(a,b){
        var A = a.cells[idx], B = b.cells[idx];
        var av = valOf(A), bv = valOf(B);
        if (av === null && bv === null) return A.textContent.localeCompare(B.textContent) * dir;
        if (av === null) return 1;   // nulls last in both directions
        if (bv === null) return -1;
        if (isNaN(av) && isNaN(bv)) return A.textContent.trim().localeCompare(B.textContent.trim()) * dir;
        if (isNaN(av)) return 1;
        if (isNaN(bv)) return -1;
        return (av - bv) * dir;
      });
      rows.forEach(function(r){ tb.appendChild(r); });
    }
    th.addEventListener('click', go);
    th.addEventListener('keydown', function(e){ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
  });
}
function valOf(cell){
  var holder = cell.querySelector('[data-v]');
  if (holder){ var raw = holder.dataset.v; if (raw === '') return null; return +raw; }
  return parseNum(cell.textContent);
}
function parseNum(t){
  t = t.replace(/−/g,'-').replace(/[₹,\s%]/g,'');
  if (t.trim() === '—' || t.trim() === '') return null;
  var m = t.match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}

  return ys.map(function(y){ return '<line x1="'+x0+'" x2="'+x1+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>'; }).join('');
}
function niceTicks(max, n){
  n = n||4;
  var raw = max/n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  var step = Math.ceil(raw/mag)*mag;
  var out=[]; for (var v=0; v<=max+step*0.001; v+=step) out.push(v);
  return out;
}

/* line + optional stacked area underneath, single ₹ axis */
function stackedAreaWithLine(cfg){
  // cfg: {w,h,points:[{label,a,b,line}], aName,bName,lineName, every}
  var w = cfg.w||760, h = cfg.h||260, pl=56, pr=16, pt=14, pb=28;
  var iw = w-pl-pr, ih = h-pt-pb;
  var maxStack = Math.max.apply(null, cfg.points.map(function(p){return p.a+p.b;}));
  var maxLine = Math.max.apply(null, cfg.points.map(function(p){return p.line;}));
  var max = Math.max(maxStack, maxLine);
  var ticks = niceTicks(max,4); max = ticks[ticks.length-1];
  var X = function(i){ return pl + (cfg.points.length<2?0:iw*i/(cfg.points.length-1)); };
  var Y = function(v){ return pt + ih - ih*v/max; };
  var s = svgOpen(w,h);
  s += gridLines(pl, w-pr, ticks.map(Y));
  ticks.forEach(function(t){ s += txt(pl-8, Y(t)+4, axC(t), {anchor:'end'}); });
  // stacked areas: a (principal) at bottom, b (interest) above, 2px surface gap between fills
  var topA = cfg.points.map(function(p,i){ return X(i)+','+Y(p.a); }).join(' ');
  var baseR = cfg.points.map(function(p,i){ return X(i)+','+Y(0); }).reverse().join(' ');
  s += '<polygon points="'+topA+' '+baseR+'" fill="var(--c3)" fill-opacity="0.85" stroke="none"/>';
  var topB = cfg.points.map(function(p,i){ return X(i)+','+Y(p.a+p.b); }).join(' ');
  var botB = cfg.points.map(function(p,i){ return X(i)+','+(Y(p.a)-2); }).reverse().join(' ');
  s += '<polygon points="'+topB+' '+botB+'" fill="var(--c2)" fill-opacity="0.85" stroke="none"/>';
  // outstanding balance line
  var ln = cfg.points.map(function(p,i){ return (i?'L':'M')+X(i)+' '+Y(p.line); }).join(' ');
  s += '<path d="'+ln+'" fill="none" stroke="var(--fg)" stroke-width="2" stroke-linejoin="round"/>';
  s += '<circle cx="'+X(cfg.points.length-1)+'" cy="'+Y(cfg.points[cfg.points.length-1].line)+'" r="3.5" fill="var(--fg)"/>';
  var every = cfg.every || Math.ceil(cfg.points.length/7);
  cfg.points.forEach(function(p,i){ if (i%every===0 || i===cfg.points.length-1) s += txt(X(i), h-9, p.label, {anchor:'middle'}); });
  s += '<line x1="'+pl+'" x2="'+(w-pr)+'" y1="'+Y(0)+'" y2="'+Y(0)+'" stroke="var(--border-control)" stroke-width="1"/>';
  return s + svgClose();
}

/* multi-line comparison (avalanche vs snowball) */
function multiLine(cfg){
  var w=cfg.w||740, h=cfg.h||250, pl=56, pr=68, pt=14, pb=28;
  var iw=w-pl-pr, ih=h-pt-pb;
  var n = Math.max.apply(null, cfg.series.map(function(s){return s.pts.length;}));
  var max = Math.max.apply(null, cfg.series.map(function(s){return Math.max.apply(null,s.pts);}));
  var ticks = niceTicks(max,4); max = ticks[ticks.length-1];
  var X=function(i){ return pl + (n<2?0:iw*i/(n-1)); };
  var Y=function(v){ return pt + ih - ih*v/max; };
  var s = svgOpen(w,h);
  s += gridLines(pl,w-pr,ticks.map(Y));
  ticks.forEach(function(t){ s += txt(pl-8, Y(t)+4, axC(t), {anchor:'end'}); });
  cfg.series.forEach(function(ser){
    var d = ser.pts.map(function(v,i){ return (i?'L':'M')+X(i)+' '+Y(v); }).join(' ');
    s += '<path d="'+d+'" fill="none" stroke="'+ser.color+'" stroke-width="2" '+
         (ser.dash?'stroke-dasharray="5 4" ':'')+'stroke-linejoin="round"/>';
    var li = ser.pts.length-1;
    s += '<circle cx="'+X(li)+'" cy="'+Y(ser.pts[li])+'" r="3" fill="'+ser.color+'" stroke="var(--bg-surface)" stroke-width="2"/>';
    s += txt(X(li)+7, Y(ser.pts[li])+4, ser.label, {fill:'var(--fg-secondary)', size:11});
  });
  var every = Math.ceil(n/7);
  for (var i=0;i<n;i+=every) s += txt(X(i), h-9, i+'m', {anchor:'middle'});
  s += txt(X(n-1), h-9, (n-1)+'m', {anchor:'middle'});
  return s + svgClose();
}

/* horizontal 100% stacked bar, one row per group */
function stackedRows(cfg){
  // cfg:{rows:[{label, parts:[v,...], total}], names:[], w,h, barH}
  var w=cfg.w||700, barH=cfg.barH||20, gap=14, labW=cfg.labW||136, valW=104;
  var h = cfg.rows.length*(barH+gap)+6;
  var iw = w-labW-valW-8;
  var max = Math.max.apply(null, cfg.rows.map(function(r){return r.total;}));
  var s = svgOpen(w,h);
  cfg.rows.forEach(function(r,ri){
    var y = ri*(barH+gap)+4;
    s += txt(0, y+barH/2+4, r.label, {fill:'var(--fg)', size:12, weight:500});
    var x = labW, full = iw*r.total/max;
    r.parts.forEach(function(v,pi){
      if (v<=0) return;
      var pw = full*v/r.total;
      s += '<rect x="'+x+'" y="'+y+'" width="'+Math.max(0,pw-2)+'" height="'+barH+'" rx="2" fill="'+SERIES[pi%5]+'"/>';
      x += pw;
    });
    s += txt(w, y+barH/2+4, cfg.fmt?cfg.fmt(r.total):axC(r.total), {anchor:'end', fill:'var(--fg)', size:12, weight:600});
  });
  return s + svgClose();
}

/* sorted horizontal bars with a value label */
function hBars(cfg){
  var w=cfg.w||660, barH=cfg.barH||18, gap=12, labW=cfg.labW||128, valW=cfg.valW||96;
  var h=cfg.rows.length*(barH+gap)+4, iw=w-labW-valW-8;
  var vals = cfg.rows.map(function(r){return r.v;});
  var max = Math.max.apply(null, vals.map(Math.abs));
  var hasNeg = Math.min.apply(null, vals) < 0;
  var zero = hasNeg ? labW + iw/2 : labW;
  var scale = hasNeg ? (iw/2)/max : iw/max;
  var s = svgOpen(w,h);
  if (hasNeg) s += '<line x1="'+zero+'" x2="'+zero+'" y1="0" y2="'+(h-6)+'" stroke="var(--border-control)" stroke-width="1"/>';
  cfg.rows.forEach(function(r,ri){
    var y=ri*(barH+gap)+2, len=Math.abs(r.v)*scale;
    var x = r.v<0 ? zero-len : zero;
    var color = r.color || (hasNeg ? (r.v<0?'var(--loss)':'var(--gain)') : 'var(--accent)');
    s += txt(0, y+barH/2+4, r.label, {fill:'var(--fg)', size:12, weight:500});
    s += '<rect x="'+x+'" y="'+y+'" width="'+Math.max(1,len)+'" height="'+barH+'" rx="2" fill="'+color+'"/>';
    s += txt(w, y+barH/2+4, r.vt, {anchor:'end', fill:'var(--fg)', size:12, weight:600});
  });
  return s + svgClose();
}

/* utilisation gauge: a semicircular arc with threshold ticks */
function gauge(pctVal, opts){
  opts = opts||{};
  var w=220,h=128,cx=110,cy=112,r=84;
  function pt(p){ var a=Math.PI*(1-p/100); return [cx+r*Math.cos(a), cy-r*Math.sin(a)]; }
  function arc(p0,p1,color,width){
    var a=pt(p0), b=pt(p1), large = (p1-p0)>50?1:0;
    return '<path d="M'+a[0].toFixed(1)+' '+a[1].toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+b[0].toFixed(1)+' '+b[1].toFixed(1)+
      '" fill="none" stroke="'+color+'" stroke-width="'+(width||10)+'" stroke-linecap="butt"/>';
  }
  var tone = pctVal<30?'var(--gain)':(pctVal<50?'var(--warn)':'var(--loss)');
  var s = svgOpen(w,h);
  s += arc(0,100,'var(--bg-subtle)',10);
  s += arc(0, Math.max(0.4,Math.min(100,pctVal)), tone, 10);
  [30,50].forEach(function(t){
    var a=pt(t), b=[cx+(r+8)*Math.cos(Math.PI*(1-t/100)), cy-(r+8)*Math.sin(Math.PI*(1-t/100))];
    s += '<line x1="'+a[0].toFixed(1)+'" y1="'+a[1].toFixed(1)+'" x2="'+b[0].toFixed(1)+'" y2="'+b[1].toFixed(1)+'" stroke="var(--border-control)" stroke-width="1"/>';
  });
  s += '<text x="'+cx+'" y="'+(cy-24)+'" text-anchor="middle" fill="var(--fg)" font-size="26" font-weight="600" font-family="var(--sans)" style="font-variant-numeric:tabular-nums">'+pctVal.toFixed(2)+'%</text>';
  s += txt(cx, cy-6, opts.caption||'of limit used', {anchor:'middle'});
  s += txt(2, h-4, '0%'); s += txt(w-2, h-4, '100%', {anchor:'end'});
  s += txt(pt(30)[0], 12, '30', {anchor:'middle', size:10});
  s += txt(pt(50)[0]+10, 20, '50', {anchor:'middle', size:10});
  return s + svgClose();
}

/* cycle timeline strip */
function cycleTimeline(c){
  var w=700,h=70,pl=8,pr=8,y=30,iw=w-pl-pr;
  var s = svgOpen(w,h);
  s += '<rect x="'+pl+'" y="'+y+'" width="'+iw+'" height="10" rx="2" fill="var(--bg-subtle)"/>';
  var spentFrac=0.27, graceEnd=0.70;
  s += '<rect x="'+pl+'" y="'+y+'" width="'+(iw*spentFrac)+'" height="10" rx="2" fill="var(--accent)"/>';
  s += '<rect x="'+(pl+iw*spentFrac)+'" y="'+y+'" width="'+(iw*(graceEnd-spentFrac))+'" height="10" fill="var(--bg-subtle)" stroke="var(--border-control)" stroke-width="1" stroke-dasharray="3 3"/>';
  [['Cycle opened',0,'11 Oct'],['Today',spentFrac,'19 Oct'],['Statement',graceEnd,'10 Nov'],['Due',1,'30 Nov']].forEach(function(m,i){
    var x = pl+iw*m[1];
    s += '<line x1="'+x+'" x2="'+x+'" y1="'+(y-8)+'" y2="'+(y+18)+'" stroke="'+(i===1?'var(--accent)':'var(--border-control)')+'" stroke-width="'+(i===1?2:1)+'"/>';
    s += txt(x, y-13, m[0], {anchor:i===3?'end':(i===0?'start':'middle'), fill:i===1?'var(--accent)':'var(--fg-muted)', size:11});
    s += txt(x, y+32, m[2], {anchor:i===3?'end':(i===0?'start':'middle'), fill:'var(--fg)', size:11, weight:600});
  });
  return s + svgClose();
}

/* maturity ladder: bars positioned on a time axis, grouped by FY */
function maturityLadder(items){
  var w=760,h=30+items.length*30+26,pl=150,pr=96,iw=w-pl-pr;
  var maxDays = Math.max.apply(null, items.map(function(i){return i.days||0;}));
  var ticks=[0,365,730,1095,1460,1825,2190,2555];
  ticks = ticks.filter(function(t){return t<=maxDays*1.04;});
  var X=function(d){ return pl + iw*d/(maxDays*1.04); };
  var s = svgOpen(w,h);
  ticks.forEach(function(t){
    s += '<line x1="'+X(t)+'" x2="'+X(t)+'" y1="18" y2="'+(h-24)+'" stroke="var(--grid)" stroke-width="1"/>';
    s += txt(X(t), h-8, t===0?'today':(t/365)+'y', {anchor:'middle'});
  });
  items.forEach(function(it,i){
    var y=26+i*30;
    s += txt(0, y+13, it.name, {fill:'var(--fg)', size:12, weight:500});
    if (it.days === null){
      s += txt(pl, y+13, '— no stated maturity', {fill:'var(--fg-muted)', size:11.5});
      return;
    }
    s += '<line x1="'+pl+'" x2="'+X(it.days)+'" y1="'+(y+8)+'" y2="'+(y+8)+'" stroke="var(--border)" stroke-width="1" stroke-dasharray="2 3"/>';
    s += '<rect x="'+(X(it.days)-5)+'" y="'+y+'" width="10" height="16" rx="2" fill="'+(it.color||'var(--accent)')+'"/>';
    s += txt(w, y+13, axC(it.value), {anchor:'end', fill:'var(--fg)', size:12, weight:600});
    s += txt(X(it.days)+10, y+13, it.when, {fill:'var(--fg-muted)', size:11});
  });
  return s + svgClose();
}

/* month-grid payment calendar */
function dueCalendar(year, monthIdx, firstWeekday, daysInMonth, marks, todayDay){
  var cw=48, ch=46, w=cw*7, rows=Math.ceil((firstWeekday+daysInMonth)/7), h=22+rows*ch;
  var s = svgOpen(w,h);
  ['M','T','W','T','F','S','S'].forEach(function(d,i){ s += txt(i*cw+cw/2, 12, d, {anchor:'middle', size:10.5}); });
  for (var d=1; d<=daysInMonth; d++){
    var idx=firstWeekday+d-1, col=idx%7, row=Math.floor(idx/7);
    var x=col*cw, y=22+row*ch;
    var m = marks[d];
    s += '<rect x="'+(x+1)+'" y="'+(y+1)+'" width="'+(cw-2)+'" height="'+(ch-2)+'" rx="3" fill="'+
         (m?(m.tone==='urgent'?'var(--loss-bg)':(m.tone==='emi'?'var(--bg-subtle)':'var(--accent-soft)')):'none')+
         '" stroke="'+(d===todayDay?'var(--accent)':'var(--border)')+'" stroke-width="'+(d===todayDay?2:1)+'"/>';
    s += txt(x+5, y+14, String(d), {fill:d===todayDay?'var(--accent)':'var(--fg-secondary)', size:11, weight:d===todayDay?600:500});
    if (m){
      s += txt(x+5, y+27, m.who, {fill:m.tone==='urgent'?'var(--loss)':'var(--fg)', size:9.5, weight:600});
      s += txt(x+5, y+38, axC(m.amt), {fill:'var(--fg-muted)', size:9.5});
    }
  }
  return s + svgClose();
}

<script>

      {h:'Instalment', num:true, w:110, fmt:function(l){ return '<span data-v="'+l.emi+'">'+inr(l.emi,0)+'</span>'; }},
      {h:'Owed', num:true, w:116, fmt:function(l){ return '<span data-v="'+l.owed+'">'+inr(l.owed,0)+'</span>'; }},
      {h:'Paid', num:true, w:92, fmt:function(l){ return '<span data-v="'+l.paid+'">'+l.paid+' of '+l.months+'</span>'; }},
      {h:'Interest over the term', num:true, w:154, fmt:function(l){ return '<span data-v="'+l.totalInterest+'">'+inr(l.totalInterest,0)+'</span><div class="sub2">'+inr(l.remainingInterest,0)+' remaining</div>'; }},
      {h:'Payoff date', num:true, w:112, fmt:function(l){ return '<span data-v="'+l.payoffOff+'">'+l.payoffOn+'</span><div class="sub2">'+l.left+' left</div>'; }},

    ],

/* ================ /loans/[accountId] ================ */
SCREENS.loanDetail = function(){
  var l = LOANS[0]; // Personal loan, ICICI ••3306
  var cd = LOANS[2];
  var h = ph('Personal loan','/loans/acc_loan_pl',
    esc(l.lender)+' ••'+l.last4+', opened '+l.openedOn+'. '+l.paid+' of '+l.months+' instalments paid. '+
    'Principal and interest are split by the schedule on every payment, never typed in.',
    '<span class="chip acc">'+pct(l.rate)+' quoted</span><span class="chip">Reducing balance</span>');

  h += '<div class="grid kpis">'+
    tile('Instalment', inrC(l.emi), 'Every month, '+l.left+' remaining') +
    tile('Owed', inrC(l.owed), 'From the journal · as at '+TODAY) +
    tile('Interest over the term', inrC(l.totalInterest), inr(l.remainingInterest,0)+' still ahead') +

  h += '<div class="cols c2">'+
    panel('What a flat rate actually costs',

      dataTable({ id:'flat-cmp',
        cols:[{h:'Loan', w:170, fmt:function(r){return '<span class="nm">'+r.n+'</span>';}},
              {h:'Quoted', num:true, w:92, fmt:function(r){return r.q;}},

          {n:'Car loan ••7741', q:pct(9.25)+' reducing', e:pct(9.65)+' effective', gap:'0.40'},
          {n:'Consumer durable ••9915', q:pct(8.00)+' flat', e:pct(14.64)+' reducing', gap:'6.64'}
        ],
        mobile:function(r){ return { l1:r.n, r1:r.e, l2:'Quoted '+r.q, r2:r.gap?'+'+r.gap+' pp':'' }; }
      }, true) +
      '<p class="note" style="margin-top:10px">A flat rate charges interest on the original principal for the whole term, even after you have repaid most of it. '+
      'Eight percent flat over 24 months is 14.64% in reducing-balance terms — nearly double.</p>', {flush:false}) +
    panel('Interest paid, last twelve months',
      '<dl class="kv"><dt>Interest</dt><dd class="loss">'+inr(last12Int,0)+'</dd>'+
      '<dt>Principal</dt><dd>'+inr(last12Pri,0)+'</dd>'+
      '<dt>Total paid</dt><dd>'+inr(last12Int+last12Pri,0)+'</dd>'+
      '<dt>Share that was interest</dt><dd>'+pct(last12Int/(last12Int+last12Pri)*100)+'</dd></dl>'+
      hBars({ w:320, labW:60, valW:88, barH:14,
        rows:last12.map(function(r,i){ return { label: monthLabel(i-21), v:r.interest, vt:inr(r.interest,0), color:'var(--c2)' }; })
      })) +

      '<input type="range" id="prepay" min="0" max="200000" step="5000" value="50000">'+

      '<span>'+inr(0,0)+'</span><span>'+inr(200000,0)+'</span></div>'+
      '<div id="prepay-out" style="margin-top:14px"></div>'+
      '<p class="note" style="margin-top:12px">Instalment held constant, so a prepayment shortens the term rather than lowering the payment. '+
      'The schema records this against <span class="mono">loan_prepayments</span>; ICICI charges nothing to prefore-close a floating-rate personal loan, '+
      'but confirm your own sanction letter.</p>', {chip:NEW}) +
    panel('Record a payment',
      '<div class="fgrid">'+
      '<div><label for="lp-date">Date</label><input type="date" id="lp-date" value="2026-11-12"></div>'+
      '<div><label for="lp-from">Paid from</label><select id="lp-from"><option>HDFC Savings ••1234</option><option>ICICI Savings ••5567</option></select></div>'+
      '<div><label for="lp-amt">Amount</label><input type="number" id="lp-amt" value="13805"></div>'+
      '</div>'+
      '<div class="callout acc" style="margin-top:14px"><b>The split comes from the schedule, never typed.</b><br>'+
      '<span class="mono">DEBIT&nbsp; Liabilities:Loans:Personal loan&nbsp;&nbsp;&nbsp; '+inr(9229,0)+'&nbsp; principal</span><br>'+
      '<span class="mono">DEBIT&nbsp; Expenses:Interest:Personal loan&nbsp; '+inr(4576,0)+'&nbsp; interest</span><br>'+
      '<span class="mono">CREDIT Assets:Bank:HDFC Savings&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; '+inr(13805,0)+'</span><br>'+
      'Instalment 25 of 60. Only the interest leg reduces net worth.</div>'+
      '<div style="margin-top:14px"><button class="btn" type="button">Record instalment</button></div>') +
  '</div>';

  h += panel('Amortisation schedule',

SCREENS.payoff = function(){

      {h:'Interest to date', num:true, w:124, fmt:function(d){ return '<span class="gain" data-v="'+d.interestToDate+'">'+inr(d.interestToDate,0)+'</span>'; }},

  var nav = '<div class="callout plain" style="margin-bottom:14px"><b>Priced, not accrued.</b> '+

  h += '<div class="stack">'+

      '<div><label for="nd-rate">Rate</label><input type="number" id="nd-rate" step="0.01" placeholder="7.10"></div>'+
      '<div><label for="nd-comp">Compounding</label><select id="nd-comp"><option>Quarterly</option><option>Annual</option><option>Monthly</option><option>On maturity</option></select></div>'+
      '<div><label for="nd-open">Opened on</label><input type="date" id="nd-open" value="2026-03-14"></div>'+
      '<div><label for="nd-mat">Matures on</label><input type="date" id="nd-mat" value="2027-03-14"></div>'+

  return h;

      {h:'Documents', num:true, w:100, fmt:function(a){ return a.docs.length ? a.docs.length+' attached' : unavail('Nothing attached yet'); }},
      {h:'', w:96, sortable:false, fmt:function(){ return '<button class="btn ghost btn-xs"><i data-i="refresh" data-s="12"></i>Revalue</button>'; }}

    return '<div style="min-width:0"><h3 style="margin-bottom:8px">'+esc(a.name.split('—')[0].trim())+'</h3>'+
      hBars({ w:300, labW:68, valW:96, barH:14,
        rows:a.history.map(function(p){ return { label:p[0], v:p[1], vt:inr(p[1],0), color:'var(--c3)' }; }) }) +
      '<p class="note">'+(a.history[a.history.length-1][1] < a.history[0][1]
        ? '<span class="loss">'+pctS((a.history[a.history.length-1][1]/a.history[0][1]-1)*100)+'</span> since first valued'
        : '<span class="gain">'+pctS((a.history[a.history.length-1][1]/a.history[0][1]-1)*100)+'</span> since first valued')+'</p></div>';
  }).join('');

  var reval = '<div class="fgrid">'+
    '<div><label for="rv-asset">Asset</label><select id="rv-asset">'+
      ASSETS.map(function(a){ return '<option value="'+a.value+'">'+esc(a.name)+'</option>'; }).join('')+'</select></div>'+
    '<div><label for="rv-new">New value</label><input type="number" id="rv-new" value="610000"></div>'+

    '<div><label for="rv-basis">Basis</label><select id="rv-basis"><option>Dealer trade-in quote</option><option>IBJA rate × weight</option><option>Auction catalogue estimate</option><option>Registered valuer report</option><option>Own estimate</option></select></div>'+
    '</div>'+

    '<button class="btn ghost" type="button">Attach a document</button></div>'+
    '<p class="note" style="margin-top:10px">A revaluation is not income and not an expense. The delta goes to '+
    '<span class="mono">Equity:Valuation adjustments</span>, which keeps B02 — assets minus liabilities equals equity plus income minus expenses — holding.</p>';

  var docs = '<p class="note" style="margin-bottom:10px">Three files attached across two assets. Nothing is uploaded in this mockup.</p>'+
    dataTable({ id:'docs',
      cols:[{h:'File', w:200, fmt:function(d){ return '<span class="nm mono">'+esc(d.f)+'</span>'; }},
            {h:'Asset', w:200, fmt:function(d){ return esc(d.a); }},
            {h:'Added', w:110, fmt:function(d){ return d.on; }},
            {h:'Size', num:true, w:80, fmt:function(d){ return d.sz; }}],
      rows:[{f:'RC book.pdf', a:'Hyundai i20 Asta (2022)', on:'12 Nov 2022', sz:'1.4 MB'},
            {f:'Insurance 2026-27.pdf', a:'Hyundai i20 Asta (2022)', on:'04 Apr 2026', sz:'820 KB'},
            {f:'Tanishq invoice 2021.pdf', a:'Physical gold — 22K jewellery', on:'18 Oct 2021', sz:'312 KB'}],
      mobile:function(d){ return { l1:d.f, r1:d.sz, l2:d.a, r2:d.on }; }
    });

  h += '<div class="stack">'+
    panel('Assets', tbl, {flush:true, chip:NEW, icon:'property'}) +
    panel('Valuation history', '<div class="cols">'+histPanels+'</div>'+
      '<p class="note" style="margin-top:4px">Each asset on its own scale, because a car depreciating and gold appreciating share no useful axis. '+
      'Bars, not lines: these are a handful of discrete valuations, not a continuous series.</p>', {chip:NEW}) +
    '<div class="cols c2">'+
      panel('Revalue an asset', reval, {chip:NEW}) +
      panel('Documents', docs, {chip:NEW}) +

<script>
"use strict";

/* ======================= /platforms ======================= */
SCREENS.platforms = function(){
  var inUse = PLATFORMS.filter(function(p){ return p.state==='in_use'; });
  var idle = PLATFORMS.filter(function(p){ return p.state==='idle'; });
  var archived = PLATFORMS.filter(function(p){ return p.state==='archived'; });
  var priced = inUse.filter(function(p){ return p.value !== null; });
  var totalHoldings = sum(inUse,function(p){return p.holdings;});

  /* concentration */
  var weights = priced.map(function(p){ return { name:p.name, w:p.value/PLAT_PRICED*100 }; });
  var hhi = sum(weights,function(x){ return x.w*x.w; });
  var effective = 10000/hhi;
  var band = hhi<1500?'diversified':(hhi<2500?'moderate':'concentrated');

  var h = ph('Platforms','/platforms',
    'Holdings grouped by where they are actually held. Seven platforms carry a priced value; two hold something the app cannot price today, and their value is withheld rather than guessed.',
    '<span class="chip acc">'+inUse.length+' in use</span><span class="chip warn">2 withheld</span>');

  h += '<div class="grid kpis">'+
    tile('Platforms in use', String(inUse.length), idle.length+' registered holding nothing · 1 archived') +
    tile('Holdings', String(totalHoldings), 'Across every platform') +
    tile('Market value', inrC(PLAT_PRICED), 'Priced holdings only · 2 withheld') +
    tile('Largest exposure', pct(weights[0].w), esc(priced[0].name)+' · '+inr(priced[0].value,0), {chip:NEW}) +
    tile('Effective platforms', effective.toFixed(1), 'HHI '+Math.round(hhi)+' · '+band, {chip:NEW}) +
  '</div>';

  h += '<div class="callout" style="margin-bottom:12px"><b>The portfolio total is withheld until every holding has a price and the required FX conversion.</b><br>'+
    'INDmoney holds AAPL with '+inr(214560,0)+' invested but no USD/INR rate stored for '+TODAY+'. '+
    'Angel One holds ITC with '+inr(82400,0)+' invested and no stored quote. '+
    'Both show an em-dash, not a zero — '+inr(PLAT_PRICED,0)+' is what can honestly be claimed.</div>';

  var conc = hBars({ w:560, labW:116, valW:150, barH:16,
    rows: weights.map(function(x){
      return { label:x.name, v:x.w, vt:pct(x.w)+'  ·  '+axC(priced.filter(function(p){return p.name===x.name;})[0].value) };
    })
  }) + '<p class="note" style="margin-top:8px">Share of priced market value. HHI is '+Math.round(hhi)+', which puts the book in the '+band+' band '+
  '(under 1,500 diversified, over 2,500 concentrated — a borrowed heuristic, not a rule). '+
  'Read it as: your '+priced.length+' platforms behave like '+effective.toFixed(1)+'.</p>';

  var ret = hBars({ w:560, labW:116, valW:96, barH:16,
    rows: priced.slice().sort(function(a,b){return b.xirr-a.xirr;}).map(function(p){
      return { label:p.name, v:p.xirr, vt:pctS(p.xirr) };
    })
  }) + '<p class="note" style="margin-top:8px">XIRR since inception, per platform, money-weighted. '+
  'Upstox is negative because it holds only Tata Motors, which is both down and priced from a stale quote.</p>';

  var chg = hBars({ w:560, labW:116, valW:110, barH:16,
    rows: inUse.filter(function(p){return p.charges>0;}).sort(function(a,b){return b.charges-a.charges;}).map(function(p){
      return { label:p.name, v:p.charges, vt:inr(p.charges,0), color:'var(--c2)' };
    })
  }) + '<p class="note" style="margin-top:8px">Charges booked in FY 2026-27: brokerage, STT, exchange and SEBI fees, stamp duty, GST and DP charges. '+
  'SafeGold dominates because 3% GST on a digital-gold purchase is a charge, not a cost of the metal. '+
  'Kuvera shows '+inr(0,0)+' — a direct-plan platform that genuinely charged nothing, which is a claim, not an absence.</p>';

  var tbl = dataTable({
    id:'platforms',
    cols:[
      {h:'Platform', w:190, fmt:function(p){
        return '<div style="display:flex;align-items:center;gap:8px"><span class="chip mono" style="width:30px;justify-content:center;padding:1px 0">'+p.mark+'</span>'+
          '<span><span class="nm">'+esc(p.name)+'</span><div class="sub2">'+esc(p.kind)+'</div></span></div>'; }},
      {h:'Holdings', num:true, w:88, fmt:function(p){ return '<span data-v="'+p.holdings+'">'+p.holdings+'</span>'; }},
      {h:'Invested', num:true, w:116, fmt:function(p){ return '<span data-v="'+p.invested+'">'+inr(p.invested,0)+'</span>'; }},
      {h:'Market value', num:true, w:124, fmt:function(p){
        return p.value===null ? '<span data-v="">'+unavail(p.withheld)+'</span>' : '<span data-v="'+p.value+'">'+inr(p.value,0)+'</span>'; }},
      {h:'Unrealised', num:true, w:124, fmt:function(p){
        if (p.value===null) return unavail(p.withheld);
        var g = p.value-p.invested;
        return '<span data-v="'+g+'" class="'+cls(g)+'">'+inrS(g,0)+'</span>'; }},
      {h:'Return (XIRR)', num:true, w:116, fmt:function(p){
        return p.xirr===null ? unavail(p.withheld) : '<span data-v="'+p.xirr+'" class="'+cls(p.xirr)+'">'+pctS(p.xirr)+'</span>'; }},
      {h:'Charges, this FY', num:true, w:132, fmt:function(p){ return '<span data-v="'+p.charges+'">'+inr(p.charges,0)+'</span>'; }},
      {h:'Weight', num:true, w:132, fmt:function(p){
        if (p.value===null) return unavail('Cannot weight an unpriced holding');
        var s=p.value/PLAT_PRICED*100;
        return '<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end"><span data-v="'+s+'">'+pct(s)+'</span>'+
          '<span class="bar" style="width:46px"><i style="width:'+s+'%"></i></span></div>'; }},
      {h:'State', w:120, sortable:false, fmt:function(p){
        if (p.withheld) return '<span class="chip warn">Withheld</span>';
        if (p.stale) return '<span class="chip warn">Stale price</span>';
        return '<span class="chip gain">Priced</span>'; }}
    ],
    rows: inUse,
    foot:[{v:inUse.length+' in use'},{v:String(totalHoldings),num:true},{v:inr(sum(inUse,function(p){return p.invested;}),0),num:true},
          {v:inr(PLAT_PRICED,0),num:true},{v:'',num:true},{v:'',num:true},
          {v:inr(sum(inUse,function(p){return p.charges;}),0),num:true},{v:pct(100),num:true},{v:''}],
    mobile:function(p){ return { l1:esc(p.name), r1:p.value===null?unavail(p.withheld):inr(p.value,0),
      l2:p.kind+' · '+p.holdings+' holding'+(p.holdings===1?'':'s'),
      r2:p.xirr===null?'':'<span class="'+cls(p.xirr)+'">'+pctS(p.xirr)+'</span>' }; }
  });

  var states = '<div class="cols">'+
    '<div><h3 style="margin-bottom:8px">Registered, holding nothing</h3>'+
    idle.map(function(p){ return '<div class="mrow" style="padding-left:0;padding-right:0"><div class="l1">'+esc(p.name)+'</div>'+
      '<div class="r1 muted">'+inr(0,0)+'</div><div class="l2">'+esc(p.kind)+'</div><div class="r2">'+esc(p.since)+'</div></div>'; }).join('')+
    '<p class="note" style="margin-top:10px">A zero here is a claim: these accounts exist and hold nothing. '+
    'They stay listed so a holding added later has somewhere to go.</p></div>'+
    '<div><h3 style="margin-bottom:8px">Archived</h3>'+
    archived.map(function(p){ return '<div class="mrow" style="padding-left:0;padding-right:0"><div class="l1">'+esc(p.name)+'</div>'+
      '<div class="r1 muted">'+inr(0,0)+'</div><div class="l2">'+esc(p.kind)+'</div><div class="r2">'+esc(p.since)+'</div></div>'; }).join('')+
    '<p class="note" style="margin-top:10px">Archived platforms keep their historical trades and realised gains but cannot receive new holdings. '+
    'Unarchiving restores it to the list above.</p></div></div>';

  h += '<div class="stack">'+
    panel('Platforms', tbl, {flush:true, icon:'building'}) +
    '<div class="cols">'+
      panel('Concentration and exposure', conc, {chip:NEW, icon:'signal'}) +
      panel('Return by platform', ret, {chip:NEW, icon:'trend'}) +
    '</div>'+
    '<div class="cols c2">'+
      panel('Charges by platform', chg, {chip:NEW}) +
      panel('Other states', states) +
    '</div>'+
    panel('Add a platform',
      '<div class="fgrid">'+
      '<div><label for="np-name">Platform</label><select id="np-name">'+
        ['HDFC Bank','ICICI Bank','Zerodha','Groww','INDmoney','Upstox','Angel One','ICICI Direct','HDFC Sky','SafeGold','Augmont','MMTC-PAMP','Kuvera','Other…']
        .map(function(n){ return '<option>'+n+'</option>'; }).join('')+'</select></div>'+
      '<div><label for="np-kind">Kind</label><select id="np-kind"><option>Broker</option><option>MF platform</option><option>Digital metal</option><option>Bank</option></select></div>'+
      '<div><label for="np-id">Client or folio id</label><input type="text" id="np-id" placeholder="ZD1234"></div>'+
      '<div><label for="np-settle">Settlement account</label><select id="np-settle"><option>HDFC Savings ••1234</option><option>ICICI Savings ••5567</option></select></div>'+
      '</div><div style="margin-top:14px"><button class="btn" type="button">Add platform</button></div>'+
      '<p class="note" style="margin-top:10px">Platform, not broker — the same word covers a bank, a fund house and a metal vault.</p>') +
  '</div>';
  return h;
};
</script>
<script>

SCREENS.decision = function(){
  var dta = DEBT_TOTAL / HEADLINE.assets * 100;
  var monthlyFloor = LOAN_EMI + CARD_MIN;

  var h = ph('Debt overview', '/liabilities — retired',
    'The five figures that cross cards and loans, and the record of why the route that used to hold them no longer exists.',
    '<span class="bdg out-loss">Route retired 21 Oct 2026</span>');

  h += '<div class="grid kpis">'+
    tile('Total outstanding', inrC(DEBT_TOTAL), inr(CARD_OWED,0)+' cards + '+inr(LOAN_OWED,0)+' loans') +
    tile('Blended rate', pct(BLENDED_LOANS), 'Loans only · weighted by balance',
      {info:'Cards carry no stored rate, so they cannot enter a weighted average.'}) +
    tile('Monthly outgo', inrC(monthlyFloor), inr(LOAN_EMI,0)+' instalments + '+inr(CARD_MIN,0)+' card minimums') +
    tile('Debt to assets', pct(dta), inr(DEBT_TOTAL,0)+' against '+inr(HEADLINE.assets,0), {tone:'gain'}) +
    tile('Debt-free', 'Oct <span class="u">2029</span>', 'At current instalments, nothing extra') +
  '</div>';

  h += '<div class="callout acc" style="margin-bottom:12px">'+
    '<b>These five figures now live in two places, and this screen is not one of them.</b><br>'+
    'They sit in the <b>Debt group header in the sidebar</b> (visible on every screen in the group — look left) '+
    'and in the <b>/dashboard</b> tile row beside Net worth, Assets and Liquid, where the Liabilities tile already exists. '+
    'Both are places you pass through anyway. A dedicated route was a place you had to decide to visit.</div>';

  var decision =
    '<div class="why" style="margin-bottom:14px"><b>Decision.</b> Retire <span class="mono">/liabilities</span>. '+
    'Keep <span class="mono">/cards</span> and <span class="mono">/loans</span> as they are. '+
    'Move the aggregate figures to the Debt nav group header and the dashboard tile row.</div>'+
    dataTable({ id:'decision-log', sortable:false,
      cols:[
        {h:'', w:28, sortable:false, fmt:function(r,i){ return '<span class="muted">'+(i+1)+'</span>'; }},
        {h:'Reason', w:220, sortable:false, fmt:function(r){ return '<span class="nm"><b>'+esc(r.t)+'</b></span>'; }},
        {h:'What it rests on', sortable:false, fmt:function(r){ return '<span style="white-space:normal;display:block;max-width:62ch;line-height:18px">'+r.d+'</span>'; }}
      ],
      rows:[
        { t:'Cards are a record, not an analysis',
          d:'The user keeps card balances by hand: <i>"for credit cards i will update the values manually."</i> '+
            'A hub earns its place by computing something across its children. Across a typed-in balance and an amortisation schedule '+
            'there is nothing to compute that the two screens do not already show.' },
        { t:'Five numbers are not a screen',
          d:'Total owed, blended rate, monthly outgo, debt-to-asset, debt-free date. That is a header strip or a tile row. '+
            'A route whose entire content is five derived figures is a route visited once.' },
        { t:'The cross-product roadmap died with the card APR',
          d:'The one feature only a hub could carry was ranking cards against loans by rate. '+
            'That needed a card APR the app does not store and will not invent, so the roadmap was removed rather than faked.' },
        { t:'Nothing is lost that was ever there',
          d:'<span class="mono">/liabilities</span> shipped as an empty Phase-3 placeholder: four null stats and an empty table. '+
            'Retiring it removes a promise, not a feature.' },
        { t:'The nav gets shorter',
          d:'The Wealth group is twelve flat items with duplicate icons. Dropping one and nesting Cards and Loans under a Debt group '+
            'with a figures header is a net reduction in both items and ambiguity.' }
      ],
      mobile:function(r){ return { l1:esc(r.t), r1:'', l2:'', r2:'' }; }
    });

  var kept =
    '<dl class="kv">'+
    '<dt>Total outstanding</dt><dd>Debt group header + <span class="mono">/dashboard</span></dd>'+
    '<dt>Blended rate</dt><dd>Debt group header</dd>'+
    '<dt>Monthly outgo</dt><dd>Debt group header</dd>'+
    '<dt>Debt to assets</dt><dd><span class="mono">/dashboard</span>, beside Liquid</dd>'+
    '<dt>Debt-free date</dt><dd><span class="mono">/loans</span> KPI row</dd>'+
    '<dt>Per-card mechanics</dt><dd><span class="mono">/cards</span></dd>'+
    '<dt>Per-loan schedules</dt><dd><span class="mono">/loans</span></dd>'+
    '<dt>Payoff ordering</dt><dd><span class="mono">/loans/payoff</span>, loans only</dd>'+
    '</dl>'+
    '<p class="note" style="margin-top:12px">The route itself should 301 to <span class="mono">/loans</span> rather than 404, '+
    'because it is linked from the existing sidebar and anyone who bookmarked it wants debt, not an error.</p>';

  var reversal =
    '<p class="note" style="margin-bottom:12px">One fact would overturn this, and it is checkable rather than a matter of taste.</p>'+
    '<div class="callout plain"><b>If a credit card is ever carried past its due date</b>, it starts accruing at a rate far above '+
    'every loan here, and no screen in the app would rank it against them. At that point the order of work is: '+
    'record a finance rate on the card, let it into <span class="mono">/loans/payoff</span>, and only then reconsider a hub. '+
    'Until a card revolves, the hub has nothing to say.</div>'+
    '<p class="note" style="margin-top:12px">Three design agents reached <i>retire</i> independently. '+
    'This one got there last and for a different reason — the others argued redundancy, '+
    'which is an argument about the route; the manual-entry decision is an argument about the data, and it is the stronger one.</p>';

  h += '<div class="stack">'+
    panel('Why the route was retired', decision, {flush:false, icon:'info'}) +
    '<div class="cols c2">'+
      panel('Where each figure went', kept, {icon:'list'}) +
      panel('What would reverse this', reversal, {icon:'warn'}) +
    '</div>'+
  '</div>';
  return h;
};
</script>
<script>
"use strict";
var NAV = {
  debt: [
    { id:'cards',       label:'Cards',       route:'/cards',             icon:'card' },
    { id:'cardDetail',  label:'One card',    route:'/cards/[id]',        icon:'card', sub:true },
    { id:'loans',       label:'Loans',       route:'/loans',             icon:'loan' },
    { id:'loanDetail',  label:'One loan',    route:'/loans/[id]',        icon:'loan', sub:true },
    { id:'payoff',      label:'Payoff',      route:'/loans/payoff',      icon:'trend', sub:true },
    { id:'decision',    label:'Debt overview', route:'/liabilities',     icon:'info' }
  ],
  assets: [
    { id:'deposits',  label:'Deposits',  route:'/deposits',  icon:'fd' },
    { id:'assets',    label:'Assets',    route:'/assets',    icon:'property' },
    { id:'platforms', label:'Platforms', route:'/platforms', icon:'building' }
  ]
};
var ALL_NAV = NAV.debt.concat(NAV.assets);
var view = document.getElementById('view');
var current = 'cards';

function buildNav(){
  ['debt','assets'].forEach(function(g){
    document.getElementById('rail-'+g).innerHTML = NAV[g].map(function(n){
      return '<button class="nvi'+(n.sub?' sub':'')+'" type="button" data-screen="'+n.id+'">'+
        (n.sub?'':'<span class="ic"><i data-i="'+n.icon+'" data-s="15"></i></span>')+
        '<span class="t">'+n.label+'</span><span class="rt">'+n.route+'</span></button>';
    }).join('');
  });
  document.getElementById('grp-debt-figs').innerHTML =
    '<dl>'+
    '<dt>Outstanding</dt><dd>'+inr(DEBT_TOTAL,0)+'</dd>'+
    '<dt>Blended rate</dt><dd>'+pct(BLENDED_LOANS)+'</dd>'+
    '<dt>Monthly outgo</dt><dd>'+inr(LOAN_EMI+CARD_MIN,0)+'</dd>'+
    '<dt>Debt to assets</dt><dd>'+pct(DEBT_TOTAL/HEADLINE.assets*100)+'</dd>'+
    '<dt>Debt-free</dt><dd>Oct 2029</dd>'+
    '</dl>'+
    '<div class="cap">The figures that used to need their own route. Blended rate covers loans only.</div>';
  document.getElementById('mobnav').innerHTML = ALL_NAV.map(function(n){
    return '<button type="button" data-screen="'+n.id+'"><i data-i="'+n.icon+'" data-s="13"></i>'+n.label+'</button>';
  }).join('');
  paintIcons(document.querySelector('.rail'));
  paintIcons(document.getElementById('mobnav'));
  paintIcons(document.querySelector('.rail-foot'));
}
function go(id){
  if (!SCREENS[id]) return;
  current = id;
  view.innerHTML = SCREENS[id]();
  document.querySelectorAll('[data-screen]').forEach(function(b){
    b.setAttribute('aria-current', b.dataset.screen === id ? 'true' : 'false');
  });
  wireSort(view);
  paintIcons(view);
  wireScreen(id);
  try { location.hash = id; } catch(e){}
  window.scrollTo(0,0);
}
document.addEventListener('click', function(e){
  var n = e.target.closest('[data-screen]');
  if (n){ go(n.dataset.screen); return; }
  var g = e.target.closest('[data-goto]');
  if (g){ go(g.dataset.goto); return; }
  var t = e.target.closest('[data-theme]');
  if (t){
    var v = t.dataset.theme;
    if (v === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
    t.parentNode.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b===t ? 'true':'false'); });
    try { localStorage.setItem('sm-theme', v); } catch(err){}
    return;
  }
  var d = e.target.closest('[data-density]');
  if (d){
    document.body.setAttribute('data-density', d.dataset.density);
    d.parentNode.querySelectorAll('button').forEach(function(b){ b.setAttribute('aria-pressed', b===d ? 'true':'false'); });
    try { localStorage.setItem('sm-density', d.dataset.density); } catch(err){}
  }
});

/* ---------------- per-screen interactivity ---------------- */
function wireScreen(id){
  if (id === 'cardDetail') wireCardDetail();
  if (id === 'loanDetail') wireLoanDetail();
  if (id === 'payoff') wirePayoff();
  if (id === 'assets') wireAssets();
}

/* --- revolve projection + payment echo --- */
function wireCardDetail(){
  var c = CARDS[0];
  var slider = document.getElementById('rev-pay');
  var out = document.getElementById('revolve-out');
  function render(){
    var pay = +slider.value;
    var bal = c.owed, months = 0, interest = 0, rows = [];
    while (bal > 0.5 && months < 240){
      months++;
      var i = bal * c.financeMonthly/100;
      var gst = i * 0.18;
      interest += i + gst;
      bal = bal + i + gst - Math.min(pay, bal + i + gst);
      rows.push(bal);
      if (pay <= i + gst) { months = null; break; }
    }
    var inFull = pay >= c.owed;
    out.innerHTML =
      '<dl class="kv"><dt>Monthly payment</dt><dd>'+inr(pay,0)+'</dd>'+
      '<dt>Cleared in</dt><dd>'+(inFull ? '<span class="gain">this payment</span>'
        : (months === null ? '<span class="loss">never — the payment is below the monthly charge</span>' : months+' months'))+'</dd>'+
      '<dt>Interest and GST paid</dt><dd class="'+(interest>0?'loss':'gain')+'">'+(inFull ? inr(0,0) : inr(Math.round(interest),0))+'</dd>'+
      '<dt>Total cost of '+inr(c.owed,0)+'</dt><dd>'+inr(Math.round(c.owed + (inFull?0:interest)),0)+'</dd></dl>'+
      (inFull ? '<div class="callout" style="margin-top:12px;border-color:var(--gain);background:var(--gain-bg)">'+
        '<b>Paid in full by '+c.dueOn+'. Interest is '+inr(0,0)+'.</b> That zero is a claim, not an absence — the grace period genuinely costs nothing.</div>'
        : '<div class="callout" style="margin-top:12px"><b>Carrying a balance also ends the grace period on new spending.</b> '+
          'Every purchase from the next swipe accrues from its transaction date, not from the next statement.</div>');
  }
  slider.addEventListener('input', render);
  render();

  var amt = document.getElementById('pay-amt'), preset = document.getElementById('pay-preset');
  function echo(){
    var v = +amt.value || 0;
    document.getElementById('pay-echo').textContent = inr(v,0);
    document.getElementById('pay-echo2').textContent = inr(v,0);
  }
  amt.addEventListener('input', echo);
  preset.addEventListener('change', function(){ if (+preset.value) { amt.value = preset.value; echo(); } });
}

/* --- prepayment slider + amortisation schedule --- */
function wireLoanDetail(){
  var l = LOANS[0];
  var base = buildSchedule(l.owed, l.rate, l.emi, 0);
  var baseT = scheduleTotals(base);
  var slider = document.getElementById('prepay');
  var out = document.getElementById('prepay-out');
  var sched = document.getElementById('sched-out');

  function render(){
    var lump = +slider.value;
    var alt = buildSchedule(l.owed, l.rate, l.emi, lump);
    var altT = scheduleTotals(alt);
    var saved = baseT.interest - altT.interest;
    var mSaved = baseT.months - altT.months;
    out.innerHTML =
      '<div class="grid" style="grid-template-columns:1fr 1fr;gap:10px">'+
      '<div class="tile" style="padding:12px"><div class="lab">Interest saved</div>'+
        '<div class="val gain" style="font-size:20px;line-height:26px">'+(lump?inr(Math.round(saved),0):inr(0,0))+'</div>'+
        '<div class="delta">of '+inr(Math.round(baseT.interest),0)+' remaining</div></div>'+
      '<div class="tile" style="padding:12px"><div class="lab">Months saved</div>'+
        '<div class="val gain" style="font-size:20px;line-height:26px">'+mSaved+'</div>'+
        '<div class="delta">'+baseT.months+' → '+altT.months+' instalments</div></div></div>'+
      '<dl class="kv" style="margin-top:12px"><dt>Lump sum today</dt><dd>'+inr(lump,0)+'</dd>'+
      '<dt>Balance after prepayment</dt><dd>'+inr(Math.max(0,l.owed-lump),0)+'</dd>'+
      '<dt>New payoff date</dt><dd>'+monthLabel(altT.months-1)+'</dd>'+
      '<dt>Every rupee prepaid saves</dt><dd>'+(lump ? '₹'+(saved/lump).toFixed(2) : '—')+'</dd></dl>';
    renderSchedule(alt, lump);
  }

  function renderSchedule(rows, lump){
    var cum = 0;
    var data = rows.map(function(r,i){
      cum += r.interest;
      return { m:i+1, when:monthLabel(i), fy:fyOf(i), payment:r.payment, principal:r.principal,
               interest:r.interest, cum:cum, balance:r.balance, __today:i===0 };
    });
    sched.innerHTML =
      (lump ? '<div class="callout acc" style="margin-bottom:12px"><b>'+inr(lump,0)+' prepaid today.</b> '+
        'The schedule below is the one that results — '+rows.length+' instalments instead of '+baseT.months+
        '. The instalment stays at '+inr(l.emi,0)+'; the term shortens.</div>' : '') +
      stackedAreaWithLine({
        points: data.filter(function(r,i){ return i%2===0 || i===data.length-1; })
                    .map(function(r){ return { label:r.when, a:r.principal, b:r.interest, line:r.balance }; }),
        w:760, h:250, every:4
      }) +
      legend(['Principal, per instalment','Interest, per instalment','Outstanding balance'],
             ['var(--c3)','var(--c2)','var(--fg)']) +
      '<div style="margin-top:14px">'+
      dataTable({
        id:'sched-table', tall:true,
        cols:[
          {h:'#', w:44, fmt:function(r){ return '<span class="muted" data-v="'+r.m+'">'+r.m+'</span>'; }},
          {h:'Due', w:84, fmt:function(r){ return r.when; }},
          {h:'FY', w:84, fmt:function(r){ return '<span class="sub2">'+r.fy+'</span>'; }},
          {h:'Instalment', num:true, w:110, fmt:function(r){ return '<span data-v="'+r.payment+'">'+inr(r.payment)+'</span>'; }},
          {h:'Principal', num:true, w:110, fmt:function(r){ return '<span data-v="'+r.principal+'">'+inr(r.principal)+'</span>'; }},
          {h:'Interest', num:true, w:110, fmt:function(r){ return '<span class="loss" data-v="'+r.interest+'">'+inr(r.interest)+'</span>'; }},
          {h:'Interest to date', num:true, w:130, fmt:function(r){ return '<span data-v="'+r.cum+'">'+inr(r.cum,0)+'</span>'; }},
          {h:'Balance', num:true, w:120, fmt:function(r){ return '<span data-v="'+r.balance+'">'+inr(r.balance,0)+'</span>'; }}
        ],
        rows: data,
        foot:[{v:rows.length+' instalments', span:3},
              {v:inr(sum(data,function(r){return r.payment;}),0),num:true},
              {v:inr(sum(data,function(r){return r.principal;}),0),num:true},
              {v:inr(sum(data,function(r){return r.interest;}),0),num:true},
              {v:'',num:true},{v:inr(0,0),num:true}],
        mobile:function(r){ return { l1:'#'+r.m+' · '+r.when, r1:inr(r.payment),
          l2:'Principal '+inr(r.principal,0)+' · interest '+inr(r.interest,0), r2:inr(r.balance,0)+' left' }; }
      })+'</div>'+
      '<p class="note" style="margin-top:10px">Sticky header, sticky totals, and the next instalment highlighted. '+
      'Financial-year column so a year’s interest can be read off directly for a home-loan deduction claim.</p>';
    wireSort(sched);
    paintIcons(sched);
  }

  slider.addEventListener('input', render);
  render();
  document.getElementById('jump-today').addEventListener('click', function(){
    var row = sched.querySelector('tr.today');
    if (row) row.scrollIntoView({ block:'center' });
  });
}

/* --- payoff: budget slider, avalanche vs snowball --- */
function wirePayoff(){
  var slider = document.getElementById('budget');
  var numIn = document.getElementById('budget-num');
  var out = document.getElementById('payoff-out');

  function render(budget){
    var av = payoffSim(PAYOFF_DEBTS, budget, BY_RATE);
    var sn = payoffSim(PAYOFF_DEBTS, budget, BY_BALANCE);

    if (av.fails){
      out.innerHTML = '<div class="callout loss"><b>That budget will not clear the debts.</b><br>'+
        'The three instalments total '+inr(av.minSum,0)+' a month. A budget of '+inr(budget,0)+' is '+
        '<span class="loss">'+inr(av.short,0)+' short</span>, so at least one loan would fall into arrears before any strategy could apply. '+
        'Raise the budget to '+inr(av.minSum,0)+' to see a comparison.</div>'+
        '<div class="panel" style="margin-top:12px"><div class="panel-bd">'+
        '<h3 style="margin-bottom:10px">What each loan needs</h3>'+
        '<dl class="kv" style="max-width:460px">'+PAYOFF_DEBTS.map(function(d){
          return '<dt>'+esc(d.name)+'</dt><dd>'+inr(d.min,0)+'</dd>'; }).join('')+
        '<dt style="color:var(--fg);font-weight:600">Minimum viable budget</dt><dd style="font-weight:600">'+inr(av.minSum,0)+'</dd></dl></div></div>';
      return;
    }

    var saves = sn.interest - av.interest;
    var sooner = sn.months - av.months;
    var surplus = budget - av.minSum;

    var cmp = multiLine({
      w:720, h:250,
      series:[
        { label:'Avalanche', color:'var(--c3)', pts: av.hist.map(function(p){return p.total;}) },
        { label:'Snowball',  color:'var(--c2)', dash:true, pts: sn.hist.map(function(p){return p.total;}) }
      ]
    });

    var orderRows = function(sim, strategyName){
      return sim.order.map(function(o,i){
        var d = PAYOFF_DEBTS.filter(function(x){return x.name===o.name;})[0];
        return { pos:i+1, name:o.name, rate:d.rate, bal:d.bal, month:o.month, when:monthLabel(o.month-1) };
      });
    };
    var avOrder = orderRows(av), snOrder = orderRows(sn);

    out.innerHTML =
      '<div class="grid kpis">'+
        tile('Avalanche interest', inrC(Math.round(av.interest)), 'Highest rate first · '+av.months+' months') +
        tile('Snowball interest', inrC(Math.round(sn.interest)), 'Smallest balance first · '+sn.months+' months') +
        tile('Avalanche saves', inrS(Math.round(saves),0), 'Against snowball, same budget', {tone:saves>0?'gain':'flat'}) +
        tile('And finishes', sooner+'<span class="u">months sooner</span>', sooner===0?'Both clear in the same month':'At '+inr(budget,0)+' a month') +
        tile('Surplus over instalments', inrC(surplus), inr(av.minSum,0)+' is the floor') +
      '</div>' +
      '<div class="cols c2">'+
        panel('Outstanding over time', cmp +
          legend(['Avalanche — highest rate first','Snowball — smallest balance first'],['var(--c3)','var(--c2)']) +
          '<p class="note" style="margin-top:8px">Total debt across all three loans, month by month, at '+inr(budget,0)+' a month. '+
          'Snowball drops in visible steps as small balances vanish; avalanche is flatter early and then overtakes. '+
          (saves>0 ? 'Avalanche wins by '+inr(Math.round(saves),0)+' here.'
                   : 'At this budget the two orderings coincide, so neither wins.')+'</p>', {chip:NEW}) +
        panel('Strategy comparison',
          '<dl class="kv"><dt>Budget</dt><dd>'+inr(budget,0)+'</dd>'+
          '<dt>Instalments due</dt><dd>'+inr(av.minSum,0)+'</dd>'+
          '<dt>Surplus directed at one loan</dt><dd>'+inr(surplus,0)+'</dd>'+
          '<dt>Avalanche finishes</dt><dd>'+monthLabel(av.months-1)+'</dd>'+
          '<dt>Snowball finishes</dt><dd>'+monthLabel(sn.months-1)+'</dd>'+
          '<dt>Interest difference</dt><dd class="'+(saves>0?'gain':'flat')+'">'+inrS(Math.round(saves),0)+'</dd></dl>'+
          '<p class="note" style="margin-top:12px">Avalanche is always at least as cheap. Snowball clears individual debts sooner, '+
          'which some people need to keep going. The app will not pick for you.</p>') +
      '</div>' +
      '<div class="cols">'+
        panel('Avalanche — payoff order', payoffTable(avOrder,'av'), {flush:true, chip:NEW,
          right:'<span class="note">By rate, highest first</span>'}) +
        panel('Snowball — payoff order', payoffTable(snOrder,'sn'), {flush:true, chip:NEW,
          right:'<span class="note">By balance, smallest first</span>'}) +
      '</div>';
    wireSort(out);
    paintIcons(out);
  }

  function payoffTable(rows, key){
    return dataTable({
      id:'order-'+key,
      cols:[
        {h:'#', w:34, sortable:false, fmt:function(r){ return '<span class="muted">'+r.pos+'</span>'; }},
        {h:'Loan', w:176, fmt:function(r){ return '<span class="nm">'+esc(r.name)+'</span>'; }},
        {h:'Rate', num:true, w:76, fmt:function(r){ return pct(r.rate); }},
        {h:'Balance today', num:true, w:116, fmt:function(r){ return inr(r.bal,0); }},
        {h:'Cleared', num:true, w:96, fmt:function(r){ return r.when; }},
        {h:'Months', num:true, w:72, fmt:function(r){ return String(r.month); }}
      ],
      rows: rows,
      mobile:function(r){ return { l1:'#'+r.pos+' '+r.name, r1:inr(r.bal,0), l2:pct(r.rate), r2:'clears '+r.when }; }
    });
  }

  slider.addEventListener('input', function(){ numIn.value = slider.value; render(+slider.value); });
  numIn.addEventListener('input', function(){
    var v = Math.max(+slider.min, Math.min(+slider.max, +numIn.value || 0));
    slider.value = v; render(v);
  });
  render(+slider.value);
}

/* --- revaluation echo --- */
function wireAssets(){
  var sel = document.getElementById('rv-asset'), nv = document.getElementById('rv-new'),
      echo = document.getElementById('reval-echo');
  function render(){
    var old = +sel.value, nw = +nv.value || 0, delta = nw - old;
    var name = sel.options[sel.selectedIndex].text;
    echo.innerHTML = '<b>'+esc(name)+'</b><br>'+
      '<span class="mono">'+(delta>=0?'DEBIT&nbsp;':'CREDIT')+' Assets:Physical:'+esc(name.split('—')[0].trim())+'&nbsp;&nbsp; '+inr(Math.abs(delta),0)+'</span><br>'+
      '<span class="mono">'+(delta>=0?'CREDIT':'DEBIT&nbsp;')+' Equity:Valuation adjustments&nbsp;&nbsp;&nbsp;&nbsp; '+inr(Math.abs(delta),0)+'</span><br>'+
      inr(old,0)+' → '+inr(nw,0)+' · <span class="'+cls(delta)+'">'+inrS(delta,0)+' ('+pctS(old?delta/old*100:0)+')</span>. '+
      'Net worth moves by exactly this delta; no income or expense is recorded.';
  }
  sel.addEventListener('change', render);
  nv.addEventListener('input', render);
  render();
}

function syncRange(input){
  var wrap = input.closest('.rng'); if (!wrap) return;
  var fill = wrap.querySelector('.fill'); if (!fill) return;
  var min = +input.min || 0, max = +input.max || 100, v = +input.value;
  fill.style.width = 'calc(' + ((v - min) / (max - min) * 100) + '% - ' + (((v - min) / (max - min)) * 14) + 'px + 7px)';
}
/* ---------------- boot ---------------- */
(function(){
  try {
    var t = localStorage.getItem('sm-theme');
    if (t && t !== 'system') document.documentElement.setAttribute('data-theme', t);
    if (t) document.querySelectorAll('[data-theme]').forEach(function(b){
      if (b.tagName === 'BUTTON') b.setAttribute('aria-pressed', b.dataset.theme === t ? 'true':'false'); });
    var d = localStorage.getItem('sm-density');
    if (d){
      document.body.setAttribute('data-density', d);
      document.querySelectorAll('[data-density]').forEach(function(b){
        if (b.tagName === 'BUTTON') b.setAttribute('aria-pressed', b.dataset.density === d ? 'true':'false'); });
    } else document.body.setAttribute('data-density','compact');
  } catch(e){ document.body.setAttribute('data-density','compact'); }
  buildNav();
  var h = (location.hash||'').replace('#','');
  go(SCREENS[h] ? h : 'cards');
})();
</script>

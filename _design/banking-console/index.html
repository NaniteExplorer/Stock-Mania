<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stock-Mania Banking Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail + sticky toolbar + one scrolling work surface per screen.
   Component layer refitted to the Control Bench (2026-10-20): heights 24/28/32/36/40 with
   32 default so a control sits in a Compact row without changing it, radius bound to height,
   five border strengths, selection as a 2px inset accent bar. */

:root{
  --n-0:#FFFFFF;--n-25:#FBFCFD;--n-50:#F6F8FA;--n-100:#EFF2F5;--n-150:#E4E8ED;--n-200:#D6DCE3;
  --n-300:#B9C2CC;--n-400:#8C98A6;--n-450:#808C9A;--n-500:#64707E;--n-600:#49545F;--n-700:#343C45;
  --n-775:#2A323A;--n-800:#232A31;--n-850:#1A2026;--n-900:#13181D;--n-950:#0C1014;

  --h-xs:24px;--h-sm:28px;--h-md:32px;--h-lg:36px;--h-xl:40px;
  --r-1:2px;--r-2:3px;--r-3:4px;--r-4:6px;--r-5:8px;--r-pill:999px;
  --t-fast:90ms;--t:110ms;--ease:cubic-bezier(.2,0,.38,1);

  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --row:32px;--cellpad:6px 12px;--cellfs:13px;
}
:root,.tf-light{
  --bg-canvas:#F6F8FA;--bg-surface:#FFFFFF;--bg-raised:#FFFFFF;--bg-sunken:#F2F5F8;
  --bg-subtle:#F2F5F8;--bg-hover:#F6F8FA;--bg-active:#EFF2F5;--bg-selected:#EEF2FF;
  --border-subtle:#E4E8ED;--border:#D6DCE3;--border-control:#808C9A;
  --border-hover:#64707E;--border-active:#49545F;
  --fg:#13181D;--fg-secondary:#49545F;--fg-muted:#64707E;--fg-disabled:#7C8896;
  --accent:#4F62D8;--accent-hover:#3F50BE;--accent-active:#36459F;--accent-on:#FFFFFF;
  --accent-soft:#EEF2FF;--accent-soft-hover:#E0E7FF;--accent-line:#A5B4FC;
  --gain:#0E7C66;--gain-bg:#E6F5F1;--gain-line:#8FD3C4;
  --loss:#C0392B;--loss-bg:#FBEAE7;--loss-line:#EAA69E;--loss-on:#FFFFFF;
  --flat:#64707E;
  --warn:#B45309;--warn-bg:#FDF4E6;--warn-line:#E8C58A;
  --info:#1D6FA5;--info-bg:#E9F3FA;--info-line:#9CC6E2;
  --inner-hl:inset 0 -1px 0 rgb(19 24 29 / .07);
  --inner-hl-2:inset 0 -1px 0 rgb(19 24 29 / .13);
  --shadow-pop:0 4px 12px rgb(19 24 29 / .10), 0 0 0 1px rgb(19 24 29 / .04);
  --shadow-modal:0 16px 48px rgb(19 24 29 / .20), 0 0 0 1px rgb(19 24 29 / .06);
  --skel-a:#EFF2F5;--skel-b:#E0E5EA;
  --tip-bg:#13181D;--tip-fg:#F6F8FA;
  --c1:#5468D6;--c2:#1F94A8;--c3:#B5801F;--c4:#A14C9E;--c5:#4E7A3A;--c6:#8C98A6;
  --grid:#E4E8ED;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-canvas:#0C1014;--bg-surface:#13181D;--bg-raised:#1A2026;--bg-sunken:#0C1014;
  --bg-subtle:#1A2026;--bg-hover:#232A31;--bg-active:#2A323A;--bg-selected:#1B2340;
  --border-subtle:#232A31;--border:#343C45;--border-control:#64707E;
  --border-hover:#8C98A6;--border-active:#B9C2CC;
  --fg:#F6F8FA;--fg-secondary:#B9C2CC;--fg-muted:#8C98A6;--fg-disabled:#5C6875;
  --accent:#7D8CEA;--accent-hover:#9AA6F0;--accent-active:#B2BBF5;--accent-on:#0C1014;
  --accent-soft:#1B2340;--accent-soft-hover:#232C4E;--accent-line:#4F62D8;
  --gain:#3FC9A6;--gain-bg:#0E2F29;--gain-line:#1F6B5B;
  --loss:#FF7A6B;--loss-bg:#3A1A16;--loss-line:#8A3C33;--loss-on:#0C1014;
  --flat:#8C98A6;
  --warn:#F0B429;--warn-bg:#2E2411;--warn-line:#7A5E1B;
  --info:#5BB0E8;--info-bg:#11252F;--info-line:#2E6888;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --inner-hl-2:inset 0 1px 0 rgb(255 255 255 / .10);
  --shadow-pop:0 4px 12px rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
  --shadow-modal:0 16px 48px rgb(0 0 0 / .60), 0 0 0 1px rgb(255 255 255 / .08);
  --skel-a:#1A2026;--skel-b:#272F37;
  --tip-bg:#E4E8ED;--tip-fg:#13181D;
  --c1:#8A7FE8;--c2:#2FA3BA;--c3:#B68530;--c4:#C76BA0;--c5:#6FA14E;--c6:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}}
:root[data-theme="dark"],.tf-dark{
  --bg-canvas:#0C1014;--bg-surface:#13181D;--bg-raised:#1A2026;--bg-sunken:#0C1014;
  --bg-subtle:#1A2026;--bg-hover:#232A31;--bg-active:#2A323A;--bg-selected:#1B2340;
  --border-subtle:#232A31;--border:#343C45;--border-control:#64707E;
  --border-hover:#8C98A6;--border-active:#B9C2CC;
  --fg:#F6F8FA;--fg-secondary:#B9C2CC;--fg-muted:#8C98A6;--fg-disabled:#5C6875;
  --accent:#7D8CEA;--accent-hover:#9AA6F0;--accent-active:#B2BBF5;--accent-on:#0C1014;
  --accent-soft:#1B2340;--accent-soft-hover:#232C4E;--accent-line:#4F62D8;
  --gain:#3FC9A6;--gain-bg:#0E2F29;--gain-line:#1F6B5B;
  --loss:#FF7A6B;--loss-bg:#3A1A16;--loss-line:#8A3C33;--loss-on:#0C1014;
  --flat:#8C98A6;
  --warn:#F0B429;--warn-bg:#2E2411;--warn-line:#7A5E1B;
  --info:#5BB0E8;--info-bg:#11252F;--info-line:#2E6888;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --inner-hl-2:inset 0 1px 0 rgb(255 255 255 / .10);
  --shadow-pop:0 4px 12px rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
  --shadow-modal:0 16px 48px rgb(0 0 0 / .60), 0 0 0 1px rgb(255 255 255 / .08);
  --skel-a:#1A2026;--skel-b:#272F37;
  --tip-bg:#E4E8ED;--tip-fg:#13181D;
  --c1:#8A7FE8;--c2:#2FA3BA;--c3:#B68530;--c4:#C76BA0;--c5:#6FA14E;--c6:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}
:root[data-density="comfortable"]{--row:36px;--cellpad:8px 12px}
:root[data-density="dense"]{--row:28px;--cellpad:4px 10px;--cellfs:12.5px}

*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--fg);font-family:var(--sans);font-size:14px;
  line-height:20px;font-feature-settings:"tnum" 1,"cv05" 1;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{cursor:pointer}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:slashed-zero tabular-nums;font-size:11.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.srly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------------- shell ---------------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg-surface)}
.app{display:flex;min-height:100%}
.rail{width:218px;flex:0 0 218px;background:var(--bg-surface);border-right:1px solid var(--border);
  position:sticky;top:0;align-self:flex-start;height:100vh;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px)}
.rail-brand{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--border-subtle)}
.mark{width:22px;height:22px;border:1.5px solid var(--accent);border-radius:var(--r-2);flex:none;position:relative}
.mark::after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:6px;
  background:linear-gradient(to right,var(--accent) 0 2px,transparent 2px 4px,var(--accent) 4px 7px,transparent 7px 9px,var(--accent) 9px 13px)}
.rail-brand b{font-size:13px;font-weight:600;display:block;letter-spacing:-.005em}
.rail-brand span{font-size:10.5px;color:var(--fg-muted);letter-spacing:.02em}
.nvi-grp{font-size:10.5px;line-height:16px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--fg-muted);padding:10px 14px 3px}
.rail nav{display:flex;flex-direction:column;gap:1px;padding:0 7px;overflow:auto}
.nvi{display:flex;align-items:center;gap:9px;height:var(--h-md);padding:0 9px;border-radius:var(--r-2);
  color:var(--fg-secondary);font-size:13px;border:0;background:none;width:100%;text-align:left;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.nvi:hover{background:var(--bg-hover);color:var(--fg)}
.nvi:active{background:var(--bg-active)}
.nvi span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nvi svg{flex:none;opacity:.82}
.nvi[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.nvi[aria-current="true"] svg{opacity:1}
.nvi:focus-visible{outline-offset:-2px}
.nvi .sub{font-size:10.5px;color:var(--fg-muted);font-family:var(--mono);flex:none}
.rail-foot{margin-top:auto;padding:11px 14px;border-top:1px solid var(--border-subtle);font-size:11px;
  color:var(--fg-muted);line-height:16px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg-surface);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding-block:8px;padding-left:var(--gl);padding-right:var(--gr)}
.topbar .spacer{flex:1}
.screenwrap{padding-left:var(--gl);padding-right:var(--gr);padding-block:16px 72px}
.screen[hidden]{display:none!important}

/* ---------------- buttons ---------------- */
.btn{--bh:var(--h-md);--bp:12px;--bf:13px;--br:var(--r-2);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--bh);padding:0 var(--bp);font-size:var(--bf);font-weight:500;line-height:1;letter-spacing:.004em;
  border:1px solid var(--border-control);border-radius:var(--br);background:var(--bg-surface);color:var(--fg);
  box-shadow:var(--inner-hl);white-space:nowrap;user-select:none;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),
             color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.btn > *{transition:transform var(--t-fast) var(--ease)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.btn:active{background:var(--bg-active);border-color:var(--border-active);box-shadow:none}
.btn:active > *{transform:translateY(.5px)}
.btn[disabled],.btn[aria-disabled="true"]{background:var(--bg-subtle);border-color:var(--border);
  color:var(--fg-disabled);box-shadow:none;cursor:not-allowed}
.btn[disabled]:active > *{transform:none}
.btn svg{flex:none;display:block}
.btn-sm{--bh:var(--h-sm);--bp:10px;--bf:12px}
.btn-xs{--bh:var(--h-xs);--bp:7px;--bf:11.5px}
.btn.only{width:var(--bh);padding:0;gap:0}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on);box-shadow:var(--inner-hl-2)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-primary:active{background:var(--accent-active);border-color:var(--accent-active);box-shadow:none}
.btn-primary[disabled]{background:var(--bg-subtle);border-color:var(--border);color:var(--fg-disabled);box-shadow:none}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--fg-secondary)}
.btn-ghost:hover{background:var(--bg-hover);border-color:transparent;color:var(--fg)}
.btn-ghost:active{background:var(--bg-active);border-color:transparent}
.btn-danger-quiet{background:var(--bg-surface);border-color:var(--loss-line);color:var(--loss)}
.btn-danger-quiet:hover{background:var(--loss-bg);border-color:var(--loss)}
.btn-link{height:auto;padding:0;border:0;background:none;box-shadow:none;color:var(--accent);font-weight:500;
  text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;text-decoration-color:var(--accent-line)}
.btn-link:hover{background:none;text-decoration-color:currentColor}
.btn-link:active > *{transform:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);box-shadow:none}
.btn[aria-pressed="true"]:hover{background:var(--accent-soft-hover);border-color:var(--accent)}
/* segmented, flush-bordered: the hairline beside a selected segment is suppressed both sides */
.seg{display:inline-flex;height:var(--h-md);border:1px solid var(--border-control);border-radius:var(--r-2);
  overflow:hidden;background:var(--bg-surface)}
.seg button{height:100%;padding:0 11px;border:0;background:none;font-size:12px;font-weight:500;
  color:var(--fg-secondary);white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.seg button + button{box-shadow:inset 1px 0 0 var(--border)}
.seg button:hover{background:var(--bg-hover);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"] + button{box-shadow:none}
.seg button:focus-visible{outline-offset:-2px}
.seg-sm{height:var(--h-sm)}
.seg-sm button{padding:0 9px;font-size:11.5px}

/* ---------------- form controls ---------------- */
input[type=text],input[type=number],input[type=date],input[type=search]{
  height:var(--h-md);padding:0 9px;font-size:12.5px;background:var(--bg-surface);color:var(--fg);
  border:1px solid var(--border-control);border-radius:var(--r-2);box-shadow:var(--inner-hl);min-width:0;
  transition:border-color var(--t-fast) var(--ease)}
input::placeholder{color:var(--fg-disabled)}
input[type=text]:hover,input[type=number]:hover,input[type=date]:hover{border-color:var(--border-hover)}
input:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px;box-shadow:none}
input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
input[readonly]{background:var(--bg-subtle);border-style:dashed;border-color:var(--border);
  color:var(--fg-secondary);box-shadow:none}
select{height:var(--h-md);padding:0 26px 0 9px;font-size:12.5px;background-color:var(--bg-surface);color:var(--fg);
  border:1px solid var(--border-control);border-radius:var(--r-2);box-shadow:var(--inner-hl);appearance:none;
  max-width:100%;min-width:0;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) calc(50% + 1px),calc(100% - 9px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  transition:border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
select:hover{border-color:var(--border-hover);background-color:var(--bg-hover)}
select:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
select:disabled{background-color:var(--bg-subtle);border-color:var(--border);color:var(--fg-disabled);box-shadow:none}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span.lbl{font-size:12px;line-height:16px;font-weight:500;color:var(--fg-secondary)}
input[type=checkbox]{appearance:none;width:16px;height:16px;flex:none;border:1px solid var(--border-control);
  border-radius:var(--r-1);background:var(--bg-surface);box-shadow:var(--inner-hl);display:grid;place-items:center;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
input[type=checkbox]::after{content:"";width:9px;height:5px;border:1.6px solid var(--accent-on);border-top:0;
  border-right:0;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform var(--t-fast) var(--ease)}
input[type=checkbox]:hover{border-color:var(--border-hover)}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent);box-shadow:var(--inner-hl-2)}
input[type=checkbox]:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
input[type=radio]{accent-color:var(--accent);width:15px;height:15px}

/* ---------------- data display ---------------- */
.lbl{font-size:12px;line-height:16px;font-weight:500;color:var(--fg-muted)}
.micro{font-size:11px;line-height:14px;font-weight:500;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-2);
  font-size:11px;font-weight:500;line-height:1;letter-spacing:.008em;white-space:nowrap;
  border:1px solid transparent;background:var(--bg-subtle);color:var(--fg-secondary)}
.chip svg{flex:none}
.chip.gain{background:var(--gain-bg);color:var(--gain)}
.chip.loss{background:var(--loss-bg);color:var(--loss)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.out{background:none;border-color:var(--border);color:var(--fg-secondary)}
.chip.mono{font-family:var(--mono);font-size:10px;letter-spacing:0}
.new{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:var(--r-2);
  border:1px dashed var(--border-control);background:none;color:var(--fg-muted);
  font-size:10px;line-height:1;font-weight:600;letter-spacing:.06em;vertical-align:middle;margin-left:6px}
.gain{color:var(--gain)}.loss{color:var(--loss)}.flat{color:var(--flat)}
/* "unavailable, and why" — keyboard reachable, never a silent zero */
.dash{color:var(--fg-muted);text-decoration:underline dotted;text-underline-offset:3px;cursor:help;
  border-radius:var(--r-1)}
.dash:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-4)}
.panel-h{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 14px;
  border-bottom:1px solid var(--border-subtle);background:var(--bg-subtle);
  border-radius:var(--r-4) var(--r-4) 0 0}
.panel-h h2{font-size:13px;line-height:18px;font-weight:600}
.panel-b{padding:14px}
.page-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.page-h h1{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.012em}
.page-h p{font-size:13px;line-height:20px;color:var(--fg-secondary);max-width:74ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px;margin-bottom:16px}
.kpi{display:flex;flex-direction:column;gap:5px;padding:12px 14px 0;border:1px solid var(--border);
  border-radius:var(--r-4);background:var(--bg-surface);min-width:0;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.kpi:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.kpi .lbl{display:flex;align-items:center;gap:5px}
.kpi .v{font-size:24px;line-height:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.016em}
.kpi .v .u{font-size:11px;font-weight:500;color:var(--fg-muted);margin-left:2px;letter-spacing:0}
.kpi .d{font-size:11px;line-height:14px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .d .p{color:var(--fg-muted);font-weight:400}

/* 100% stacked composition over time, with a 2px surface gap between segments */
function stacked100(labels,series,colors,h){
  h=h||220;var W=1000,P={l:40,r:16,t:12,b:30},pw=W-P.l-P.r,ph=h-P.t-P.b;
  var n=labels.length,slot=pw/n,bw=slot-6,out='';
  for(var i=0;i<n;i++){
    var tot=series[i].reduce(function(a,b){return a+b;},0),acc=0,x=P.l+slot*i+3;
    for(var k=0;k<series[i].length;k++){
      var frac=series[i][k]/tot,hh=frac*ph;

/* cashflow waterfall: opening → income → expense bars → closing */
function waterfall(steps,h){
  h=h||260;var W=1000,P={l:56,r:16,t:16,b:52},pw=W-P.l-P.r,ph=h-P.t-P.b;
  var run=0,bars=[],lo=0,hi=0;
  steps.forEach(function(s){
    if(s.type==='total'){bars.push({label:s.label,from:0,to:s.value,total:true,value:s.value});run=s.value;}
    else{var from=run,to=run+s.value;bars.push({label:s.label,from:from,to:to,value:s.value});run=to;}
    lo=Math.min(lo,run);hi=Math.max(hi,run);
  });
  hi*=1.06;
  var y=function(v){return P.t+ph-((v-lo)/(hi-lo))*ph;};
  var g='';niceTicks(lo,hi,4).forEach(function(t){g+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'" stroke="var(--grid)"/>'+
    '<text x="'+(P.l-8)+'" y="'+(y(t)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--fg-muted)">'+esc(compactAxis(t))+'</text>';});
  var slot=pw/bars.length,bw=Math.min(54,slot-14),out='',prevX=null,prevY=null;
  bars.forEach(function(b,i){
    var x=P.l+slot*i+(slot-bw)/2;
    var yTop=y(Math.max(b.from,b.to)),yBot=y(Math.min(b.from,b.to));
    var fill=b.total?'var(--n-400)':(b.value>=0?'var(--gain)':'var(--loss)');
    out+='<rect class="hv" data-i="'+i+'" x="'+x.toFixed(1)+'" y="'+yTop.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(2,yBot-yTop).toFixed(1)+'" rx="2" fill="'+fill+'"/>';
    out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(yTop-6).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="500" fill="var(--fg-secondary)">'+esc(b.total?compactAxis(b.to):(b.value>=0?'+':MINUS)+compactAxis(Math.abs(b.value)))+'</text>';
    var words=b.label.split(' ');
    out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-30)+'" text-anchor="middle" font-size="11" fill="var(--fg-muted)">'+esc(words[0])+'</text>';
    if(words.length>1)out+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(h-17)+'" text-anchor="middle" font-size="11" fill="var(--fg-muted)">'+esc(words.slice(1).join(' '))+'</text>';
    if(prevX!==null)out+='<line x1="'+prevX.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+prevY.toFixed(1)+'" y2="'+prevY.toFixed(1)+'" stroke="var(--border-strong)" stroke-dasharray="3 3"/>';
    prevX=x+bw;prevY=y(b.to);
  });
  return '<svg viewBox="0 0 '+W+' '+h+'" role="img" aria-label="Cashflow bridge from opening to closing balance" style="height:'+h+'px" preserveAspectRatio="none">'+g+out+'</svg>';
}
/* 72x20 sparkline for table rows and KPI tiles */
function spark(vals,w,h,color){
  w=w||72;h=h||20;
  var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),r=(hi-lo)||1,d='';
  vals.forEach(function(v,i){var X=(w*i)/(vals.length-1),Y=h-2-((v-lo)/r)*(h-4);d+=(i?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1);});
  var last=vals[vals.length-1],first=vals[0];

   '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.25" stroke-linejoin="round"/>'+
   '<circle cx="'+lx.toFixed(1)+'" cy="'+ly.toFixed(1)+'" r="2" fill="'+c+'"/></svg>';
}

function dualLine(labels,a,b,h){

  document.body.appendChild(box);

  $$('[data-copy]',box).forEach(function(b){b.onclick=function(){
    var text=b.dataset.copy==='tsv'?[headers].concat(rows).map(function(r){return r.join('\t');}).join('\n'):csv;

/* row count per view, computed without disturbing the live state */
function viewCount(v){
  var keep={q:TX.q,from:TX.from,to:TX.to,accts:TX.accts,cats:TX.cats,kinds:TX.kinds,amtMin:TX.amtMin,amtMax:TX.amtMax};
  var s=v.s||{};
  TX.q=s.q||'';TX.from=s.from||'';TX.to=s.to||'';TX.accts=s.accts||{};TX.cats=s.cats||{};
  TX.kinds=s.kinds||{};TX.amtMin=s.amtMin||'';TX.amtMax=s.amtMax||'';
  var n=txFiltered().length;
  TX.q=keep.q;TX.from=keep.from;TX.to=keep.to;TX.accts=keep.accts;TX.cats=keep.cats;
  TX.kinds=keep.kinds;TX.amtMin=keep.amtMin;TX.amtMax=keep.amtMax;
  return n;
}
/* running balance is only meaningful in date order across the cash accounts */
function balanceMeaningful(){return TX.sort.length===1&&TX.sort[0].k==='date'&&TX.group!=='cat';}
function txFiltered(){
  var accs=setOf(TX.accts),cats=setOf(TX.cats),kinds=setOf(TX.kinds);
  var q=TX.q.trim().toLowerCase();
  var mn=TX.amtMin===''?null:+TX.amtMin*100, mx=TX.amtMax===''?null:+TX.amtMax*100;
  return TXNS.filter(function(t){
    if(TX.from&&t.date<TX.from)return false;
    if(TX.to&&t.date>TX.to)return false;
    if(accs.length&&accs.indexOf(t.acct)<0)return false;
    if(cats.length){var key=t.cat||'__none__';if(cats.indexOf(key)<0)return false;}
    if(kinds.length&&kinds.indexOf(t.kind)<0)return false;
    if(q&&t.narration.toLowerCase().indexOf(q)<0)return false;
    var a=Math.abs(t.amt);
    if(mn!==null&&a<mn)return false;
    if(mx!==null&&a>mx)return false;
    return true;
  });
}
function txSorted(rows){
  var s=TX.sort;
  var val=function(t,k){return k==='amt'?t.amt:k==='cat'?catLabel(t.cat):k==='acct'?accLabel(t.acct):t[k];};
  return rows.slice().sort(function(a,b){
    for(var i=0;i<s.length;i++){
      var va=val(a,s[i].k),vb=val(b,s[i].k);
      if(va==null&&vb==null)continue;
      if(va==null)return 1; if(vb==null)return -1;   /* nulls last, both directions */
      if(va<vb)return s[i].dir==='asc'?-1:1;
      if(va>vb)return s[i].dir==='asc'?1:-1;
    }
    return a.id<b.id?-1:1;
  });
}
function facetCounts(dim){
  var base=txFiltered.call(null),out={};
  /* counts over the set filtered by everything except this dimension */
  var saved=TX[dim];TX[dim]={};
  var rows=txFiltered();TX[dim]=saved;
  rows.forEach(function(t){
    var k=dim==='accts'?t.acct:dim==='cats'?(t.cat||'__none__'):t.kind;
    out[k]=(out[k]||0)+1;
  });
  return out;
}
function txRows(){
  var filtered=txFiltered(), sorted=txSorted(filtered);
  /* running balance walks every cash posting in date order, not just the filtered ones */
  var bal={},run=OPENING_CASH;
  TXNS.forEach(function(t){ if(LIQUID_IDS.indexOf(t.acct)>=0)run+=t.amt; bal[t.id]=run; });
  var display=[];
  if(TX.group==='none'){
    sorted.forEach(function(t){display.push({type:'row',t:t,bal:bal[t.id]});});
  }else{
    var keyf=TX.group==='month'?function(t){return monthKey(t.date);}:function(t){return t.cat||'__none__';};
    var labf=TX.group==='month'?monthLabel:catLabel;
    var groups={},order=[];
    sorted.forEach(function(t){var k=keyf(t);if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(t);});
    order.forEach(function(k){
      var g=groups[k],inSum=0,outSum=0;
      g.forEach(function(t){if(t.amt>0)inSum+=t.amt;else outSum+=t.amt;});
      display.push({type:'grp',key:k,label:labf(k==='__none__'?null:k),n:g.length,inSum:inSum,outSum:outSum,net:inSum+outSum});
      g.forEach(function(t){display.push({type:'row',t:t,bal:bal[t.id]});});
    });
  }
  return {filtered:filtered,display:display,total:TXNS.length};
}
function txHead(){
  var cols=TXCOLS.filter(function(c){return TX.cols.indexOf(c.k)>=0;});
  var h='<tr><th style="width:36px"><input type="checkbox" id="txAll" aria-label="Select all matching rows"></th><th style="width:28px"></th>';
  cols.forEach(function(c){
    var si=-1;TX.sort.forEach(function(s,i){if(s.k===c.k)si=i;});
    var mark='<span class="sortw">'+svg(si<0?'sort-none':(TX.sort[si].dir==='asc'?'sort-asc':'sort-desc'),12)+
      (si>=0&&TX.sort.length>1?'<span class="ord">'+(si+1)+'</span>':'')+'</span>';
    var dis=c.k==='bal'&&!balanceMeaningful();
    h+='<th class="sortable'+(c.num?' num':'')+'" data-sort="'+c.k+'" style="width:'+c.w+'px"'+
      ' aria-sort="'+(si<0?'none':TX.sort[si].dir==='asc'?'ascending':'descending')+'"'+
      (c.k==='bal'?' title="Combined cash across HDFC, ICICI, Kotak, Paytm and Cash, in date order. Shown only while the table is sorted by date."':'')+'>'+
      esc(c.label)+(c.isNew?'<span class="new">NEW</span>':'')+(dis?' <span class="micro" style="color:var(--fg-disabled)">off</span>':'')+mark+'</th>';
  });
  return h+'</tr>';
}
function txCell(c,r){
  var t=r.t;
  switch(c.k){
    case 'date': return '<td>'+esc(dmy(t.date))+'</td>';
    case 'narration': return '<td><span class="trunc" style="max-width:'+(c.w-24)+'px" title="'+esc(t.narration)+'">'+esc(t.narration)+'</span></td>';
    case 'cat': return '<td>'+(t.cat?'<span style="display:inline-flex;align-items:center;gap:6px"><i class="catdot" style="background:'+CATMAP[t.cat].c+'"></i>'+esc(catLabel(t.cat))+'</span>':'<span class="chip warn">Uncategorised</span>')+'</td>';
    case 'acct': return '<td><span class="trunc" style="max-width:'+(c.w-24)+'px" title="'+esc(ACC[t.acct].code)+'">'+esc(accLabel(t.acct))+'</span></td>';
    case 'kind': return '<td><span class="chip">'+esc(t.kind)+'</span></td>';
    case 'amt':  return '<td class="num '+signClass(t.amt)+'" style="font-weight:500">'+esc(inr(t.amt,{sign:true}))+'</td>';
    case 'bal':  return '<td class="num">'+(balanceMeaningful()?esc(inr(r.bal)):'<span class="dash" tabindex="0" title="Running balance needs the table sorted by Date alone, across the cash accounts, in date order.">—</span>')+'</td>';
    case 'ref':  return '<td class="mono">'+esc(t.ref)+'</td>';
  }
  return '<td></td>';
}
const ROWH={comfortable:36,compact:32,dense:28};
function renderTx(){

  var d=txRows(),cols=TXCOLS.filter(function(c){return TX.cols.indexOf(c.k)>=0;});
  var f=d.filtered;
  var inSum=0,outSum=0,uncat=0;
  f.forEach(function(t){if(t.amt>0)inSum+=t.amt;else outSum+=t.amt;if(!t.cat)uncat++;});
  var selIds=setOf(TX.sel), selSum=0;
  selIds.forEach(function(id){var t=TXNS.filter(function(x){return x.id===id;})[0];if(t)selSum+=t.amt;});

  setOf(TX.cats).forEach(function(c){chips.push(['cat:'+c,'Category: '+(c==='__none__'?'Uncategorised':catLabel(c))]);});
  setOf(TX.kinds).forEach(function(k){chips.push(['kind:'+k,'Kind: '+k]);});

  if(TX.amtMax!=='')chips.push(['amax','Amount ≤ ₹'+NF0.format(+TX.amtMax)]);
  if(TX.sort.length>1)chips.push(['sort','Sorted by: '+TX.sort.map(function(s){return TXCOLS.filter(function(c){return c.k===s.k;})[0].label+' '+(s.dir==='asc'?'↑':'↓');}).join(', ')]);

      '<span style="display:inline-flex;align-items:center;gap:6px">'+svg('search',14)+'<input type="text" id="txQ" placeholder="Search narration…" value="'+esc(TX.q)+'" style="width:196px" aria-label="Search narration"></span>'+

      '<button class="btn" id="txCat" aria-pressed="'+(setOf(TX.cats).length>0)+'">'+svg('list',14)+'Category'+(setOf(TX.cats).length?' · '+setOf(TX.cats).length:'')+svg('chev-d',12)+'</button>'+

      '<button class="btn btn-sm" id="txBulkCsv">'+svg('download',13)+'Export selection</button>'+
      '<button class="btn btn-sm" id="txBulkClear">Clear</button></div>':'')+
    '<div class="tablewrap scroller collapsible" id="txScroll" style="max-height:520px">'+
      '<table class="dt" role="grid" aria-rowcount="'+d.display.length+'"><thead>'+txHead()+'</thead><tbody id="txBody"></tbody>'+
      (f.length?'<tfoot><tr><td colspan="2"></td>'+cols.map(function(c){

        return '<td></td>';}).join('')+'</tr></tfoot>':'')+
      '</table>'+

    '<div class="cards" id="txCards"></div>'+
    '<div class="counter"><span id="txCounter">Showing '+f.length+' of '+d.total+' rows</span>'+

  '</div>'+
  '<details class="panel" id="quickAdd" style="margin-top:12px"><summary class="panel-h" style="cursor:pointer;list-style:none">'+svg('plus',14)+'<h2>Quick add</h2><span class="chip acc">Ctrl K</span></summary>'+
    '<div class="panel-b" style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end">'+
      field('Kind','<select id="quickAddKind">'+KINDS.map(function(k){return '<option>'+k+'</option>';}).join('')+'</select>')+
      field('Narration','<input type="text" id="quickAddNarration" placeholder="BigBasket groceries" style="width:240px">')+
      field('Category','<select id="quickAddCat"><option value="">Uncategorised</option>'+CATS.map(function(c){return '<option value="'+c.code+'">'+esc(c.label)+'</option>';}).join('')+'</select>')+
      field('Account','<select id="quickAddAcct">'+ACCOUNTS.filter(function(a){return a.status==='Open';}).map(function(a){return '<option value="'+a.id+'">'+esc(accLabel(a.id))+'</option>';}).join('')+'</select>')+
      field('Amount (₹)','<input type="number" id="quickAddAmt" placeholder="2450.00" step="0.01" style="width:120px">')+

      '<p class="lbl" style="flex-basis:100%;margin:4px 0 0">Posts two legs. A Transfer moves money between two accounts you own and is never recorded as an expense.</p>'+
    '</div></details>';

  wireTx();
  drawTxWindow();
  renderTxCards(d);
}
function field(label,ctrl){return '<label class="fld"><span class="lbl">'+esc(label)+'</span>'+ctrl+'</label>';}
function kpi(label,caption,value,tone,sparkVals,delta){
  return '<div class="kpi"><div class="lbl">'+esc(label)+(caption?' · <span style="font-weight:400">'+esc(caption)+'</span>':'')+'</div>'+
   '<div class="v '+(tone||'')+'">'+value+'</div>'+
   (delta?'<div class="d"><span class="p">'+esc(delta)+'</span></div>':'')+
   (sparkVals?'<div class="spark">'+spark(sparkVals,320,30)+'</div>':'<div class="pad"></div>')+'</div>';
}


/* --- virtualised window --- */
var txCache=null;
function drawTxWindow(){
  var sc=$('#txScroll'),body=$('#txBody');if(!sc||!body)return;
  txCache=txCache||txRows();
  var disp=txCache.display, rh=ROWH[density], colspan=TX.cols.length+2;
  if(!disp.length){
    body.innerHTML='<tr><td colspan="'+colspan+'"><div class="empty">'+
      (TXNS.length?'<b>No transaction matches these filters.</b><p>'+esc(describeFilters())+'</p><div class="ea"><button class="btn" data-chip="all">'+svg('x',13)+'Clear all filters</button></div>':
                   '<b>No transactions yet.</b><p>Post one by hand, or bring in a bank statement and review it before anything reaches the journal.</p><div class="ea"><button class="btn btn-primary">'+svg('plus',13)+'Add a transaction</button><button class="btn">'+svg('upload',13)+'Import a statement</button></div>')+
      '</div></td></tr>';
    return;
  }
  var vh=sc.clientHeight||520, first=Math.max(0,Math.floor(sc.scrollTop/rh)-6);
  var count=Math.ceil(vh/rh)+12, last=Math.min(disp.length,first+count);
  var html='';
  if(first>0)html+='<tr aria-hidden="true"><td colspan="'+colspan+'" style="height:'+(first*rh)+'px;padding:0;border:0"></td></tr>';
  var cols=TXCOLS.filter(function(c){return TX.cols.indexOf(c.k)>=0;});
  for(var i=first;i<last;i++){
    var r=disp[i];
    if(r.type==='grp'){
      html+='<tr class="grp" aria-rowindex="'+(i+1)+'"><td colspan="2"></td>'+cols.map(function(c){
        if(c.k==='narration')return '<td><span style="display:inline-flex;align-items:center;gap:6px">'+svg('chev-d',12)+esc(r.label)+' — '+r.n+' transactions</span></td>';
        if(c.k==='amt')return '<td class="num '+signClass(r.net)+'">'+esc(inr(r.net,{sign:true}))+'</td>';
        if(c.k==='date')return '<td>'+(TX.group==='month'?'subtotal':'')+'</td>';
        return '<td></td>';}).join('')+'</tr>';
      continue;
    }
    var t=r.t,selected=!!TX.sel[t.id];
    html+='<tr data-id="'+t.id+'" aria-rowindex="'+(i+1)+'" class="'+(selected?'sel':'')+'" tabindex="-1">'+
      '<td><input type="checkbox" data-pick="'+t.id+'" '+(selected?'checked':'')+' aria-label="Select '+esc(t.narration)+'"></td>'+
      '<td><button class="btn btn-xs btn-ghost only" data-exp="'+t.id+'" aria-expanded="'+(TX.expanded===t.id)+'" aria-label="Show the postings behind this transaction">'+svg(TX.expanded===t.id?'chev-d':'chev-r',13)+'</button></td>'+
      cols.map(function(c){return txCell(c,r);}).join('')+'</tr>';
    if(TX.expanded===t.id){
      var ps=postingsOf(t);
      html+='<tr class="expand"><td colspan="'+colspan+'">'+
        '<div style="display:flex;gap:28px;flex-wrap:wrap">'+
        '<div><div class="lbl" style="margin-bottom:6px">The two postings behind this transaction<span class="new">NEW</span></div>'+
        '<table class="dt" style="min-width:420px"><thead><tr><th>Posting account</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead><tbody>'+
        ps.map(function(p){return '<tr><td>'+esc(p.acc)+'</td><td class="num">'+(p.dr?esc(inr(p.dr)):'')+'</td><td class="num">'+(p.cr?esc(inr(p.cr)):'')+'</td></tr>';}).join('')+
        '<tr style="font-weight:600"><td>Balanced</td><td class="num">'+esc(inr(Math.abs(t.amt)))+'</td><td class="num">'+esc(inr(Math.abs(t.amt)))+'</td></tr>'+
        '</tbody></table></div>'+
        '<dl class="dl" style="align-content:start"><dt>Transaction</dt><dd class="mono">'+esc(t.id)+'</dd>'+
        '<dt>Bank reference</dt><dd class="mono">'+esc(t.ref)+'</dd>'+
        '<dt>Kind</dt><dd>'+esc(t.kind)+'</dd>'+
        '<dt>Other side</dt><dd>'+esc(ps[t.amt>=0?1:0].acc)+'</dd>'+
        '<dt>Financial year</dt><dd>FY '+esc(fyOf(t.date))+'</dd></dl>'+
        '<div style="display:flex;flex-direction:column;gap:6px;align-self:start">'+
         '<button class="btn btn-sm">'+svg('edit',13)+'Categorise</button><button class="btn btn-sm">'+svg('refresh',13)+'Post a Reversal</button><button class="btn btn-sm">'+svg('bank',13)+'Open the account</button></div>'+
        '</div></td></tr>';
    }
  }
  if(last<disp.length)html+='<tr aria-hidden="true"><td colspan="'+colspan+'" style="height:'+((disp.length-last)*rh)+'px;padding:0;border:0"></td></tr>';
  body.innerHTML=html;
}
function describeFilters(){
  var p=[];
  if(TX.q)p.push('narration contains “'+TX.q+'”');
  if(TX.from||TX.to)p.push('dated '+(TX.from?dmy(TX.from):'any')+' to '+(TX.to?dmy(TX.to):'any'));
  if(setOf(TX.accts).length)p.push('account is '+setOf(TX.accts).map(accLabel).join(' or '));
  if(setOf(TX.cats).length)p.push('category is '+setOf(TX.cats).map(function(c){return c==='__none__'?'Uncategorised':catLabel(c);}).join(' or '));
  if(setOf(TX.kinds).length)p.push('kind is '+setOf(TX.kinds).join(' or '));
  if(TX.amtMin!=='')p.push('amount at least ₹'+NF0.format(+TX.amtMin));
  if(TX.amtMax!=='')p.push('amount at most ₹'+NF0.format(+TX.amtMax));
  return 'Active filters: '+(p.join('; ')||'none')+'.';
}
function renderTxCards(d){
  var el=$('#txCards');if(!el)return;
  var rows=d.display.filter(function(r){return r.type==='row';}).slice(0,60);
  el.innerHTML=rows.map(function(r){var t=r.t;

}

const BUDGETED={
 'Expenses:Housing:Rent':3800000,'Expenses:Housing:Maintenance':500000,
 'Expenses:Food:Groceries':320000,'Expenses:Food:EatingOut':250000,
 'Expenses:Transport':420000,'Expenses:Utilities':220000,
 'Expenses:Health':120000,'Expenses:Insurance':250000,
 'Expenses:Investing:Charges':50000,'Expenses:Shopping':300000,'Expenses:Entertainment':120000
};
const CATICON={'Expenses:Housing:Rent':'property','Expenses:Housing:Maintenance':'gear',
 'Expenses:Food:Groceries':'cash','Expenses:Food:EatingOut':'wallet',
 'Expenses:Transport':'trend','Expenses:Utilities':'signal','Expenses:Health':'info',
 'Expenses:Insurance':'bond','Expenses:Investing:Charges':'equity',
 'Expenses:Shopping':'card','Expenses:Entertainment':'etf'};
const BMONTHS=['2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11'];
var BM=6; /* October 2026 */
function envelopes(mk){
  var days=new Date(+mk.slice(0,4),+mk.slice(5,7),0).getDate();
  var pace=mk==='2026-10'?19/days:(mk>'2026-10'?0:1);
  return Object.keys(BUDGETED).map(function(code){
    var spent=0;
    TXNS.forEach(function(t){if(t.cat===code&&monthKey(t.date)===mk)spent+=Math.abs(t.amt);});
    var carriedIn=Math.round(((code.length*7919)%9)*1000)-3000;
    var budgeted=BUDGETED[code];
    return {code:code,label:catLabel(code),budgeted:budgeted,spent:spent,carriedIn:carriedIn,
      left:budgeted+carriedIn-spent,pace:pace,icon:CATICON[code],color:CATMAP[code].c};
  });
}
RENDER.budgets=function(){
  var el=screenEl('budgets'),mk=BMONTHS[BM],env=envelopes(mk);
  var totalB=env.reduce(function(s,e){return s+e.budgeted;},0);
  var totalS=env.reduce(function(s,e){return s+e.spent;},0);
  var income=mk==='2026-10'?19191200:19800000;
  var toBudget=income-totalB;
  var over=env.filter(function(e){return e.left<0;});
  var variance=env.slice().sort(function(a,b){return a.left-b.left;});
  var maxScale=Math.max.apply(null,env.map(function(e){return Math.max(e.budgeted+e.carriedIn,e.spent);}));
  function bullet(e){
    var scale=function(v){return Math.max(0,Math.min(100,v/maxScale*100));};
    return '<div class="bullet" title="'+esc(e.label+': spent '+inr(e.spent)+' of '+inr(e.budgeted+e.carriedIn))+'">'+
      '<i class="act'+(e.left<0?' over':'')+'" style="width:'+scale(e.spent).toFixed(1)+'%"></i>'+
      '<i class="tick" style="left:'+scale(e.budgeted+e.carriedIn).toFixed(1)+'%" title="Budget"></i>'+
      '<i class="pace" style="left:'+scale((e.budgeted+e.carriedIn)*e.pace).toFixed(1)+'%" title="Pace to date"></i></div>';

  el.innerHTML=

   kpi('Budgeted',monthLabel(mk),compact(totalB),'',null,'Across '+env.length+' envelopes')+

  '</div>'+

   '<div class="cards">'+env.map(function(e){return '<div class="mcard"><b>'+esc(e.label)+'</b><span class="r '+(e.left<0?'loss':'')+'" style="font-weight:600">'+esc(inr(e.left,{sign:e.left<0}))+' left</span>'+

function buildStmt(){
  var names=['UPI-BIGBASKET-RETAIL','UPI-SWIGGY INSTAMART','NEFT-SALARY OCT 2026','UPI-UBER INDIA','BESCOM BILL PAY','IMPS-AMAZON SELLER','UPI-TOIT BREWPUB','ACH-TERM INSURANCE','UPI-APOLLO PHARMACY','POS-HP PETRO','UPI-NETFLIX','UPI-BLINKIT','ATM-CASH WDL MG ROAD','UPI-ZOMATO','NEFT-RENT TRANSFER','UPI-JIO RECHARGE'];
  var out=[];
  for(var i=0;i<48;i++){
    var n=names[i%names.length];
    var amt=((i*73717)%48000+20000)*(n.indexOf('SALARY')>=0?-1:1);
    var isIn=n.indexOf('SALARY')>=0;
    var day=String((i%28)+1).padStart(2,'0');
    var cat=i%7===3?null:RAWCAT[i%RAWCAT.length];
    var state=i<12?'posted':i===14||i===29?'dup':i%7===3?'needs':i<26?'ready':'ready';
    out.push({i:i,id:'R'+String(i+1).padStart(3,'0'),date:'2026-10-'+day,
      raw:n+' REF'+(820000+i*37),amt:isIn?Math.abs(amt)*9:-Math.abs(amt),cat:cat,state:state,
      ref:'REF'+(820000+i*37),closing:54218000+i*1200});

}

      '<dt>Amount</dt><dd class="'+signClass(m.amt)+'">'+esc(inr(m.amt,{sign:true}))+'</dd><dt>Account</dt><dd>'+esc(accLabel(m.acct))+'</dd></dl></div>'+
   '</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary" id="dupKeep">'+svg('check',13)+'Post it anyway</button>'+
    '<button class="btn btn-danger-quiet" id="dupSkip">'+svg('x',13)+'Skip — keep as evidence</button></div>'+
   '<p class="lbl" style="margin:8px 0 0">A skipped row stays in the batch. It is never deleted, so the statement and the journal still agree.</p></div></div>';
}
function drawStmt(){
  var body=$('#rBody');if(!body)return;
  var sc=$('#rScroll'),rh=ROWH[density];
  var first=Math.max(0,Math.floor(sc.scrollTop/rh)-5),count=Math.ceil((sc.clientHeight||460)/rh)+10;
  var last=Math.min(STMT.length,first+count),html='';
  if(first>0)html+='<tr aria-hidden="true"><td colspan="6" style="height:'+(first*rh)+'px;padding:0;border:0"></td></tr>';
  var tones={ready:['gain','Ready'],needs:['warn','Needs choice'],dup:['loss','Looks familiar'],
             confirmed:['acc','Confirmed'],posted:['info','Posted'],skipped:['','Skipped']};
  for(var i=first;i<last;i++){
    var r=STMT[i],t=tones[r.state];
    html+='<tr data-row="'+i+'" aria-rowindex="'+(i+1)+'" class="'+(RSEL[i]?'sel ':'')+(i===FOCUS?'kb':'')+'"'+
      (i===FOCUS?' class="kb"':'')+'>'+
      '<td><input type="checkbox" data-pick="'+i+'" '+(RSEL[i]?'checked':'')+' aria-label="Select row '+r.id+'"></td>'+
      '<td>'+esc(dmy(r.date))+'</td>'+
      '<td><span class="mono trunc" style="max-width:260px" title="'+esc(r.raw)+'">'+esc(r.raw)+'</span></td>'+
      '<td>'+(r.state==='posted'?esc(catLabel(r.cat)):
        '<select data-cat="'+i+'" style="width:140px;font-size:12px;padding:1px 4px"><option value="">Uncategorised</option>'+
        CATS.map(function(c){return '<option value="'+c.code+'"'+(r.cat===c.code?' selected':'')+'>'+esc(c.label)+'</option>';}).join('')+'</select>')+'</td>'+
      '<td class="num '+signClass(r.amt)+'">'+esc(inr(r.amt,{sign:true}))+'</td>'+
      '<td><span class="chip '+t[0]+'">'+t[1]+'</span>'+(r.state==='dup'?' <button class="btn btn-xs" data-dup="'+i+'">'+svg('expand',12)+'compare</button>':'')+'</td></tr>';
  }
  if(last<STMT.length)html+='<tr aria-hidden="true"><td colspan="6" style="height:'+((STMT.length-last)*rh)+'px;padding:0;border:0"></td></tr>';
  body.innerHTML=html;
}
function drawDoc(){
  var pane=$('#docPane');if(!pane)return;
  var lines=['Date,Narration,Chq/Ref No.,Value Dt,Withdrawal Amt.,Deposit Amt.,Closing Balance'];
  var start=Math.max(0,FOCUS-6),end=Math.min(STMT.length,FOCUS+7);
  var html=esc(lines[0])+'\n';
  for(var i=start;i<end;i++){
    var r=STMT[i];
    var d=r.date.slice(8)+'/'+r.date.slice(5,7)+'/'+r.date.slice(2,4);
    var w=r.amt<0?(Math.abs(r.amt)/100).toFixed(2):'';
    var dep=r.amt>0?(r.amt/100).toFixed(2):'';
    var line=d+','+r.raw.replace(/ REF\d+/,'')+','+r.ref+','+d+','+w+','+dep+','+(r.closing/100).toFixed(2);
    html+=(i===FOCUS?'<mark>'+esc(line)+'</mark>':esc(line))+'\n';
  }
  pane.innerHTML=html;
}
function scrollFocus(){
  var sc=$('#rScroll');if(!sc)return;
  var rh=ROWH[density],y=FOCUS*rh;
  if(y<sc.scrollTop)sc.scrollTop=y;
  else if(y+rh>sc.scrollTop+sc.clientHeight-rh)sc.scrollTop=y-sc.clientHeight+rh*2;
}
function confirmReady(){
  var n=0;STMT.forEach(function(r){if(r.state==='ready'){r.state='confirmed';n++;}});
  RENDER.batch();say(n+' rows confirmed. They post together when you post the batch.');
}
document.addEventListener('keydown',function(e){
  if(current!=='batch')return;
  if(!$('#cmdk').hidden)return;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName))return;
  var k=e.key;
  if(k==='j'||k==='ArrowDown'){e.preventDefault();FOCUS=Math.min(STMT.length-1,FOCUS+1);drawStmt();drawDoc();scrollFocus();}
  else if(k==='k'||k==='ArrowUp'){e.preventDefault();FOCUS=Math.max(0,FOCUS-1);drawStmt();drawDoc();scrollFocus();}
  else if(k==='Enter'){e.preventDefault();if(STMT[FOCUS].state!=='posted'){STMT[FOCUS].state='confirmed';FOCUS=Math.min(STMT.length-1,FOCUS+1);RENDER.batch();scrollFocus();}}
  else if(k==='s'){e.preventDefault();STMT[FOCUS].state='skipped';FOCUS=Math.min(STMT.length-1,FOCUS+1);RENDER.batch();scrollFocus();}
  else if(k==='c'){e.preventDefault();var s=document.querySelector('[data-cat="'+FOCUS+'"]');if(s)s.focus();}
  else if(k==='d'){e.preventDefault();if(DUPMATCH[FOCUS]){SHOWDUP=FOCUS;RENDER.batch();}else say('This row has no duplicate match.');}
  else if(k===' '){e.preventDefault();if(RSEL[FOCUS])delete RSEL[FOCUS];else RSEL[FOCUS]=true;RENDER.batch();}
  else if(k==='A'){e.preventDefault();confirmReady();}
});

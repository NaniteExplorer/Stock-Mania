<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stock-Mania Elevation Pass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout concept: one set of markup, two skins. Everything that differs between the shipped
   surface and the elevated one is a custom property on .stage, so Before/After is a single
   attribute flip and the owner can see exactly which decisions changed. Tokens below are the
   corrected v2 set, carried over unmodified — no colour is invented on this page. */

:root{
  --n-0:#FFFFFF; --n-50:#F6F8FA; --n-100:#EFF2F5; --n-150:#E4E8ED; --n-200:#D6DCE3;
  --n-300:#B9C2CC; --n-400:#8C98A6; --n-450:#808C9A; --n-500:#64707E; --n-600:#49545F;
  --n-700:#343C45; --n-775:#2A323A; --n-800:#232A31; --n-850:#1A2026; --n-900:#13181D; --n-950:#0C1014;

  --h-sm:28px; --h-md:32px; --h-lg:36px;
  --r-1:2px; --r-2:3px; --r-3:4px; --r-4:6px; --r-5:8px; --r-pill:999px;
  --t-fast:90ms; --t:110ms; --ease:cubic-bezier(.2,0,.38,1);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));

  --bg-canvas:#F6F8FA; --bg-surface:#FFFFFF; --bg-sunken:#F2F5F8; --bg-subtle:#F2F5F8;
  --bg-hover:#F6F8FA; --bg-active:#EFF2F5;
  --border-subtle:#E4E8ED; --border:#D6DCE3; --border-control:#808C9A;
  --border-hover:#64707E; --border-active:#49545F;
  --fg:#13181D; --fg-secondary:#49545F; --fg-muted:#64707E; --fg-disabled:#7C8896;
  --accent:#4F62D8; --accent-hover:#3F50BE; --accent-on:#FFFFFF;
  --accent-soft:#EEF2FF; --accent-line:#A5B4FC;
  --gain:#0E7C66; --gain-bg:#E6F5F1; --gain-line:#8FD3C4;
  --loss:#C0392B; --loss-bg:#FBEAE7; --loss-line:#EAA69E;
  --warn:#B45309; --warn-bg:#FDF4E6; --warn-line:#E8C58A;
  --inner-hl:inset 0 -1px 0 rgb(19 24 29 / .07);
  --c1:#5468D6; --c2:#1F94A8; --c3:#B5801F; --c4:#A14C9E; --c5:#4E7A3A; --c-other:#8C98A6;
  --grid:#E4E8ED;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg-canvas:#0C1014; --bg-surface:#13181D; --bg-sunken:#0C1014; --bg-subtle:#1A2026;
  --bg-hover:#232A31; --bg-active:#2A323A;
  --border-subtle:#232A31; --border:#343C45; --border-control:#64707E;
  --border-hover:#8C98A6; --border-active:#B9C2CC;
  --fg:#F6F8FA; --fg-secondary:#B9C2CC; --fg-muted:#8C98A6; --fg-disabled:#5C6875;
  --accent:#7D8CEA; --accent-hover:#9AA6F0; --accent-on:#0C1014;
  --accent-soft:#1B2340; --accent-line:#4F62D8;
  --gain:#3FC9A6; --gain-bg:#0E2F29; --gain-line:#1F6B5B;
  --loss:#FF7A6B; --loss-bg:#3A1A16; --loss-line:#8A3C33;
  --warn:#F0B429; --warn-bg:#2E2411; --warn-line:#7A5E1B;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --c1:#8A7FE8; --c2:#2FA3BA; --c3:#B68530; --c4:#C76BA0; --c5:#6FA14E; --c-other:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-canvas:#0C1014; --bg-surface:#13181D; --bg-sunken:#0C1014; --bg-subtle:#1A2026;
  --bg-hover:#232A31; --bg-active:#2A323A;
  --border-subtle:#232A31; --border:#343C45; --border-control:#64707E;
  --border-hover:#8C98A6; --border-active:#B9C2CC;
  --fg:#F6F8FA; --fg-secondary:#B9C2CC; --fg-muted:#8C98A6; --fg-disabled:#5C6875;
  --accent:#7D8CEA; --accent-hover:#9AA6F0; --accent-on:#0C1014;
  --accent-soft:#1B2340; --accent-line:#4F62D8;
  --gain:#3FC9A6; --gain-bg:#0E2F29; --gain-line:#1F6B5B;
  --loss:#FF7A6B; --loss-bg:#3A1A16; --loss-line:#8A3C33;
  --warn:#F0B429; --warn-bg:#2E2411; --warn-line:#7A5E1B;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --c1:#8A7FE8; --c2:#2FA3BA; --c3:#B68530; --c4:#C76BA0; --c5:#6FA14E; --c-other:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--fg);font-family:var(--sans);
  font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums slashed-zero}

/* ============ chrome ============ */
.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg-surface);
  border-bottom:1px solid var(--border);padding-block:10px;padding-left:var(--gl);padding-right:var(--gr)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-surface)}
.chrome-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px;max-width:1360px;margin:0 auto}
.brand{display:flex;align-items:center;gap:9px;margin-right:4px}
.mark{width:22px;height:22px;border:1.5px solid var(--accent);border-radius:var(--r-2);flex:none;position:relative}
.mark::after{content:"";position:absolute;left:2.5px;right:2.5px;bottom:2.5px;height:6px;
  background:linear-gradient(to right,var(--accent) 0 2px,transparent 2px 4px,var(--accent) 4px 7px,transparent 7px 9px,var(--accent) 9px 13px)}
.brand b{font-size:13.5px;font-weight:600;letter-spacing:-.008em}
.seg{display:inline-flex;height:var(--h-md);border:1px solid var(--border-control);border-radius:var(--r-2);
  overflow:hidden;background:var(--bg-surface);box-shadow:var(--inner-hl)}
.seg button{height:30px;padding:0 11px;border:0;background:none;font-size:12px;font-weight:500;
  color:var(--fg-secondary);cursor:pointer;white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.seg button+button{box-shadow:inset 1px 0 0 var(--border)}
.seg button:hover{background:var(--bg-hover);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"]+button{box-shadow:none}
.seg button:focus-visible{outline-offset:-2px}
.ab{border-color:var(--border-control)}
.ab button{padding:0 14px;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em}
.spacer{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;height:var(--h-md);padding:0 12px;font-size:12.5px;
  font-weight:500;border:1px solid var(--border-control);border-radius:var(--r-2);background:var(--bg-surface);
  color:var(--fg);box-shadow:var(--inner-hl);cursor:pointer;white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.modenote{width:100%;font-size:11.5px;line-height:16px;color:var(--fg-muted);max-width:92ch}
.modenote b{color:var(--fg);font-weight:600}

/* ============ the two skins ============ */
.stage{padding-block:0 72px;padding-left:var(--gl);padding-right:var(--gr);max-width:1360px;margin:0 auto}
.screen{display:none;flex-direction:column;gap:var(--gap-screen);padding-top:var(--gap-screen)}
.screen.on{display:flex}

.stage[data-mode="before"]{
  --fig-face:var(--sans); --fig-vn:tabular-nums;
  --fs-hero:30px; --lh-hero:36px; --fw-hero:600; --ls-hero:-.016em;
  --fs-kpi:24px; --lh-kpi:30px; --fw-kpi:600;
  --fs-h1:22px; --lh-h1:28px; --ls-h1:-.012em;
  --fs-sec:14px;
  --fs-lab:12px; --ls-lab:0; --tt-lab:none; --fw-lab:500; --col-lab:var(--fg-muted);
  --gap-screen:18px; --gap-block:12px; --gap-kpi:10px;
  --pad-panel:14px; --pad-panel-h:11px 14px;
  --kpi-pad:12px 14px; --kpi-bd:1px solid var(--border); --kpi-r:var(--r-4);
  --kpi-bg:var(--bg-surface); --kpi-rule:none;
  --hero-bd:1px solid var(--border); --hero-bg:var(--bg-surface); --hero-pad:14px; --hero-r:var(--r-4);
  --hero-tick:none;
  --kpi-cols:repeat(6,minmax(0,1fr));
  --num-face:var(--sans); --num-size:13px;
  --row-h:32px; --cell-pad:6px 12px;
}
.stage[data-mode="after"]{
  --fig-face:var(--mono); --fig-vn:tabular-nums slashed-zero;
  --fs-hero:clamp(40px,7.2vw,56px); --lh-hero:1.02; --fw-hero:500; --ls-hero:-.022em;
  --fs-kpi:22px; --lh-kpi:28px; --fw-kpi:500;
  --fs-h1:20px; --lh-h1:26px; --ls-h1:-.014em;
  --fs-sec:13px;
  --fs-lab:11px; --ls-lab:.085em; --tt-lab:uppercase; --fw-lab:500; --col-lab:var(--fg-muted);
  --gap-screen:40px; --gap-block:16px; --gap-kpi:0px;
  --pad-panel:20px 24px; --pad-panel-h:14px 24px;
  --kpi-pad:14px 20px 2px 0; --kpi-bd:0; --kpi-r:0;
  --kpi-bg:transparent; --kpi-rule:1px solid var(--border-control);
  --hero-bd:0; --hero-bg:transparent; --hero-pad:8px 0 0; --hero-r:0;
  --hero-tick:block;
  --kpi-cols:repeat(auto-fit,minmax(154px,1fr));
  --num-face:var(--mono); --num-size:12.5px;
  --row-h:34px; --cell-pad:7px 12px;
}

/* ============ shared components ============ */
.lbl{font-size:var(--fs-lab);line-height:16px;font-weight:var(--fw-lab);letter-spacing:var(--ls-lab);
  text-transform:var(--tt-lab);color:var(--col-lab)}
.h1{font-size:var(--fs-h1);line-height:var(--lh-h1);font-weight:600;letter-spacing:var(--ls-h1)}
.sub{font-size:12px;line-height:17px;color:var(--fg-muted)}
.sechead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px}
.sechead .rule{flex:1;min-width:24px;height:1px;background:var(--border-subtle)}
.stage[data-mode="before"] .sechead .rule{display:none}

.fig{font-family:var(--fig-face);font-variant-numeric:var(--fig-vn)}
.cur,.unit{color:var(--fg-muted);font-weight:400}
.hero-fig .cur{font-size:.46em;margin-right:.1em;letter-spacing:0}
.hero-fig .unit{font-size:.40em;letter-spacing:.06em;margin-left:.12em}
.stage[data-mode="before"] .hero-fig .cur,.stage[data-mode="before"] .hero-fig .unit{
  font-size:1em;color:inherit;letter-spacing:inherit;margin:0;font-weight:inherit}

.panel{border:1px solid var(--border);border-radius:var(--r-4);background:var(--bg-surface);overflow:hidden}
.panel-h{display:flex;align-items:flex-start;flex-wrap:wrap;gap:12px;padding:var(--pad-panel-h);
  border-bottom:1px solid var(--border-subtle)}
.panel-h h2{font-size:var(--fs-sec);line-height:20px;font-weight:600}
.panel-h p{font-size:11.5px;line-height:16px;color:var(--fg-muted);max-width:74ch}
.panel-b{padding:var(--pad-panel)}
.panel-h .spacer{margin-left:auto}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--gap-block) 40px;
  border:var(--hero-bd);background:var(--hero-bg);border-radius:var(--hero-r);padding:var(--hero-pad)}
.mast-main{display:flex;flex-direction:column;gap:6px;min-width:0}
.mast .tick{display:var(--hero-tick);width:34px;height:2px;background:var(--accent);margin-bottom:4px}
.hero-fig{font-family:var(--fig-face);font-variant-numeric:var(--fig-vn);
  font-size:var(--fs-hero);line-height:var(--lh-hero);font-weight:var(--fw-hero);letter-spacing:var(--ls-hero)}
.mast-side{display:flex;flex-wrap:wrap;gap:var(--gap-block) 32px;align-items:flex-end}
.side-i{display:flex;flex-direction:column;gap:3px;min-width:0}
.side-i .v{font-family:var(--fig-face);font-variant-numeric:var(--fig-vn);font-size:16px;
  line-height:22px;font-weight:var(--fw-kpi)}
.stage[data-mode="before"] .side-i .v{font-size:15px;font-weight:600}

/* kpi strip */
.kpis{display:grid;grid-template-columns:var(--kpi-cols);gap:var(--gap-kpi)}
.kpi{display:flex;flex-direction:column;gap:5px;padding:var(--kpi-pad);border:var(--kpi-bd);
  border-radius:var(--kpi-r);background:var(--kpi-bg);border-top:var(--kpi-rule);min-width:0}
.stage[data-mode="before"] .kpi{border:1px solid var(--border)}
.kpi .kv{font-family:var(--fig-face);font-variant-numeric:var(--fig-vn);font-size:var(--fs-kpi);
  line-height:var(--lh-kpi);font-weight:var(--fw-kpi);letter-spacing:-.012em}
.kpi .kd{font-size:11px;line-height:15px;font-variant-numeric:tabular-nums;color:var(--fg-secondary)}
.kpi .kv .cur{font-size:.6em}
.kpi .kv .unit{font-size:.56em;letter-spacing:.04em;margin-left:.1em}
.stage[data-mode="before"] .kpi .kv .cur,.stage[data-mode="before"] .kpi .kv .unit{font-size:1em;color:inherit;font-weight:inherit}

.gain{color:var(--gain)}.loss{color:var(--loss)}
.muted{color:var(--fg-muted)}
.dir{font-size:.8em;margin-right:.18em;color:var(--fg-muted)}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-2);
  font-size:11px;font-weight:500;line-height:1;white-space:nowrap;border:1px solid transparent;
  background:var(--bg-subtle);color:var(--fg-secondary)}
.bdg .dot{width:5px;height:5px;border-radius:var(--r-pill);background:currentColor;flex:none;opacity:.85}
.bdg.warn{background:var(--warn-bg);color:var(--warn)}
.bdg.okl{background:none;border-color:var(--gain-line);color:var(--gain)}
.bdg.outn{background:none;border-color:var(--border);color:var(--fg-secondary)}
/* in After, the Priced badge is dropped from every row — priced is the norm, not news */
.stage[data-mode="after"] .bdg.okl{display:none}
/* After: the sign glyph carries direction in the register, so the amounts give up their colour */
.stage[data-mode="after"] .amt{color:var(--fg)}

/* table */
.tscroll{overflow-x:auto}
table.dt{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.dt th,table.dt td{padding:var(--cell-pad);border-bottom:1px solid var(--border-subtle);
  white-space:nowrap;height:var(--row-h);text-align:left;vertical-align:middle}
table.dt thead th{position:sticky;top:0;z-index:2;background:var(--bg-surface);font-weight:500;
  color:var(--fg-muted);box-shadow:inset 0 -1px 0 var(--border);border-bottom:0;
  font-size:var(--fs-lab);letter-spacing:var(--ls-lab);text-transform:var(--tt-lab)}
.stage[data-mode="after"] table.dt thead th{font-size:10.5px;letter-spacing:.085em;padding-block:9px}
table.dt .num{text-align:right;font-family:var(--num-face);font-size:var(--num-size);
  font-variant-numeric:tabular-nums slashed-zero}
table.dt tbody tr:hover{background:var(--bg-hover)}
table.dt tfoot td{background:var(--bg-subtle);font-weight:600;border-bottom:0;border-top:1px solid var(--border)}
.stage[data-mode="after"] table.dt tfoot td{background:transparent;border-top:1px solid var(--border-control);
  padding-top:11px;padding-bottom:11px}
.nm{display:flex;flex-direction:column;max-width:240px;min-width:0}
.nm b{font-weight:600;font-size:13px;line-height:17px}
.nm span{font-size:11.5px;line-height:15px;color:var(--fg-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage[data-mode="after"] .nm b{font-size:13px;font-weight:500;letter-spacing:.002em}
.stage[data-mode="after"] .nm .sym{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;
  color:var(--fg-muted);text-transform:none}
.sym{display:none}
.stage[data-mode="after"] .sym{display:block}
.stage[data-mode="after"] .nm > span:not(.sym){display:none}

/* the unavailable figure */
.dash{color:var(--fg-muted);text-decoration:underline dotted;text-underline-offset:3px;cursor:help;
  border-radius:var(--r-1);font-family:var(--mono)}
.dash:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.why{display:none}
.stage[data-mode="after"] .why{display:block;font-family:var(--mono);font-size:9.5px;line-height:13px;
  letter-spacing:.03em;color:var(--fg-muted);text-transform:uppercase}
.stage[data-mode="after"] .dash{text-decoration-color:var(--border-control)}

/* allocation */
.stack{display:flex;width:100%;height:26px;border-radius:var(--r-2);overflow:hidden;gap:2px;background:var(--bg-sunken)}
.stage[data-mode="after"] .stack{height:8px;border-radius:0;gap:1px;background:transparent}
.stack div{min-width:2px}
.alloc-rows{display:flex;flex-direction:column;margin-top:14px}
.ar{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 18px;align-items:baseline;
  padding:8px 0;border-bottom:1px solid var(--border-subtle)}
.ar:last-child{border-bottom:0}
.ar .n{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.ar .n i{width:9px;height:9px;border-radius:2px;flex:none}
.stage[data-mode="after"] .ar .n i{width:3px;height:14px;border-radius:0}
.ar .v{font-family:var(--num-face);font-size:var(--num-size);font-variant-numeric:tabular-nums slashed-zero}
.ar .w{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--fg-muted);min-width:56px;text-align:right}
.stage[data-mode="after"] .ar .w{color:var(--fg-secondary)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-block)}
.stage[data-mode="after"] .two{gap:32px}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:6px;color:var(--fg-secondary)}
.legend i{width:9px;height:9px;border-radius:var(--r-1);flex:none}
.stage[data-mode="after"] .legend{display:none}
svg text{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* notes screen */
.notes{max-width:76ch;display:flex;flex-direction:column;gap:22px}
.notes h2{font-size:18px;line-height:24px;letter-spacing:-.01em}
.notes h3{font-size:13.5px;line-height:19px}
.notes p,.notes li{font-size:13.5px;line-height:21px;color:var(--fg-secondary)}
.notes ol,.notes ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px}
.notes strong{color:var(--fg);font-weight:600}
.notes code{font-family:var(--mono);font-size:11.5px;background:var(--bg-subtle);padding:1px 5px;border-radius:var(--r-2)}
.notes .card{border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:var(--r-4);
  padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.notes table{border-collapse:collapse;width:100%;font-size:12.5px}
.notes table th,.notes table td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid var(--border-subtle);vertical-align:top}
.notes table th{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted);font-weight:500}
.notes table td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}

@media (max-width:1100px){.stage[data-mode="before"]{--kpi-cols:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){
  .stage[data-mode="before"]{--kpi-cols:repeat(2,minmax(0,1fr))}
  .two{grid-template-columns:1fr}
  .mast{align-items:flex-start}
}

/* ---------- en-IN formatting ---------- */
function nf(d){return new Intl.NumberFormat("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});}
function money(v,signed){
  if(v==null)return null;
  var a=Math.abs(v),dp=(a>=100000&&Math.round(a)===a)?0:2;
  var s=v<0?"−":(signed?"+":"");
  return s+'<span class="cur">₹</span>'+nf(dp).format(a);
}
function trunc2(x){return Math.trunc(x*100)/100;}
function compact(v,signed){
  if(v==null)return null;
  var s=v<0?"−":(signed?"+":""),a=Math.abs(v);
  if(a>=1e7) return s+'<span class="cur">₹</span>'+nf(2).format(trunc2(a/1e7))+'<span class="unit">Cr</span>';
  if(a>=1e5) return s+'<span class="cur">₹</span>'+nf(2).format(trunc2(a/1e5))+'<span class="unit">L</span>';
  return s+'<span class="cur">₹</span>'+nf(a>=1000?0:2).format(a);
}
function pctS(v,d){return (v<0?"−":"+")+nf(d===undefined?2:d).format(Math.abs(v))+"%";}
function pct(v,d){return nf(d===undefined?2:d).format(v)+"%";}
function sgn(v){return v>0?"gain":(v<0?"loss":"muted");}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}

/* ---------- chart ---------- */
function renderChart(){
  var box=document.getElementById("chartBox");if(!box)return;
  var base=OPENING,cc=0,cg=0,pts=[];
  for(var i=0;i<12;i++){cc+=CONTRIB[i];cg+=GROWTH[i];pts.push({m:MONTHS[i],nw:base+cc+cg,cc:cc,cg:cg});}
  var W=900,H=260,L=56,R=16,T=16,B=30,iw=W-L-R,ih=H-T-B;
  var top=55,y=function(v){return T+ih-(v/top)*ih;};
  var step=iw/12,cx=function(i){return L+step*i+step/2;};
  var g="",bars="";
  if(mode==="before"){
    for(var t2=0;t2<=top;t2+=10){
      g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t2).toFixed(1)+'" y2="'+y(t2).toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>'+
         '<text x="'+(L-8)+'" y="'+(y(t2)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--fg-muted)">₹'+t2+'L</text>';
    }
    var bw=Math.min(40,step*0.6);
    pts.forEach(function(p,i){
      var x=cx(i)-bw/2,yB=y(base),yC=y(base+p.cc),yG=y(p.nw);
      bars+='<rect x="'+x.toFixed(1)+'" y="'+yB.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,T+ih-yB).toFixed(1)+'" fill="var(--bg-sunken)" stroke="var(--border)" stroke-width="1"/>';
      bars+='<rect x="'+x.toFixed(1)+'" y="'+yC.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,yB-yC-2).toFixed(1)+'" fill="var(--c-other)" rx="2"/>';
      var gh=yC-yG;
      bars+=gh>=0?'<rect x="'+x.toFixed(1)+'" y="'+yG.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,gh-2).toFixed(1)+'" fill="var(--gain)" rx="2"/>'
                 :'<rect x="'+x.toFixed(1)+'" y="'+(yC+2).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,-gh-2).toFixed(1)+'" fill="var(--loss)" rx="2"/>';
      bars+='<text x="'+cx(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="var(--fg-muted)">'+p.m+'</text>';
    });
  }else{
    /* After: one baseline at the opening figure, the series, two labelled values, nothing else. */
    g='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(base).toFixed(1)+'" y2="'+y(base).toFixed(1)+'" stroke="var(--border-control)" stroke-width="1" stroke-dasharray="2 3"/>';
    var area=pts.map(function(p,i){return (i?"L":"M")+cx(i).toFixed(1)+" "+y(p.nw).toFixed(1);}).join(" ")+
      " L"+cx(11).toFixed(1)+" "+y(base).toFixed(1)+" L"+cx(0).toFixed(1)+" "+y(base).toFixed(1)+" Z";
    bars='<path d="'+area+'" fill="var(--accent)" fill-opacity="0.07"/>';
    bars+=pts.map(function(p,i){
      return '<text x="'+cx(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="10" letter-spacing="0.7" fill="var(--fg-muted)">'+p.m.toUpperCase()+'</text>';
    }).join("");
    bars+='<text x="'+L+'" y="'+(y(base)-9).toFixed(1)+'" font-size="11" fill="var(--fg-muted)">₹38.40L opening</text>';
  }
  var line=pts.map(function(p,i){return (i?"L":"M")+cx(i).toFixed(1)+" "+y(p.nw).toFixed(1);}).join(" ");
  var dots=mode==="before"
    ? pts.map(function(p,i){return '<circle cx="'+cx(i).toFixed(1)+'" cy="'+y(p.nw).toFixed(1)+'" r="2.6" fill="var(--bg-surface)" stroke="var(--fg)" stroke-width="1.5"/>';}).join("")
    : '<circle cx="'+cx(11).toFixed(1)+'" cy="'+y(pts[11].nw).toFixed(1)+'" r="3.4" fill="var(--accent)"/>'+
      '<text x="'+(cx(11)-8).toFixed(1)+'" y="'+(y(pts[11].nw)-12).toFixed(1)+'" text-anchor="end" font-size="14" font-weight="500" fill="var(--fg)">₹48.72L</text>';
  var last=pts[11];
  box.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="260" role="img" aria-label="Net worth rose from ₹38.40 lakh to ₹48.72 lakh over twelve months; ₹9.22 lakh came from contributions and ₹1.10 lakh from market growth.">'+
    g+bars+'<path d="'+line+'" fill="none" stroke="'+(mode==="before"?"var(--fg)":"var(--accent)")+'" stroke-width="'+(mode==="before"?2:1.75)+'" stroke-linejoin="round"/>'+dots+'</svg>'+
    (mode==="before"
     ? '<div class="legend"><span><i style="background:var(--bg-sunken);box-shadow:inset 0 0 0 1px var(--border)"></i>Carried in ₹38.40L</span>'+
       '<span><i style="background:var(--c-other)"></i>Net contributions +₹9.22L</span>'+
       '<span><i style="background:var(--gain)"></i>Market growth +₹1.10L</span>'+
       '<span><i style="background:var(--fg)"></i>Net worth</span></div>'
     : '<div style="display:flex;flex-wrap:wrap;gap:10px 40px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-subtle)">'+
       '<div class="side-i"><div class="lbl">You put in</div><div class="v fig">'+compact(last.cc*1e5,true)+'</div></div>'+
       '<div class="side-i"><div class="lbl">The market added</div><div class="v fig">'+compact(last.cg*1e5,true)+'</div></div>'+
       '<div class="side-i"><div class="lbl">Share from contributions</div><div class="v fig">'+pct(last.cc/(last.cc+last.cg)*100,1)+'</div></div></div>');
}

<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stock-Mania Institutional Shell</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* Layout concept: a fixed 272px institutional rail + a scrolling work surface. Hairline borders
   carry every bit of elevation; colour carries only meaning. Component layer per the control bench. */

:root{
  /* neutral ramp, hue ~250, faint cool cast. Theme-independent. */
  --n-0:#FFFFFF; --n-25:#FBFCFD; --n-50:#F6F8FA; --n-100:#EFF2F5; --n-150:#E4E8ED;
  --n-200:#D6DCE3; --n-300:#B9C2CC; --n-400:#8C98A6; --n-450:#808C9A; --n-500:#64707E;
  --n-600:#49545F; --n-700:#343C45; --n-775:#2A323A; --n-800:#232A31; --n-850:#1A2026;
  --n-900:#13181D; --n-950:#0C1014;

  --h-xs:24px; --h-sm:28px; --h-md:32px; --h-lg:36px; --h-xl:40px;
  --r-1:2px; --r-2:3px; --r-3:4px; --r-4:6px; --r-5:8px; --r-pill:999px;
  --t-fast:90ms; --t:110ms; --ease:cubic-bezier(.2,0,.38,1);

  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));

  --row-h:32px; --cell-pad:6px 12px;

  /* light theme */
  --bg-canvas:#F6F8FA; --bg-surface:#FFFFFF; --bg-raised:#FFFFFF; --bg-sunken:#F2F5F8;
  --bg-subtle:#F2F5F8; --bg-hover:#F6F8FA; --bg-active:#EFF2F5; --bg-selected:#EEF2FF;
  --border-subtle:#E4E8ED; --border:#D6DCE3; --border-control:#808C9A;
  --border-hover:#64707E; --border-active:#49545F;
  --fg:#13181D; --fg-secondary:#49545F; --fg-muted:#64707E; --fg-disabled:#7C8896;
  --accent:#4F62D8; --accent-hover:#3F50BE; --accent-active:#36459F; --accent-on:#FFFFFF;
  --accent-soft:#EEF2FF; --accent-soft-hover:#E0E7FF; --accent-line:#A5B4FC;
  --gain:#0E7C66; --gain-bg:#E6F5F1; --gain-line:#8FD3C4;
  --loss:#C0392B; --loss-bg:#FBEAE7; --loss-line:#EAA69E; --loss-on:#FFFFFF;
  --flat:#64707E;
  --warn:#B45309; --warn-bg:#FDF4E6; --warn-line:#E8C58A;
  --info:#1D6FA5; --info-bg:#E9F3FA; --info-line:#9CC6E2;
  --inner-hl:inset 0 -1px 0 rgb(19 24 29 / .07);
  --inner-hl-2:inset 0 -1px 0 rgb(19 24 29 / .13);
  --shadow-pop:0 4px 12px rgb(19 24 29 / .10), 0 0 0 1px rgb(19 24 29 / .04);
  --skel-a:#EFF2F5; --skel-b:#E0E5EA;
  --tip-bg:#13181D; --tip-fg:#F6F8FA;
  --c1:#5468D6; --c2:#1F94A8; --c3:#B5801F; --c4:#A14C9E; --c5:#4E7A3A; --c-other:#8C98A6;
  --grid:#E4E8ED;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg-canvas:#0C1014; --bg-surface:#13181D; --bg-raised:#1A2026; --bg-sunken:#0C1014;
  --bg-subtle:#1A2026; --bg-hover:#232A31; --bg-active:#2A323A; --bg-selected:#1B2340;
  --border-subtle:#232A31; --border:#343C45; --border-control:#64707E;
  --border-hover:#8C98A6; --border-active:#B9C2CC;
  --fg:#F6F8FA; --fg-secondary:#B9C2CC; --fg-muted:#8C98A6; --fg-disabled:#5C6875;
  --accent:#7D8CEA; --accent-hover:#9AA6F0; --accent-active:#B2BBF5; --accent-on:#0C1014;
  --accent-soft:#1B2340; --accent-soft-hover:#232C4E; --accent-line:#4F62D8;
  --gain:#3FC9A6; --gain-bg:#0E2F29; --gain-line:#1F6B5B;
  --loss:#FF7A6B; --loss-bg:#3A1A16; --loss-line:#8A3C33; --loss-on:#0C1014;
  --flat:#8C98A6;
  --warn:#F0B429; --warn-bg:#2E2411; --warn-line:#7A5E1B;
  --info:#5BB0E8; --info-bg:#11252F; --info-line:#2E6888;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --inner-hl-2:inset 0 1px 0 rgb(255 255 255 / .10);
  --shadow-pop:0 4px 12px rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
  --skel-a:#1A2026; --skel-b:#272F37;
  --tip-bg:#E4E8ED; --tip-fg:#13181D;
  --c1:#8A7FE8; --c2:#2FA3BA; --c3:#B68530; --c4:#C76BA0; --c5:#6FA14E; --c-other:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-canvas:#0C1014; --bg-surface:#13181D; --bg-raised:#1A2026; --bg-sunken:#0C1014;
  --bg-subtle:#1A2026; --bg-hover:#232A31; --bg-active:#2A323A; --bg-selected:#1B2340;
  --border-subtle:#232A31; --border:#343C45; --border-control:#64707E;
  --border-hover:#8C98A6; --border-active:#B9C2CC;
  --fg:#F6F8FA; --fg-secondary:#B9C2CC; --fg-muted:#8C98A6; --fg-disabled:#5C6875;
  --accent:#7D8CEA; --accent-hover:#9AA6F0; --accent-active:#B2BBF5; --accent-on:#0C1014;
  --accent-soft:#1B2340; --accent-soft-hover:#232C4E; --accent-line:#4F62D8;
  --gain:#3FC9A6; --gain-bg:#0E2F29; --gain-line:#1F6B5B;
  --loss:#FF7A6B; --loss-bg:#3A1A16; --loss-line:#8A3C33; --loss-on:#0C1014;
  --flat:#8C98A6;
  --warn:#F0B429; --warn-bg:#2E2411; --warn-line:#7A5E1B;
  --info:#5BB0E8; --info-bg:#11252F; --info-line:#2E6888;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --inner-hl-2:inset 0 1px 0 rgb(255 255 255 / .10);
  --shadow-pop:0 4px 12px rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
  --skel-a:#1A2026; --skel-b:#272F37;
  --tip-bg:#E4E8ED; --tip-fg:#13181D;
  --c1:#8A7FE8; --c2:#2FA3BA; --c3:#B68530; --c4:#C76BA0; --c5:#6FA14E; --c-other:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:20px;
  font-feature-settings:"tnum" 1,"cv05" 1;-webkit-font-smoothing:antialiased}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit;margin:0}
.tnum{font-variant-numeric:tabular-nums}
code,.mono{font-family:var(--mono);font-variant-numeric:slashed-zero tabular-nums;font-size:11.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
.rail{border-right:1px solid var(--border);background:var(--bg-surface);
  position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto;
  padding-block:14px 20px;padding-left:var(--gl);padding-right:14px;
  display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:9px}
.mark{width:22px;height:22px;border:1.5px solid var(--accent);border-radius:var(--r-2);flex:none;position:relative}
.mark::after{content:"";position:absolute;left:2.5px;right:2.5px;bottom:2.5px;height:6px;
  background:linear-gradient(to right,var(--accent) 0 2px,transparent 2px 4px,var(--accent) 4px 7px,transparent 7px 9px,var(--accent) 9px 13px)}
.brand b{font-size:14px;font-weight:600;letter-spacing:-.008em}
.brand span{display:block;font-size:11px;line-height:15px;color:var(--fg-muted)}

.nvi{display:flex;align-items:center;gap:9px;height:var(--h-md);padding:0 9px;border-radius:var(--r-2);
  color:var(--fg-secondary);text-decoration:none;font-size:13px;cursor:pointer;border:0;background:none;
  width:100%;text-align:left;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.nvi:hover{background:var(--bg-hover);color:var(--fg)}
.nvi:active{background:var(--bg-active)}
.nvi svg{flex:none;opacity:.82}
.nvi .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.nvi[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
.nvi[aria-current="page"] svg{opacity:1}
.nvi:focus-visible{outline-offset:-2px}
.nvi-grp{font-size:10.5px;line-height:16px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  color:var(--fg-muted);padding:6px 9px 3px}
.nav-group{display:flex;flex-direction:column;gap:1px}

.rail-foot{margin-top:auto;border:1px solid var(--border);border-radius:var(--r-4);padding:11px 12px;background:var(--bg-subtle)}
.rail-foot b{display:block;font-size:12px;margin-bottom:3px}
.rail-foot p{font-size:11px;line-height:15px;color:var(--fg-muted)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg-surface);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;
  padding-block:9px;padding-left:var(--gl);padding-right:var(--gr)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-surface)}
.cmd{flex:1;min-width:0;max-width:420px;display:flex;align-items:center;gap:8px;height:var(--h-md);
  border:1px solid var(--border-control);border-radius:var(--r-2);padding:0 9px;background:var(--bg-surface);
  color:var(--fg-muted);font-size:12.5px;cursor:pointer;box-shadow:var(--inner-hl);
  transition:border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
.cmd:hover{border-color:var(--border-hover);background:var(--bg-hover)}
.kbd{font-family:var(--mono);font-size:10.5px;height:18px;min-width:18px;padding:0 5px;
  border:1px solid var(--border);border-bottom-width:2px;border-radius:var(--r-2);color:var(--fg-muted);
  background:var(--bg-subtle);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.asof{font-size:11px;line-height:14px;color:var(--fg-muted);text-align:right;white-space:nowrap}

.page{padding-block:18px 56px;padding-left:var(--gl);padding-right:var(--gr);
  display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}

/* ---------- buttons ---------- */
.btn{--bh:var(--h-md);--bp:12px;--bf:13px;--br:var(--r-2);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--bh);padding:0 var(--bp);font-size:var(--bf);font-weight:500;line-height:1;letter-spacing:.004em;
  border:1px solid var(--border-control);border-radius:var(--br);background:var(--bg-surface);color:var(--fg);
  box-shadow:var(--inner-hl);cursor:pointer;white-space:nowrap;user-select:none;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),
             color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.btn > *{transition:transform var(--t-fast) var(--ease)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.btn:active{background:var(--bg-active);border-color:var(--border-active);box-shadow:none}
.btn:active > *{transform:translateY(.5px)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{background:var(--bg-subtle);border-color:var(--border);color:var(--fg-disabled);box-shadow:none;cursor:not-allowed}
.btn[disabled]:active > *{transform:none}
.btn-sm{--bh:var(--h-sm);--bp:10px;--bf:12px}
.btn-lg{--bh:var(--h-lg);--bp:16px;--bf:14px;--br:var(--r-3)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-on);box-shadow:var(--inner-hl-2)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn-primary:active{background:var(--accent-active);border-color:var(--accent-active);box-shadow:none}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--fg-secondary)}
.btn-ghost:hover{background:var(--bg-hover);border-color:transparent;color:var(--fg)}
.btn-ghost:active{background:var(--bg-active);border-color:transparent}
.btn-link{height:auto;padding:0;border:0;background:none;box-shadow:none;color:var(--accent);
  text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--accent-line)}
.btn-link:hover{background:none;text-decoration-color:currentColor}
.btn-link:active > *{transform:none}
.btn.loading{pointer-events:none}
.btn.loading > *{visibility:hidden}
.btn.loading::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;
  border:1.5px solid currentColor;border-top-color:transparent;animation:sp .62s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.btn.loading::after{animation:none;border-top-color:currentColor;border-style:dotted}}

/* flush segmented control */
.segf{display:inline-flex;height:var(--h-md);border:1px solid var(--border-control);border-radius:var(--r-2);
  overflow:hidden;background:var(--bg-surface);flex-wrap:wrap}
.segf button{height:var(--h-md);padding:0 11px;border:0;background:none;font-size:12px;font-weight:500;
  color:var(--fg-secondary);cursor:pointer;white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.segf button + button{box-shadow:inset 1px 0 0 var(--border)}
.segf button:hover{background:var(--bg-hover);color:var(--fg)}
.segf button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.segf button[aria-pressed="true"],.segf button[aria-pressed="true"] + button{box-shadow:none}
.segf button:focus-visible{outline-offset:-2px}
.segf-sm{height:var(--h-sm)}
.segf-sm button{height:var(--h-sm);padding:0 9px;font-size:11.5px}

/* inputs */
.inw{--ih:var(--h-lg);display:flex;align-items:center;height:var(--ih);background:var(--bg-surface);
  border:1px solid var(--border-control);border-radius:var(--r-3);box-shadow:var(--inner-hl);min-width:0;
  transition:border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.inw:hover{border-color:var(--border-hover)}
.inw:focus-within{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px;box-shadow:none}
.inw input{flex:1;min-width:0;height:100%;border:0;background:none;padding:0 10px;font-size:13px;color:var(--fg);outline:none}
.inw input::placeholder{color:var(--fg-disabled)}
.inw.ro{background:var(--bg-subtle);border-color:var(--border);border-style:dashed;box-shadow:none}
.inw.ro input{color:var(--fg-secondary);cursor:default}
.inw.dis{background:var(--bg-subtle);border-color:var(--border);box-shadow:none}
.inw.dis input{color:var(--fg-disabled);cursor:not-allowed}
select.sel{height:var(--h-lg);padding:0 30px 0 10px;font-size:13px;background-color:var(--bg-surface);color:var(--fg);
  border:1px solid var(--border-control);border-radius:var(--r-3);box-shadow:var(--inner-hl);cursor:pointer;
  appearance:none;min-width:0;max-width:100%;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) calc(50% + 1px),calc(100% - 11px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  transition:border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
select.sel:hover{border-color:var(--border-hover);background-color:var(--bg-hover)}
select.sel:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-2);
  font-size:11px;font-weight:500;line-height:1;letter-spacing:.008em;white-space:nowrap;
  border:1px solid transparent;background:var(--bg-subtle);color:var(--fg-secondary)}
.bdg .dot{width:5px;height:5px;border-radius:var(--r-pill);background:currentColor;flex:none;opacity:.85}
.bdg.sub-gain{background:var(--gain-bg);color:var(--gain)}
.bdg.sub-loss{background:var(--loss-bg);color:var(--loss)}
.bdg.sub-warn{background:var(--warn-bg);color:var(--warn)}
.bdg.sub-info{background:var(--info-bg);color:var(--info)}
.bdg.sub-acc{background:var(--accent-soft);color:var(--accent)}
.bdg.out-gain{background:none;border-color:var(--gain-line);color:var(--gain)}
.bdg.out-warn{background:none;border-color:var(--warn-line);color:var(--warn)}
.bdg.out-info{background:none;border-color:var(--info-line);color:var(--info)}
.bdg.out-acc{background:none;border-color:var(--accent-line);color:var(--accent)}
.bdg.out-n{background:none;border-color:var(--border);color:var(--fg-secondary)}
.bdg.mono{font-family:var(--mono);font-size:10px;letter-spacing:0}
.bdg.dash{background:none;border-style:dashed;border-color:var(--border-control);color:var(--fg-muted);
  letter-spacing:.06em;font-size:10px;font-weight:600}
.fchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 3px 0 8px;border-radius:var(--r-2);
  background:var(--bg-subtle);box-shadow:inset 0 0 0 1px var(--border);font-size:11.5px;color:var(--fg-secondary);max-width:250px}
.fchip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip em{font-style:normal;color:var(--fg-muted)}
.fchip button{width:16px;height:16px;border:0;border-radius:var(--r-1);background:none;color:var(--fg-muted);
  cursor:pointer;display:grid;place-items:center;flex:none;transition:background-color var(--t-fast) var(--ease)}
.fchip button:hover{background:var(--bg-active);color:var(--fg)}
.fchip button:focus-visible{outline-offset:0}

/* ---------- panels ---------- */
.panel{border:1px solid var(--border);border-radius:var(--r-4);background:var(--bg-surface);overflow:hidden}
.panel-h{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;padding:11px 14px;border-bottom:1px solid var(--border-subtle)}
.panel-h h2{font-size:14px;line-height:20px;font-weight:600}
.panel-h p{font-size:11.5px;line-height:16px;color:var(--fg-muted);max-width:76ch}
.panel-b{padding:14px}
.panel-h .spacer{margin-left:auto}
.h1{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.012em}
.sub{font-size:12px;line-height:17px;color:var(--fg-muted)}
.lbl{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-muted)}
.micro{font-size:11px;line-height:14px;font-weight:500}
.gain{color:var(--gain)}.loss{color:var(--loss)}.flat{color:var(--flat)}
.muted{color:var(--fg-muted)}
.u{font-size:11px;font-weight:500;color:var(--fg-muted);margin-left:2px;letter-spacing:0}
.notice{display:flex;gap:10px;border:1px solid var(--border);border-left:3px solid var(--warn);
  border-radius:var(--r-4);background:var(--bg-surface);padding:11px 13px}
.notice.err{border-left-color:var(--loss)}
.notice.ok{border-left-color:var(--accent)}
.notice b{font-size:13px;display:block}
.notice p{margin-top:3px;font-size:12px;line-height:17px;color:var(--fg-secondary)}
.flexwrap{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ann{font-family:var(--mono);font-size:10.5px;line-height:16px;color:var(--fg-muted);display:block;margin-top:8px}
dl.kv{display:grid;grid-template-columns:auto minmax(0,1fr);margin:0;font-size:12.5px;min-width:0}
dl.kv dt{color:var(--fg-muted);padding:6px 16px 6px 0;border-bottom:1px solid var(--border-subtle);white-space:nowrap}

const nf=(d)=>new Intl.NumberFormat("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});
function rupee(v){if(v==null)return null;const a=Math.abs(v),dp=a>=100000?0:2;return (v<0?"−":"")+"₹"+nf(dp).format(a);}
function rupeeSigned(v){if(v==null)return null;const a=Math.abs(v),dp=a>=100000?0:2;return (v<0?"−":"+")+"₹"+nf(dp).format(a);}
const trunc2=(x)=>Math.trunc(x*100)/100;
function compact(v,signed){
  if(v==null)return null;
  const s=v<0?"−":(signed?"+":""),a=Math.abs(v);
  if(a>=10000000) return s+"₹"+nf(2).format(trunc2(a/10000000))+'<span class="u">Cr</span>';
  if(a>=100000)   return s+"₹"+nf(2).format(trunc2(a/100000))+'<span class="u">L</span>';
  return s+"₹"+nf(a>=1000?0:2).format(a);
}

/* ===================== sparkline ===================== */
function spark(vals,tone){
  const w=200,h=30,p=3;
  const mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), sp=(mx-mn)||1;
  const pts=vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1), h-p-((v-mn)/sp)*(h-2*p)]);
  const d=pts.map((pt,i)=>(i?"L":"M")+pt[0].toFixed(1)+" "+pt[1].toFixed(1)).join(" ");
  const c=tone==="gain"?"var(--gain)":tone==="loss"?"var(--loss)":"var(--fg-secondary)";
  const last=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="'+c+'" stroke-width="1.5" vector-effect="non-scaling-stroke"/>'+
    '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="2" fill="'+c+'"/></svg>';
}

function rangeLabel(r){
  const s=seriesFor(r);
  if(s.n===0) return "19 Oct 2026 · intraday";
  if(r==="FY") return "1 Apr 2026 – 19 Oct 2026 · 202 days · FY 2026-27";
  if(r==="3Y"||r==="5Y"||r==="Max") return "1 Nov 2025 – 19 Oct 2026 · 353 days · only 12 months of snapshots exist";
  return "Last "+s.n+" month"+(s.n>1?"s":"")+" · to 19 Oct 2026";

function attribution(){
  const s=seriesFor(range);
  if(s.n<1){
    return '<div class="empty" role="status"><b>Attribution needs a full month</b>'+
      '<p>Contribution and market growth are separated from month-end net-worth snapshots. The '+range+
      ' range is shorter than one snapshot interval, so neither component can be derived. The app will not print a zero in place of a figure it has not computed.</p>'+
      '<button class="btn" id="to1M">Switch to 1M</button></div>';
  }
  const base=OPENING+CONTRIB.slice(0,12-s.n).reduce((a,b)=>a+b,0)+GROWTH.slice(0,12-s.n).reduce((a,b)=>a+b,0);
  let cc=0,cg=0;
  const rows=s.months.map((m,i)=>{cc+=s.contrib[i];cg+=s.growth[i];return{m:m,base:base,cc:cc,cg:cg,nw:base+cc+cg};});
  const W=880,H=300,L=54,R=16,T=14,B=28, iw=W-L-R, ih=H-T-B;
  const maxv=Math.max.apply(null,rows.map(r=>Math.max(r.nw,r.base+r.cc)));
  const top=Math.ceil(maxv/5)*5, y=(v)=>T+ih-(v/top)*ih;
  const step=iw/rows.length, bw=Math.min(44,step*0.62), cx=(i)=>L+step*i+step/2;
  let g="";
  for(let t=0;t<=top;t+=10) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(t).toFixed(1)+'" y2="'+y(t).toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>'+
    '<text x="'+(L-8)+'" y="'+(y(t)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--fg-muted)">₹'+t+'L</text>';
  let bars="";
  rows.forEach((r,i)=>{
    const x=cx(i)-bw/2, yB=y(r.base), yC=y(r.base+r.cc), yG=y(r.nw);
    bars+='<rect x="'+x.toFixed(1)+'" y="'+yB.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,T+ih-yB).toFixed(1)+'" fill="var(--bg-sunken)" stroke="var(--border)" stroke-width="1"/>';
    bars+='<rect x="'+x.toFixed(1)+'" y="'+yC.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,yB-yC-2).toFixed(1)+'" fill="var(--c-other)" rx="2"/>';
    const gh=yC-yG;
    bars+= gh>=0
      ? '<rect x="'+x.toFixed(1)+'" y="'+yG.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,gh-2).toFixed(1)+'" fill="var(--gain)" rx="2"/>'
      : '<rect x="'+x.toFixed(1)+'" y="'+(yC+2).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,-gh-2).toFixed(1)+'" fill="var(--loss)" rx="2"/>';
    bars+='<text x="'+cx(i).toFixed(1)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11" fill="var(--fg-muted)">'+r.m+'</text>';
  });
  const line=rows.map((r,i)=>(i?"L":"M")+cx(i).toFixed(1)+" "+y(r.nw).toFixed(1)).join(" ");
  const dots=rows.map((r,i)=>'<circle cx="'+cx(i).toFixed(1)+'" cy="'+y(r.nw).toFixed(1)+'" r="2.6" fill="var(--bg-surface)" stroke="var(--fg)" stroke-width="1.5"/>').join("");
  const last=rows[rows.length-1];
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" height="300" role="img" aria-label="Net worth rose from ₹'+base.toFixed(2)+
    ' lakh to ₹'+last.nw.toFixed(2)+' lakh over '+s.n+' months; ₹'+last.cc.toFixed(2)+' lakh came from contributions and ₹'+
    last.cg.toFixed(2)+' lakh from market growth.">'+g+bars+'<path d="'+line+'" fill="none" stroke="var(--fg)" stroke-width="2"/>'+dots+'</svg>'+
   '<div class="legend">'+
    '<span><i style="background:var(--bg-sunken);box-shadow:inset 0 0 0 1px var(--border)"></i>Carried in at range start ₹'+base.toFixed(2)+'L</span>'+
    '<span><i style="background:var(--c-other)"></i>Net contributions +₹'+last.cc.toFixed(2)+'L</span>'+
    '<span><i style="background:var(--gain)"></i>Market growth '+(last.cg<0?"−":"+")+'₹'+Math.abs(last.cg).toFixed(2)+'L</span>'+
    '<span><i style="background:var(--fg)"></i>Net worth</span></div>';
}

const COLS=[
 {k:"sym",l:"Holding"},{k:"kind",l:"Type"},{k:"plat",l:"Platform"},
 {k:"units",l:"Units",num:true},{k:"inv",l:"Invested",num:true},{k:"mv",l:"Market value",num:true},

];
const val=(h,k)=> k==="pnl" ? (h.mv===null?null:h.mv-h.inv) : (h[k]===undefined?null:h[k]);
function sortedHoldings(){
  const rows=HOLDINGS.slice();
  if(!sortKeys.length) return rows;
  rows.sort((a,b)=>{
    for(const s of sortKeys){
      const x=val(a,s.k), y=val(b,s.k);
      if(x===null&&y===null) continue;
      if(x===null) return 1; if(y===null) return -1;
      const c = typeof x==="string" ? x.localeCompare(y) : (x-y);
      if(c) return c*s.dir;
    }
    return 0;
  });
  return rows;
}
function stateBadge(s){
  if(s==="Priced")  return '<span class="bdg out-gain"><span class="dot"></span>Priced</span>';
  if(s==="Stale")   return '<span class="bdg sub-warn"><span class="dot"></span>Stale</span>';
  if(s==="Unpriced")return '<span class="bdg out-n">Unpriced</span>';
  return '<span class="bdg sub-warn"><span class="dot"></span>FX unavailable</span>';
}
function unavail(h,what){
  const why = h.state==="Unpriced"
    ? "No quote stored for ITC since 12 Oct 2026. "+what+" is withheld rather than shown as zero."
    : "Last USD price is 17 Oct 2026, but no USD→INR rate is stored for that date. "+what+" is withheld rather than shown as zero.";
  return '<span class="dash-cell" tabindex="0" title="'+why+'">—</span>';
}
function holdingsTable(){
  const rows=sortedHoldings();

    const dayC = h.day===null ? unavail(h,"Day change") : '<span class="'+sgn(h.day)+'">'+pctS(h.day)+'</span>';

      '<td>'+stateBadge(h.state)+'</td></tr>';
  }).join("");
  const pr=rows.filter(h=>h.mv!==null);
  const sInv=pr.reduce((a,h)=>a+h.inv,0), sMv=pr.reduce((a,h)=>a+h.mv,0);
  const foot='<tr><td>Subtotal · 10 priced of 12</td><td></td><td></td><td></td>'+
    '<td class="num">'+rupee(sInv)+'</td><td class="num">'+rupee(sMv)+'</td>'+
    '<td class="num '+sgn(sMv-sInv)+'">'+rupeeSigned(sMv-sInv)+'</td><td></td><td class="num">100.00%</td>'+
    '<td class="num">'+rupee(rows.reduce((a,h)=>a+h.real,0))+'</td><td></td></tr>';
  const cards=rows.map(h=>{
    const pnl=h.mv===null?null:h.mv-h.inv;

      '<div class="r1">'+(h.mv===null?'<span class="dash-plain">—</span>':rupee(h.mv))+'</div>'+

      '<div class="r2">'+(h.day===null?'<span class="dash-plain">—</span>':'<span class="'+sgn(h.day)+'">'+pctS(h.day)+'</span>')+'</div></div>';
  }).join("");
  return '<div class="tscroll collapses"><table class="dt" id="holdTbl"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody><tfoot>'+foot+'</tfoot></table></div>'+
    '<div class="cards-m">'+cards+'<div class="mcard"><div class="l1">Subtotal</div><div class="r1">'+rupee(sMv)+
    '</div><div class="l2">10 priced of 12</div><div class="r2 '+sgn(sMv-sInv)+'">'+rupeeSigned(sMv-sInv)+'</div></div></div>';
}

function bindDashboard(){
  document.querySelectorAll("#rangeSeg button").forEach(b=>b.addEventListener("click",()=>setRange(b.dataset.r)));
  document.querySelectorAll("#allocSeg button").forEach(b=>b.addEventListener("click",()=>{
    allocDim=b.dataset.d;
    document.querySelectorAll("#allocSeg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.d===allocDim));
    document.getElementById("allocWrap").innerHTML=allocPanel();
  }));
  document.querySelectorAll("#densSeg button").forEach(b=>b.addEventListener("click",()=>{
    density=b.dataset.dn;
    document.querySelectorAll("#densSeg button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.dn===density));
    root.style.setProperty("--row-h",DENSITY[density][0]);
    root.style.setProperty("--cell-pad",DENSITY[density][1]);
  }));
  bindSort();
  const b=document.getElementById("benchBtn");
  if(b) b.addEventListener("click",()=>toast("Benchmark comparison is not built: no NIFTY 50 price series is stored under the keyless market-data constraint."));
  const v=document.getElementById("viewAsTable");
  if(v) v.addEventListener("click",()=>toast("Every chart carries a View-as-table affordance; the table renders the same rows the chart draws."));
  const t=document.getElementById("to1M");
  if(t) t.addEventListener("click",()=>setRange("1M"));
}
function bindSort(){
  document.querySelectorAll("#holdTbl thead th").forEach(th=>{
    const act=(e)=>{
      const k=th.dataset.k; if(!k) return;
      const i=sortKeys.findIndex(s=>s.k===k);
      if(e.shiftKey){
        if(i<0) sortKeys.push({k:k,dir:-1});
        else if(sortKeys[i].dir===-1) sortKeys[i].dir=1;
        else sortKeys.splice(i,1);
      } else {
        if(i<0||sortKeys.length>1) sortKeys=[{k:k,dir:-1}];
        else if(sortKeys[0].dir===-1) sortKeys=[{k:k,dir:1}];
        else sortKeys=[];
      }
      refreshHoldings();
    };
    th.addEventListener("click",act);
    th.addEventListener("keydown",(e)=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();act(e);}});
  });
  const c=document.getElementById("clearSort");
  if(c) c.addEventListener("click",(e)=>{e.stopPropagation();sortKeys=[];refreshHoldings();});
}
function refreshHoldings(){
  document.getElementById("holdWrap").innerHTML=holdingsTable();
  document.getElementById("sortChip").innerHTML=sortChip();
  bindSort();
}
function setRange(r){
  range=r;
  const sc=window.scrollY;
  document.getElementById("pageDashboard").innerHTML=dashboard();
  bindDashboard(); window.scrollTo(0,sc);
}

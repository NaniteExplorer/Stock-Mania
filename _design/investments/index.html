<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Stock-Mania Investments</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed top chrome (brand / screen switcher / as-of / theme) over one scrolling work
   surface; tables take the full width, dashboards cap at 1440px. Component layer is the
   Control Bench kit (2026-10-20) — heights 24/28/32/36/40, radius bound to height, five
   border-strength steps, borders carry all elevation. */
:root{
  --n-0:#FFFFFF;--n-25:#FBFCFD;--n-50:#F6F8FA;--n-100:#EFF2F5;--n-150:#E4E8ED;
  --n-200:#D6DCE3;--n-300:#B9C2CC;--n-400:#8C98A6;--n-450:#808C9A;--n-500:#64707E;
  --n-600:#49545F;--n-700:#343C45;--n-775:#2A323A;--n-800:#232A31;--n-850:#1A2026;
  --n-900:#13181D;--n-950:#0C1014;

  --h-xs:24px;--h-sm:28px;--h-md:32px;--h-lg:36px;--h-xl:40px;
  --r-1:2px;--r-2:3px;--r-3:4px;--r-4:6px;--r-5:8px;--r-pill:999px;
  --t-fast:90ms;--t:110ms;--ease:cubic-bezier(.2,0,.38,1);

  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));
  --gr:max(16px,env(safe-area-inset-right,0px));
  --row:32px;

  --bg-canvas:#F6F8FA;--bg-surface:#FFFFFF;--bg-raised:#FFFFFF;--bg-sunken:#F2F5F8;
  --bg-subtle:#F2F5F8;--bg-hover:#F6F8FA;--bg-active:#EFF2F5;--bg-selected:#EEF2FF;
  --border-subtle:#E4E8ED;--border:#D6DCE3;--border-control:#808C9A;
  --border-hover:#64707E;--border-active:#49545F;
  --fg:#13181D;--fg-secondary:#49545F;--fg-muted:#64707E;--fg-disabled:#7C8896;
  --accent:#4F62D8;--accent-hover:#3F50BE;--accent-active:#36459F;--accent-on:#FFFFFF;
  --accent-soft:#EEF2FF;--accent-soft-hover:#E0E7FF;--accent-line:#A5B4FC;
  --gain:#0E7C66;--gain-bg:#E6F5F1;--gain-line:#8FD3C4;
  --loss:#C0392B;--loss-bg:#FBEAE7;--loss-line:#EAA69E;--loss-on:#FFFFFF;
  --flat:#64707E;
  --warn:#B45309;--warn-bg:#FDF4E6;--warn-line:#E8C58A;
  --info:#1D6FA5;--info-bg:#E9F3FA;--info-line:#9CC6E2;
  --inner-hl:inset 0 -1px 0 rgb(19 24 29 / .07);
  --inner-hl-2:inset 0 -1px 0 rgb(19 24 29 / .13);
  --shadow-pop:0 4px 12px rgb(19 24 29 / .10), 0 0 0 1px rgb(19 24 29 / .04);
  --tip-bg:#13181D;--tip-fg:#F6F8FA;
  --c1:#5468D6;--c2:#1F94A8;--c3:#B5801F;--c4:#A14C9E;--c5:#4E7A3A;--c-other:#8C98A6;
  --c6:#8C98A6;
  --grid:#E4E8ED;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg-canvas:#0C1014;--bg-surface:#13181D;--bg-raised:#1A2026;--bg-sunken:#0C1014;
  --bg-subtle:#1A2026;--bg-hover:#232A31;--bg-active:#2A323A;--bg-selected:#1B2340;
  --border-subtle:#232A31;--border:#343C45;--border-control:#64707E;
  --border-hover:#8C98A6;--border-active:#B9C2CC;
  --fg:#F6F8FA;--fg-secondary:#B9C2CC;--fg-muted:#8C98A6;--fg-disabled:#5C6875;
  --accent:#7D8CEA;--accent-hover:#9AA6F0;--accent-active:#B2BBF5;--accent-on:#0C1014;
  --accent-soft:#1B2340;--accent-soft-hover:#232C4E;--accent-line:#4F62D8;
  --gain:#3FC9A6;--gain-bg:#0E2F29;--gain-line:#1F6B5B;
  --loss:#FF7A6B;--loss-bg:#3A1A16;--loss-line:#8A3C33;--loss-on:#0C1014;
  --flat:#8C98A6;
  --warn:#F0B429;--warn-bg:#2E2411;--warn-line:#7A5E1B;
  --info:#5BB0E8;--info-bg:#11252F;--info-line:#2E6888;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --inner-hl-2:inset 0 1px 0 rgb(255 255 255 / .10);
  --shadow-pop:0 4px 12px rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
  --tip-bg:#E4E8ED;--tip-fg:#13181D;
  --c1:#8A7FE8;--c2:#2FA3BA;--c3:#B68530;--c4:#C76BA0;--c5:#6FA14E;--c-other:#64707E;
  --c6:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-canvas:#0C1014;--bg-surface:#13181D;--bg-raised:#1A2026;--bg-sunken:#0C1014;
  --bg-subtle:#1A2026;--bg-hover:#232A31;--bg-active:#2A323A;--bg-selected:#1B2340;
  --border-subtle:#232A31;--border:#343C45;--border-control:#64707E;
  --border-hover:#8C98A6;--border-active:#B9C2CC;
  --fg:#F6F8FA;--fg-secondary:#B9C2CC;--fg-muted:#8C98A6;--fg-disabled:#5C6875;
  --accent:#7D8CEA;--accent-hover:#9AA6F0;--accent-active:#B2BBF5;--accent-on:#0C1014;
  --accent-soft:#1B2340;--accent-soft-hover:#232C4E;--accent-line:#4F62D8;
  --gain:#3FC9A6;--gain-bg:#0E2F29;--gain-line:#1F6B5B;
  --loss:#FF7A6B;--loss-bg:#3A1A16;--loss-line:#8A3C33;--loss-on:#0C1014;
  --flat:#8C98A6;
  --warn:#F0B429;--warn-bg:#2E2411;--warn-line:#7A5E1B;
  --info:#5BB0E8;--info-bg:#11252F;--info-line:#2E6888;
  --inner-hl:inset 0 1px 0 rgb(255 255 255 / .055);
  --inner-hl-2:inset 0 1px 0 rgb(255 255 255 / .10);
  --shadow-pop:0 4px 12px rgb(0 0 0 / .45), 0 0 0 1px rgb(255 255 255 / .06);
  --tip-bg:#E4E8ED;--tip-fg:#13181D;
  --c1:#8A7FE8;--c2:#2FA3BA;--c3:#B68530;--c4:#C76BA0;--c5:#6FA14E;--c-other:#64707E;
  --c6:#64707E;
  --grid:#232A31;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-canvas);color:var(--fg);font-family:var(--sans);font-size:14px;
  line-height:20px;font-feature-settings:"tnum" 1,"cv05" 1;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg-surface)}
@media (prefers-reduced-motion:reduce){*{transition-duration:1ms!important;animation-duration:1ms!important}}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
.tnum{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:slashed-zero tabular-nums;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;max-width:100%}
.ic{display:inline-flex;flex:none;align-items:center}
input[type=checkbox]{accent-color:var(--accent)}
.mlead{display:flex;align-items:center;gap:8px;min-width:0}
.vmenu{position:relative;display:inline-flex}

/* ---------------- chrome ---------------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg-surface);
  border-bottom:1px solid var(--border)}
.topbar-in{padding-left:var(--gl);padding-right:var(--gr);padding-block:9px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;white-space:nowrap;letter-spacing:-.005em}
.mark{width:20px;height:20px;border:1.5px solid var(--accent);border-radius:var(--r-2);flex:none;position:relative}
.mark::after{content:"";position:absolute;left:2.5px;right:2.5px;bottom:2.5px;height:6px;
  background:linear-gradient(to right,var(--accent) 0 2px,transparent 2px 4px,var(--accent) 4px 7px,transparent 7px 9px,var(--accent) 9px 13px)}
.brand span{font-size:11px;font-weight:500;color:var(--fg-muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{flex:1 1 auto;min-width:0}
.asof{font-size:11px;color:var(--fg-muted);white-space:nowrap}
.asof b{font-weight:500;color:var(--fg-secondary)}
.navrow{padding-left:var(--gl);padding-right:var(--gr);display:flex;gap:1px;overflow-x:auto;
  scrollbar-width:thin;border-top:1px solid var(--border-subtle);padding-block:5px}
.navrow button{display:inline-flex;align-items:center;gap:6px;height:var(--h-sm);padding:0 9px;
  border:1px solid transparent;border-radius:var(--r-2);background:none;font-size:12px;font-weight:500;
  color:var(--fg-muted);cursor:pointer;white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.navrow button:hover{background:var(--bg-hover);color:var(--fg)}
.navrow button[aria-current="true"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.navrow button:focus-visible{outline-offset:-2px}
.page{padding-left:var(--gl);padding-right:var(--gr);padding-block:20px 72px}
.wrap{max-width:1440px;margin:0 auto}
.wide{max-width:none}

/* ---------------- type ---------------- */
h1{font-size:22px;line-height:28px;letter-spacing:-.012em}
h2{font-size:17px;line-height:24px;letter-spacing:-.008em}
h3{font-size:13px;line-height:18px}
.lbl{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.015em;color:var(--fg-muted)}
.micro{font-size:11px;line-height:14px;font-weight:500;font-variant-numeric:tabular-nums}
.muted{color:var(--fg-muted)}
.sec{color:var(--fg-secondary)}
.gain{color:var(--gain)}.loss{color:var(--loss)}.flat{color:var(--flat)}
.hdr{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.sub{font-size:12.5px;line-height:19px;color:var(--fg-secondary);margin:0 0 16px;max-width:88ch}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------------- surfaces ---------------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-4);padding:16px;min-width:0}
.card .cap{font-size:11.5px;line-height:17px;color:var(--fg-muted);margin:2px 0 12px;max-width:84ch}
.grid{display:grid;gap:12px}
.note{border-left:2px solid var(--warn);background:var(--warn-bg);padding:10px 12px;
  border-radius:0 var(--r-2) var(--r-2) 0;font-size:12.5px;line-height:18px}
.note.i{border-color:var(--info);background:var(--info-bg)}
.note.a{border-color:var(--accent-line);background:var(--accent-soft)}
.disclaim{font-size:11px;line-height:17px;color:var(--fg-muted);border-top:1px solid var(--border-subtle);
  padding-top:8px;margin-top:12px}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0;margin:0;font-size:12.5px;min-width:0}
.dl dt{color:var(--fg-muted);padding:6px 16px 6px 0;border-bottom:1px solid var(--border-subtle);white-space:nowrap}
.dl dd{margin:0;padding:6px 0;border-bottom:1px solid var(--border-subtle);text-align:right;
  font-variant-numeric:tabular-nums;min-width:0}
.dl dt:last-of-type,.dl dd:last-of-type{border-bottom:0}

/* ---------------- badges (control-bench .bdg, mapped onto .chip) ---------------- */
.chip{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:var(--r-2);
  font-size:11px;font-weight:500;line-height:1;letter-spacing:.008em;white-space:nowrap;
  border:1px solid transparent;background:var(--bg-subtle);color:var(--fg-secondary)}
.chip .dot{width:5px;height:5px;border-radius:var(--r-pill);background:currentColor;flex:none;opacity:.85}
.chip.ok{background:var(--gain-bg);color:var(--gain)}
.chip.bad{background:var(--loss-bg);color:var(--loss)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.info{background:var(--info-bg);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.out{background:none;border-color:var(--border);color:var(--fg-secondary)}
.chip.out-warn{background:none;border-color:var(--warn-line);color:var(--warn)}
.chip.ex{background:none;border-color:var(--border);color:var(--fg-muted);font-size:10px;padding:0 5px;
  font-family:var(--mono);letter-spacing:0}
.chip.new{background:none;border-style:dashed;border-color:var(--border-control);color:var(--fg-muted);
  letter-spacing:.06em;font-size:10px;font-weight:600;height:18px;padding:0 6px}

/* ---------------- buttons ---------------- */
.btn{--bh:var(--h-md);--bp:12px;--bf:13px;--br:var(--r-2);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:var(--bh);padding:0 var(--bp);font-size:var(--bf);font-weight:500;line-height:1;letter-spacing:.004em;
  border:1px solid var(--border-control);border-radius:var(--br);background:var(--bg-surface);color:var(--fg);
  box-shadow:var(--inner-hl);cursor:pointer;white-space:nowrap;user-select:none;
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),
             color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.btn > *{transition:transform var(--t-fast) var(--ease)}
.btn:hover{background:var(--bg-hover);border-color:var(--border-hover)}
.btn:active{background:var(--bg-active);border-color:var(--border-active);box-shadow:none}
.btn:active > *{transform:translateY(.5px)}
.btn[disabled]{background:var(--bg-subtle);border-color:var(--border);color:var(--fg-disabled);
  box-shadow:none;cursor:not-allowed}
.btn[disabled]:active > *{transform:none}
.btn-sm{--bh:var(--h-sm);--bp:10px;--bf:12px}
.btn-xs{--bh:var(--h-xs);--bp:8px;--bf:11.5px;--br:var(--r-1)}
.btn.only{width:var(--bh);padding:0;gap:0}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-on);box-shadow:var(--inner-hl-2)}
.btn.pri:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.pri:active{background:var(--accent-active);border-color:var(--accent-active);box-shadow:none}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--fg-secondary)}
.btn.ghost:hover{background:var(--bg-hover);border-color:transparent;color:var(--fg)}
.btn[aria-pressed="true"],.btn.on{background:var(--accent-soft);border-color:var(--accent-line);
  color:var(--accent);box-shadow:none}
.btn[aria-pressed="true"]:hover,.btn.on:hover{background:var(--accent-soft-hover);border-color:var(--accent)}

.seg{display:inline-flex;height:var(--h-md);border:1px solid var(--border-control);border-radius:var(--r-2);
  overflow:hidden;background:var(--bg-surface)}
.seg button{height:100%;padding:0 11px;border:0;background:none;font-size:12px;font-weight:500;
  color:var(--fg-secondary);cursor:pointer;white-space:nowrap;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.seg button + button{box-shadow:inset 1px 0 0 var(--border)}
.seg button:hover{background:var(--bg-hover);color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg button[aria-pressed="true"],.seg button[aria-pressed="true"] + button{box-shadow:none}
.seg button:focus-visible{outline-offset:-2px}
.seg-sm{height:var(--h-sm)}
.seg-sm button{padding:0 9px;font-size:11.5px}

/* ---------------- form controls ---------------- */
input[type=text],input[type=number],input[type=search]{height:var(--h-md);background:var(--bg-surface);
  border:1px solid var(--border-control);border-radius:var(--r-2);box-shadow:var(--inner-hl);
  padding:0 9px;font-size:12.5px;min-width:0;outline:none;color:var(--fg);
  transition:border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
input:hover{border-color:var(--border-hover)}
input:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px;box-shadow:none}
input::placeholder{color:var(--fg-disabled)}
input[readonly]{background:var(--bg-subtle);border-style:dashed;border-color:var(--border);
  color:var(--fg-secondary);box-shadow:none;cursor:default}
input[readonly]:hover{border-color:var(--border)}
select{height:var(--h-md);padding:0 26px 0 9px;font-size:12.5px;background-color:var(--bg-surface);color:var(--fg);
  border:1px solid var(--border-control);border-radius:var(--r-2);box-shadow:var(--inner-hl);cursor:pointer;
  appearance:none;min-width:0;max-width:100%;outline:none;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 13px) calc(50% + 1px),calc(100% - 9px) calc(50% + 1px);
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
  transition:border-color var(--t-fast) var(--ease),background-color var(--t-fast) var(--ease)}
select:hover{border-color:var(--border-hover);background-color:var(--bg-hover)}
select:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;background:var(--bg-sunken);border:1px dashed var(--border-control);border-radius:var(--r-3);
  font-family:var(--mono);font-size:11.5px;line-height:17px;padding:8px 10px;resize:vertical;
  color:var(--fg-secondary);outline:none}
.ctl{display:inline-flex;align-items:flex-start;gap:8px;cursor:pointer;font-size:12.5px;line-height:18px;min-width:0}
.ctl input{position:absolute;opacity:0;width:0;height:0}
.ctl .bx{width:16px;height:16px;flex:none;margin-top:1px;border:1px solid var(--border-control);
  border-radius:var(--r-1);background:var(--bg-surface);box-shadow:var(--inner-hl);display:grid;place-items:center;
  color:var(--accent-on);
  transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),box-shadow var(--t-fast) var(--ease)}
.ctl .bx > span{opacity:0;display:grid;place-items:center;transition:opacity var(--t-fast) var(--ease)}
.ctl:hover .bx{border-color:var(--border-hover)}
.ctl input:checked + .bx,.ctl input:indeterminate + .bx{background:var(--accent);border-color:var(--accent);
  box-shadow:var(--inner-hl-2)}
.ctl input:checked + .bx > span,.ctl input:indeterminate + .bx > span{opacity:1}
.ctl input:focus-visible + .bx{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field .lbl{font-size:12px;color:var(--fg-secondary);font-weight:500}

/* ---------------- table ---------------- */
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;background:var(--bg-surface);
  border:1px solid var(--border);border-bottom:0}
.tbar.sel{background:var(--accent-soft);border-color:var(--accent-line)}
.tbar.top{border-radius:var(--r-4) var(--r-4) 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding:8px 12px;background:var(--bg-surface);
  border:1px solid var(--border);border-bottom:0;border-top:1px solid var(--border-subtle);font-size:11.5px}
.fchip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 3px 0 8px;border-radius:var(--r-2);
  background:var(--bg-subtle);box-shadow:inset 0 0 0 1px var(--border);font-size:11.5px;color:var(--fg-secondary);
  max-width:260px;transition:box-shadow var(--t-fast) var(--ease)}
.fchip:hover{box-shadow:inset 0 0 0 1px var(--border-hover)}
.fchip > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip em{font-style:normal;color:var(--fg-muted)}
.fchip button{width:16px;height:16px;border:0;border-radius:var(--r-1);background:none;color:var(--fg-muted);
  cursor:pointer;display:grid;place-items:center;flex:none;
  transition:background-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease)}
.fchip button:hover{background:var(--bg-active);color:var(--fg)}
.fchip button:focus-visible{outline-offset:0}
.tscroll{overflow-x:auto;border:1px solid var(--border);border-radius:0 0 var(--r-4) var(--r-4);

function lerpSeries(ctrl,n,amp,seed){
  var s=seed||1, out=[];
  function rnd(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff-0.5;}
  for(var i=0;i<n;i++){
    var j=0; while(j<ctrl.length-2 && ctrl[j+1][0]<=i) j++;
    var a=ctrl[j],b=ctrl[j+1];
    var t=(i-a[0])/(b[0]-a[0]); t=Math.max(0,Math.min(1,t));
    var e=t*t*(3-2*t);
    var base=a[1]+(b[1]-a[1])*e;
    var env=Math.sin(Math.PI*t);
    out.push(base+rnd()*amp*env);
  }
  out[0]=ctrl[0][1]; out[n-1]=ctrl[ctrl.length-1][1];
  return out;
}

/* A view = filters + sort + columns + grouping + density, named. Presets ship so the
   feature is useful on day one; the user's own views need a storage table that the
   schema does not have today. */
var VIEWS=[
 {id:"all",     name:"All holdings"},
 {id:"equity",  name:"Equity",            klass:["Listed equity"]},
 {id:"funds",   name:"Mutual funds",      klass:["Equity fund","Debt fund","ETF"]},

 {id:"ltcg",    name:"LTCG-eligible",     bucket:"LTCG"},
 {id:"soon",    name:"Approaching LTCG",  bucket:"SOON"},
 {id:"divs",    name:"Dividend payers",   dividends:true}
];
function viewById(id){var v=null; VIEWS.forEach(function(x){if(x.id===id)v=x;});
  if(v) return v;
  var c=null; S.customViews.forEach(function(x){if(x.id===id)c=x;}); return c;}
function applyView(id){
  var v=viewById(id)||VIEWS[0];
  S.view=id; S.q=""; S.fPlat=[]; S.fPs=[]; S.minMv=null; S.maxMv=null;
  S.fKlass=v.klass? v.klass.slice():[];
  S.limit=v.limit||null; S.onlyLosers=!!v.losers; S.lotBucket=v.bucket||null;
  S.dividendOnly=!!v.dividends;
  S.sort=v.sort? v.sort.map(function(x){return {k:x.k,dir:x.dir};}) : [{k:"mv",dir:-1}];
  S.group="none"; S.expanded=null; S.selected={};
}
/* A view is dirty when the live state no longer matches what the view describes. */
function viewDirty(){
  var v=viewById(S.view); if(!v) return false;
  var want=(v.klass||[]).slice().sort().join("|");
  if(S.fKlass.slice().sort().join("|")!==want) return true;
  if(S.q||S.fPlat.length||S.fPs.length||S.minMv!==null||S.maxMv!==null) return true;
  if((S.limit||null)!==(v.limit||null)) return true;
  if(S.onlyLosers!==!!v.losers||S.lotBucket!==(v.bucket||null)) return true;
  if(S.dividendOnly!==!!v.dividends) return true;
  if(S.group!=="none") return true;
  var ws=(v.sort||[{k:"mv",dir:-1}]).map(function(x){return x.k+x.dir;}).join(",");
  return S.sort.map(function(x){return x.k+x.dir;}).join(",")!==ws;
}
function viewStrip(){
  var dirty=viewDirty(), cur=viewById(S.view);
  var custom=S.customViews.map(function(c){return c;});
  return '<div class="views">'
   +VIEWS.map(function(v){
      return '<button type="button" class="vbtn" data-view="'+v.id+'" aria-pressed="'+(S.view===v.id?"true":"false")+'">'
        +esc(v.name)+(S.view===v.id&&dirty?'<span class="dirty" title="Unsaved changes"></span>':"")+'</button>';}).join("")
   +(custom.length?'<span class="vsep"></span>':"")
   +custom.map(function(c){
      return '<button type="button" class="vbtn" data-view="'+c.id+'" aria-pressed="'+(S.view===c.id?"true":"false")+'">'
        +ic("save",12)+esc(c.name)+'</button>';}).join("")
   +'<span class="vsep"></span>'
   +'<button type="button" class="vbtn" id="vNew">'+ic("plus",12)+'New view</button>'
   +'<div class="popwrap"><button type="button" class="vbtn" data-pop="view" aria-label="View actions">'+ic("more",13)+'</button>'+pop("view")+'</div>'
   +'<span class="spacer"></span>'
   +(dirty
      ? '<span class="micro muted">Changed from \u201c'+esc(cur?cur.name:"")+'\u201d</span>'
        +'<button type="button" class="btn btn-sm pri" id="vSave">'+ic("save",12)+'Save view</button>'
        +'<button type="button" class="btn btn-sm" id="vReset">Reset</button>'
      : '<span class="micro muted">Filters, sort, columns, grouping and density travel together as one view.</span>')
   +'</div>';
}
function facetCounts(key){
  var m={}; H.forEach(function(h){ var v=key==="klass"?h.klass:key==="plat"?h.plat:h.ps; m[v]=(m[v]||0)+1;});
  return m;
}
function filtered(){
  var q=S.q.trim().toLowerCase();
  return H.filter(function(h){
    if(q && (h.sym+" "+h.name+" "+h.isin).toLowerCase().indexOf(q)<0) return false;
    if(S.fKlass.length && S.fKlass.indexOf(h.klass)<0) return false;
    if(S.fPlat.length && S.fPlat.indexOf(h.plat)<0) return false;
    if(S.fPs.length && S.fPs.indexOf(h.ps)<0) return false;
    if(S.minMv!==null && (!h.priced || h.mv<S.minMv)) return false;
    if(S.maxMv!==null && (!h.priced || h.mv>S.maxMv)) return false;
    if(S.onlyLosers && !(h.priced && h.pnl<0)) return false;
    if(S.dividendOnly) return false;   /* nothing links income back to an instrument */
    if(S.lotBucket==="LTCG" && !h.lots.some(function(l){return l.bucket==="LTCG";})) return false;
    if(S.lotBucket==="SOON" && !h.lots.some(function(l){return l.toLtcg>0 && l.toLtcg<=90;})) return false;
    return true;
  });
}
function sorted(rows){
  if(!S.sort.length) return rows;
  var out=rows.slice();
  out.sort(function(a,b){
    for(var i=0;i<S.sort.length;i++){
      var s=S.sort[i], c=COLS.filter(function(c){return c.k===s.k;})[0];
      if(!c||!c.sortv) continue;
      var va=c.sortv(a), vb=c.sortv(b);
      if(va===null&&vb===null) continue;
      if(va===null) return 1;           /* nulls last, both directions */
      if(vb===null) return -1;
      if(typeof va==="string"){ var r=va.localeCompare(vb); if(r) return r*s.dir; continue; }
      if(va!==vb) return (va<vb?-1:1)*s.dir;
    }
    return 0;
  });
  return out;
}
function toggleSort(k,shift){
  var c=COLS.filter(function(c){return c.k===k;})[0];
  if(!c||!c.sortv) return;
  var idx=-1; S.sort.forEach(function(s,i){if(s.k===k)idx=i;});
  if(!shift){
    if(idx===0 && S.sort.length===1){
      if(S.sort[0].dir===-1) S.sort=[{k:k,dir:1}];
      else S.sort=[];
    } else S.sort=[{k:k,dir:-1}];
  } else {
    if(idx>=0){ if(S.sort[idx].dir===-1) S.sort[idx].dir=1; else S.sort.splice(idx,1); }
    else S.sort.push({k:k,dir:-1});
  }
  render();
}

function histo(){
  var vals=PRICED.map(function(h){return h.mv;}), lo=0, hi=350000, b=10, bins=new Array(b).fill(0);
  vals.forEach(function(v){bins[Math.min(b-1,Math.floor((v-lo)/(hi-lo)*b))]++;});
  var mx=Math.max.apply(null,bins);
  return '<svg viewBox="0 0 200 34" width="200" height="34" aria-hidden="true">'
    +bins.map(function(c,i){var hh=c/mx*28;
      return '<rect x="'+(i*20+1)+'" y="'+(31-hh).toFixed(1)+'" width="18" height="'+hh.toFixed(1)+'" fill="var(--accent)" opacity=".35"/>';}).join("")
    +'<line x1="0" x2="200" y1="31.5" y2="31.5" stroke="var(--border-active)"/></svg>';
}
function csvOf(rows){
  var cols=activeCols().filter(function(c){return c.k!=="sel"&&c.k!=="exp"&&c.k!=="spark";});
  var head=cols.map(function(c){return c.label||c.k;}).join(",");
  var body=rows.map(function(h){
    return cols.map(function(c){
      var v;
      switch(c.k){
        case "name": v=h.sym+" "+h.name; break;
        case "klass": v=h.klass; break; case "plat": v=h.plat; break;
        case "units": v=h.units; break; case "avg": v=h.avg.toFixed(4); break;
        case "inv": v=h.inv.toFixed(2); break;
        case "price": v=h.priced?h.price.toFixed(4):""; break;
        case "mv": v=h.priced?h.mv.toFixed(2):""; break;
        case "day": v=""; break;
        case "wt": v=h.wt===null?"":h.wt.toFixed(4); break;
        case "pnl": v=h.priced?h.pnl.toFixed(2):""; break;
        case "real": v=h.real.toFixed(2); break;
        case "ret": v=h.priced?h.ret.toFixed(4):""; break;
        case "cagr": v=""; break; case "ps": v=h.ps; break; default: v="";
      }
      return /[",]/.test(String(v))? '"'+String(v).replace(/"/g,'""')+'"' : v;

  return head+"\n"+body;

      data:lerpSeries([[0,100],[30,100+(end-100)*.35],[70,100+(end-100)*.12],[120,100+(end-100)*.55],[160,100+(end-100)*.8],[179,end]],180,1.4,
        sym.split("").reduce(function(a,c){return a+c.charCodeAt(0);},0))};

function scHarvest(){
  var ltcgLots=[],lossLots=[],soon=[];
  H.forEach(function(h){
    h.lots.forEach(function(l){
      if(!h.priced) return;
      var mvl=l.q*h.price, gl=mvl-l.cost;
      var rec={h:h,l:l,mv:mvl,gl:gl};
      if(l.bucket==="LTCG" && gl>0 && h.tax!=="DEBT") ltcgLots.push(rec);
      if(gl<0) lossLots.push(rec);
      if(l.bucket==="STCG" && l.toLtcg>0) soon.push(rec);
    });
  });
  H.forEach(function(h){ if(!h.priced) h.lots.forEach(function(l){ if(l.toLtcg>0) soon.push({h:h,l:l,mv:null,gl:null}); }); });
  soon.sort(function(a,b){return a.l.toLtcg-b.l.toLtcg;});
  var headroom=LTCG_EXEMPTION-FY27.realisedLtcgEquity;
  var available=ltcgLots.reduce(function(a,r){return a+r.gl;},0);
  var losses=lossLots.reduce(function(a,r){return a+r.gl;},0);
  var usedPct=FY27.realisedLtcgEquity/LTCG_EXEMPTION*100;
  var availPct=Math.min(100-usedPct,available/LTCG_EXEMPTION*100);

  return pageHead("Tax harvesting",
    'What you could realise before 31 March 2027 without paying long-term capital gains tax, and which losses are sitting there to offset the rest.',
    '<span class="chip new">NEW</span> <span class="chip">FY 2026-27</span>')
  +'<div class="kpis">'
   +kpi({label:"LTCG exemption",value:compact(LTCG_EXEMPTION),delta:"Per financial year, equity only",deltaCls:"muted"})
   +kpi({label:"Already used",value:compact(FY27.realisedLtcgEquity),delta:"BAJFINANCE · 12 Jun 2026",deltaCls:"muted"})
   +kpi({label:"Headroom left",value:compact(headroom),delta:"Until 31 Mar 2027",deltaCls:"gain"})
   +kpi({label:"Unrealised LTCG available",value:compact(available,true),delta:ltcgLots.length+" lots already past 12 months",deltaCls:"gain"})
   +kpi({label:"Losses available to offset",value:compact(losses,true),delta:lossLots.length+" lots underwater",deltaCls:"loss"})
   +kpi({label:"Tax saved if harvested",value:compact(Math.min(available,headroom)*0.125),delta:"At 12.5% on the sheltered amount",deltaCls:"gain"})
  +'</div>'
  +'<div class="card" style="margin-top:12px"><h2>Exemption headroom</h2>'
    +'<p class="cap">The '+money(LTCG_EXEMPTION)+' exemption resets every financial year. Unused headroom does not carry forward.</p>'
    +'<svg viewBox="0 0 700 44" width="100%" height="44" role="img" aria-label="Exemption headroom: '+dp(usedPct,0)+'% used, '+dp(availPct,0)+'% harvestable">'
    +'<rect x="0" y="8" width="700" height="24" rx="3" fill="var(--bg-subtle)"/>'
    +'<rect x="0" y="8" width="'+(usedPct/100*700).toFixed(1)+'" height="24" rx="3" fill="var(--n-400)"><title>Already used '+money(FY27.realisedLtcgEquity)+'</title></rect>'
    +'<rect x="'+(usedPct/100*700+2).toFixed(1)+'" y="8" width="'+(availPct/100*700-2).toFixed(1)+'" height="24" rx="3" fill="var(--gain)" opacity=".75"><title>Harvestable now '+money(Math.min(available,headroom))+'</title></rect>'
    +'<text class="axl" x="4" y="42">₹0</text><text class="axl" x="696" y="42" text-anchor="end">'+money(LTCG_EXEMPTION)+'</text></svg>'
    +'<div class="lgd"><span><i class="sq" style="background:var(--n-400)"></i>Realised this FY '+money(FY27.realisedLtcgEquity)+'</span>'
    +'<span><i class="sq" style="background:var(--gain);opacity:.75"></i>Harvestable now '+money(Math.min(available,headroom))+'</span>'
    +'<span><i class="sq" style="background:var(--bg-subtle);border:1px solid var(--border-active)"></i>Unused '+money(headroom-Math.min(available,headroom))+'</span></div></div>'
  +'<div class="card" style="margin-top:12px"><h2>Harvest candidates — gains inside the exemption</h2>'
    +'<p class="cap">Lots already past twelve months. Selling and rebuying resets the cost basis upward at no tax cost while headroom lasts.</p>'
    +'<table><thead><tr><th>Holding</th><th>Lot</th><th class="num">Units</th><th class="num">Cost</th><th class="num">Market value</th>'
    +'<th class="num">Unrealised gain</th><th class="num">Cumulative</th><th>Fits headroom</th></tr></thead><tbody>'
    +(function(){var run=0;return ltcgLots.sort(function(a,b){return b.gl-a.gl;}).map(function(r){
      run+=r.gl; var fits=run<=headroom;

document.addEventListener("click",function(e){
  var t=e.target;
  var pb=t.closest("[data-pop]");
  if(pb){ S.pop = S.pop===pb.getAttribute("data-pop")? null : pb.getAttribute("data-pop"); render(); return; }
  if(!t.closest(".pop")) { if(S.pop){S.pop=null; render();} }

  var el;
  if((el=t.closest("[data-sort]"))){ toggleSort(el.getAttribute("data-sort"), e.shiftKey); return; }
  if((el=t.closest("[data-dens]"))){ S.density=el.getAttribute("data-dens");
    try{localStorage.setItem("sm-density",S.density);}catch(x){} render(); return; }
  if((el=t.closest("[data-exp]"))){ var s=el.getAttribute("data-exp"); S.expanded = S.expanded===s? null:s; render(); return; }
  if((el=t.closest("[data-rmchip]"))){
    var v=el.getAttribute("data-rmchip");
    if(v==="q") S.q=""; else if(v==="min") S.minMv=null; else if(v==="max") S.maxMv=null;
    else if(v==="losers") S.onlyLosers=false;
    else if(v==="bucket") S.lotBucket=null;
    else if(v==="divs") S.dividendOnly=false;
    else if(v==="limit") S.limit=null;
    else { var p=v.split(":"), arr = p[0]==="klass"?S.fKlass:p[0]==="plat"?S.fPlat:S.fPs;
      arr.splice(arr.indexOf(p.slice(1).join(":")),1); }
    render(); return; }
  if(t.id==="clrF"||t.id==="clrF2"){ S.q="";S.fKlass=[];S.fPlat=[];S.fPs=[];S.minMv=null;S.maxMv=null;
    S.onlyLosers=false;S.lotBucket=null;S.dividendOnly=false;S.limit=null; render(); return; }
  if(t.id==="clrS"){ S.sort=[]; render(); return; }
  if(t.id==="clrSel"){ S.selected={}; render(); return; }
  if(t.id==="colReset"){ COLS.forEach(function(c){S.cols[c.k]= c.k!=="cagr";}); render(); return; }
  if(t.id==="expAll"||t.id==="expSel"||t.id==="itrExport"){ S.showCsv=true; render();
    var ta=document.getElementById("csvText"); if(ta) ta.scrollIntoView({block:"center"}); return; }
  if(t.id==="closeCsv"){ S.showCsv=false; render(); return; }
  if(t.id==="copyCsv"){ var ta2=document.getElementById("csvText");
    try{ navigator.clipboard.writeText(ta2.value).then(function(){t.textContent="Copied";},function(){ta2.select();t.textContent="Select + copy";}); }
    catch(x){ ta2.select(); t.textContent="Select + copy"; } return; }
  if(t.id==="selAll"){ return; }
  if((el=t.closest("[data-range-preset]"))){
    var rp=el.getAttribute("data-range-preset");
    if(rp){S.minMv=+rp;} else {S.minMv=null;S.maxMv=null;}
    render(); return; }
  if((el=t.closest("[data-goto]"))){ S.instrument=el.getAttribute("data-goto"); S.screen="detail"; S.detailTab="summary"; render(); window.scrollTo(0,0); return; }
  if((el=t.closest("[data-dtab]"))){ S.detailTab=el.getAttribute("data-dtab"); try{location.hash="detail";}catch(x){} render(); return; }
  if((el=t.closest("[data-view]"))){ applyView(el.getAttribute("data-view")); render(); return; }
  if(t.id==="vReset"){ applyView(S.view); render(); return; }
  if(t.id==="vSave"||t.id==="vNew"){
    var id="c"+(S.customViews.length+2);
    S.customViews.push({id:id,name:t.id==="vNew"?"Untitled view":"Copy of "+((viewById(S.view)||{}).name||"view")});
    S.view=id; render(); return; }
  if((el=t.closest("[data-vact]"))){
    var act=el.getAttribute("data-vact");
    if(act==="delete" && S.view.charAt(0)==="c"){
      S.customViews=S.customViews.filter(function(c){return c.id!==S.view;}); applyView("all"); }
    else if(act==="duplicate"){
      var nid="c"+(S.customViews.length+2);
      S.customViews.push({id:nid,name:"Copy of "+((viewById(S.view)||{}).name||"view")}); S.view=nid; }
    S.pop=null; render(); return; }
  if((el=t.closest("[data-fy]"))){ S.fy=el.getAttribute("data-fy"); render(); return; }
  if((el=t.closest("[data-step]"))){ S.step=+el.getAttribute("data-step"); render(); window.scrollTo(0,0); return; }
  if((el=t.closest("[data-cmp]"))){
    var sym=el.getAttribute("data-cmp"), i=S.compare.indexOf(sym);
    if(i>=0){ if(S.compare.length>2) S.compare.splice(i,1); }
    else if(S.compare.length<5) S.compare.push(sym);
    render(); return; }
  if((el=t.closest("[data-refresh]"))){ el.innerHTML=svg("check",12)+'<span>Queued</span>'; el.classList.add("on");
    el.setAttribute("aria-disabled","true"); return; }
  if(t.id==="refreshAll"){ t.innerHTML=svg("check",13)+'<span>Refresh queued for 5 sources</span>';
    t.classList.add("on"); return; }   /* confirmation wears --accent; green stays money-up */
  if(t.closest(".mcard")){ S.instrument=t.closest(".mcard").getAttribute("data-row"); S.screen="detail"; render(); window.scrollTo(0,0); return; }
});
document.addEventListener("change",function(e){
  var t=e.target, el;
  if(t.id==="grp"){ S.group=t.value; render(); return; }
  if(t.id==="selAll"){ var rows=sorted(filtered());
    var on=t.checked; rows.forEach(function(h){S.selected[h.sym]=on;}); render(); return; }
  if((el=t.closest("[data-sel]"))){ S.selected[el.getAttribute("data-sel")]=el.checked; render(); return; }
  if((el=t.closest("[data-col]"))){ S.cols[el.getAttribute("data-col")]=el.checked; render(); return; }
  if((el=t.closest("[data-facet]"))){
    var g=el.getAttribute("data-facet"), arr = g==="klass"?S.fKlass:g==="plat"?S.fPlat:S.fPs;
    var v=el.value, i=arr.indexOf(v);
    if(el.checked && i<0) arr.push(v); else if(!el.checked && i>=0) arr.splice(i,1);
    render(); return; }
  if(t.id==="dsel"){ S.instrument=t.value; render(); return; }
  if(t.id==="minMv"){ S.minMv = t.value===""? null : +t.value; render(); return; }
  if(t.id==="maxMv"){ S.maxMv = t.value===""? null : +t.value; render(); return; }
});
var qTimer=null;
document.addEventListener("input",function(e){
  if(e.target.id==="hq"||e.target.id==="hq2"){
    var v=e.target.value, id=e.target.id;
    clearTimeout(qTimer);
    qTimer=setTimeout(function(){ S.q=v; render();
      var f=document.getElementById(id); if(f){f.focus(); try{f.setSelectionRange(v.length,v.length);}catch(x){}} },150);
  }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && e.target.matches && e.target.matches("[data-sort]")){
    e.preventDefault(); toggleSort(e.target.getAttribute("data-sort"), e.shiftKey);
  }
  if(e.key==="Escape" && S.pop){ S.pop=null; render(); }
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){applyTheme();render();});
render();
</script>

</body></html>

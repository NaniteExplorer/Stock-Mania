apiVersion: apps/v1
kind: Deployment
metadata:
  name: stockmania
  namespace: stockmania
  labels:
    app: stockmania
spec:
  replicas: 3
  selector:
    matchLabels:
      app: stockmania
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: stockmania
    spec:
      containers:
        - name: stockmania
          image: ghcr.io/your-org/stockmania:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: stockmania-config
            - secretRef:
                name: stockmania-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: stockmania
